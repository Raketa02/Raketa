# Optional on-host production compose for non-ECS deployments (legacy EC2 path).
# The primary production target is AWS ECS/Fargate — see docs/deployment/aws-ecs.md.
# All secrets are expected to come from the environment, not from this file.
services:
  api:
    image: ${API_IMAGE:-raketa_api:prod}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      EVENT_DELIVERY_WORKER_ENABLED: "true"
    ports:
      - "8000:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    driver: bridge
