[tool.poetry]
name = "rakieta"
version = "0.1.0"
description = "Rakieta backend service"
authors = ["robert <robert.constantindinescu@gmail.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11.6"
alembic = "^1.18.4"
SQLAlchemy = "^2.0.49"
PyJWT = "^2.12.1"
uvicorn = "^0.47.0"
fastapi = "^0.136.1"
celery = "^5.6.3"
gunicorn = "^26.0.0"
fastapi-event = "^0.1.3"
pythondi = "^1.2.4"
click = "^8.4.0"
greenlet = "^3.5.1"
redis = "^7.4.0"
arrow = "^1.4.0"
orjson = "^3.11.9"
aiohttp = "^3.13.5"
asyncpg = "^0.31.0"
python-dotenv = "^1.2.2"
types-redis = "^4.6.0.20241004"
nest-asyncio = "^1.6.0"
sqlalchemy-utils = "^0.42.1"
bcrypt = "^5.0.0"
psycopg2-binary = "^2.9.12"
debugpy = "^1.8.20"
email-validator = "^2.3.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
pillow = "^12.3.0"
pillow-heif = "^1.5.0"
aioboto3 = "^15.5.0"
stripe = "^15.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
black = "^26.5.1"
isort = "^8.0.1"
mypy = "^2.1.0"
behave = "^1.3.3"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
pytest-mock = "^3.15.1"
pytest-env = "^1.6.0"
autoflake = "^2.3.3"
aiosqlite = "^0.22.1"
ruff = "^0.15.13"
watchfiles = "^1.2.0"
import-linter = "^2.0"
pytest-xdist = "^3.8.0"
pytest-split = "^0.11.0"
pytest-testmon = "^2.2.0"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
include_trailing_comma = true
multi_line_output = 3
line_length = 88
force_grid_wrap = 0

[tool.mypy]
ignore_missing_imports = "True"
mypy_path = "."
#check_untyped_defs = "True"
#disallow_untyped_defs = "True"
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

# The kernel and the engines are typechecked strictly; the rest of the tree keeps
# the settings above. Global strict would fail today, and a gate that cannot be
# turned on is not a gate — so it is scoped to the two packages ADR-0015 makes
# claims about, where an implicit `Any` is how a pure computation stops being one.
#
# `strict` itself is a global-only flag, so the flags it implies are listed. That
# is also why they are worth reading: `warn_return_any` is the one that catches
# `x ** 0.5` (typeshed returns `Any` for float ** float, since a negative base
# gives a complex), and `warn_unused_ignores` is what stops a `# type: ignore`
# being parked here and outliving the error it silenced.
#
# The bare-parent entries matter: mypy's `app.kernel.*` does NOT match
# `app.kernel` itself, so without them the two package `__init__` files would be
# the one place strict did not reach.
[[tool.mypy.overrides]]
module = [
    "app.kernel",
    "app.kernel.*",
    "app.engines",
    "app.engines.*",
]
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
extra_checks = true
strict_equality = true
no_implicit_reexport = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true
use_shortcuts = true

[tool.pytest.ini_options]
# No coverage by default (ADR-0181); `make coverage` measures it on demand.
addopts = "--tb=short --disable-warnings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
env = { SQLALCHEMY_SILENCE_UBER_WARNING = "1" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations", ".venv", "src"]

[tool.ruff.lint]
select = ["E", "F", "B"]  # E = pycodestyle, F = pyflakes, B = bugbear
ignore = ["B008"]
