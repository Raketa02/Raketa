[tool.poetry]
name = "raketa"
version = "0.1.0"
description = "Raketa backend service"
authors = ["robert <robert.constantindinescu@gmail.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11.6"
alembic = "^1.18.4"
SQLAlchemy = "^2.0.49"
PyJWT = "^2.12.1"
uvicorn = "^0.47.0"
fastapi = "^0.136.1"
celery = "^5.6.3"
gunicorn = "^26.0.0"
fastapi-event = "^0.1.3"
pythondi = "^1.2.4"
click = "^8.4.0"
greenlet = "^3.5.1"
redis = "^7.4.0"
arrow = "^1.4.0"
orjson = "^3.11.9"
aiohttp = "^3.13.5"
asyncpg = "^0.31.0"
python-dotenv = "^1.2.2"
types-redis = "^4.6.0.20241004"
nest-asyncio = "^1.6.0"
sqlalchemy-utils = "^0.42.1"
bcrypt = "^5.0.0"
psycopg2-binary = "^2.9.12"
debugpy = "^1.8.20"
email-validator = "^2.3.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
black = "^26.5.1"
isort = "^8.0.1"
mypy = "^2.1.0"
behave = "^1.3.3"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
pytest-mock = "^3.15.1"
pytest-env = "^1.6.0"
autoflake = "^2.3.3"
aiosqlite = "^0.22.1"
ruff = "^0.15.13"
watchfiles = "^1.2.0"
import-linter = "^2.0"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
include_trailing_comma = true
multi_line_output = 3
line_length = 88
force_grid_wrap = 0

[tool.mypy]
ignore_missing_imports = "True"
mypy_path = "."
#check_untyped_defs = "True"
#disallow_untyped_defs = "True"
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true
use_shortcuts = true

[tool.pytest.ini_options]
addopts = "--tb=short --disable-warnings --cov=app --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
env = { SQLALCHEMY_SILENCE_UBER_WARNING = "1" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations", ".venv", "src"]

[tool.ruff.lint]
select = ["E", "F", "B"]  # E = pycodestyle, F = pyflakes, B = bugbear
ignore = ["B008"]
