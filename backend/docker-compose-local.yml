# Named explicitly, because Compose otherwise derives the project name from the
# directory — which here is `backend`, a name generic enough that a second project
# on the same machine can claim it. When that happens the two share `backend_pgdata`,
# and the loser is whichever stack starts second: Postgres applies POSTGRES_USER and
# POSTGRES_PASSWORD only when it initialises an *empty* data directory, so an existing
# volume keeps the other project's roles and the API dies on "password authentication
# failed for user raketa_user" — with a healthy database sitting right next to it.
name: raketa

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: raketa
      POSTGRES_USER: raketa_user
      POSTGRES_PASSWORD: raketa_pwd
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raketa_user -d raketa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    image: raketa_api:dev
    container_name: raketa_api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Compose overrides — keep DB url consistent with the postgres service above.
      WRITER_DB_URL: postgresql+asyncpg://raketa_user:raketa_pwd@db:5432/raketa
      READER_DB_URL: postgresql+asyncpg://raketa_user:raketa_pwd@db:5432/raketa
      DB_SSL_MODE: disable
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      EVENT_DELIVERY_WORKER_ENABLED: "true"
      # Photo storage — keep in step with the `minio` service below.
      #
      # Two endpoints, because they are reached differently. The API calls MinIO
      # over the compose network; a presigned URL is opened by a *phone*, which
      # cannot resolve `minio`. SigV4 signs the host, so the signing endpoint has
      # to be the one the device will actually connect to.
      #
      # `localhost` works for an iOS simulator and a browser on this machine. A
      # physical phone needs your laptop's LAN IP here — the same value, and for
      # the same reason, as EXPO_PUBLIC_API_URL in the player app.
      PHOTO_STORAGE_ENDPOINT_URL: http://minio:9000
      PHOTO_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      PHOTO_STORAGE_BUCKET: raketa-player-photos
      PHOTO_STORAGE_ACCESS_KEY: raketa_photos
      PHOTO_STORAGE_SECRET_KEY: raketa_photos_pwd
      PYTHONPYCACHEPREFIX: /tmp/pycache
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
      - "5678:5678"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      # Hot-reload the source while developing.
      - ./app:/home/app/app
      - ./migrations:/home/app/migrations
      - ./alembic.ini:/home/app/alembic.ini
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for player photos — S3-compatible, so the deployed answer is
  # an adapter's endpoint setting rather than a migration of live user data
  # (../docs/adr/0091-photo-storage-behind-a-port.md).
  #
  # This is a real tax on the simplest workflow in the repo, and it is worth
  # naming: a half-up stack now fails photo uploads instead of refusing cleanly.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: raketa_photos
      MINIO_ROOT_PASSWORD: raketa_photos_pwd
    ports:
      # 9000 is the S3 API — the port a presigned URL is opened on.
      # 9001 is the browser console, for looking at what got stored.
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and exits. A one-shot rather than the adapter creating
  # buckets on demand: an application that can create a bucket is an application
  # whose credentials can create a bucket, and a typo'd name would then be a new
  # empty store rather than a loud failure.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 raketa_photos raketa_photos_pwd &&
        mc mb --ignore-existing local/raketa-player-photos &&
        mc anonymous set none local/raketa-player-photos
    restart: "no"

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  miniodata:
