<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raketa — games test console</title>
<!--
  The games test console (docs/adr/0194, #590). One file, no build: no npm, no
  bundler, no codegen and no lint lane. It is served by the dev surface beside
  its routes, in `local` only.

  Three things this page will not do, and each of them is load-bearing:

  1. **It holds no token, so it stores none.** A press names the account it
     acts as in its path (`/dev/as/{player_id}/…`, or the club's,
     `/dev/clubs/{club_id}/…`) and the server refuses any account the seed did
     not create. Nothing is kept in the browser between loads, and a reload
     starts from nothing.
  2. **It shows who is acting on every row.** Many people are on one screen at
     once, so every button sits on the row of the person it acts as, beside
     their name and face — and the club's on its game's pane, under the club's
     name. The protagonist — the phone in the tester's hand — is marked; a
     situation writes her past as the seed does, and never presses for her now.
  3. **Nothing acts on its own.** Every press refreshes what it changed, and
     the Refresh button covers the rest: nothing answers, runs or fetches
     unless the tester presses. **The one timer in this file redraws the
     countdowns' numbers and does nothing else** (`redrawCountdowns`, #592) —
     a countdown says when a *Run it now* will find something; pressing it is
     still the tester's.
-->
<style>
  :root {
    --ink: #16181d; --dim: #6a7080; --line: #d9dde5; --bg: #f6f7f9;
    --card: #fff; --accent: #1f6feb; --bad: #b42318; --good: #067647; --warn: #b54708;
    --soft: #eef2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 10px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); margin: 0 8px 0 0; font-weight: 600; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; max-width: 1400px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  section > h2 {
    margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
  }
  .body { padding: 12px 14px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 12px; }
  button { font: inherit; padding: 4px 11px; border: 1px solid var(--line);
    background: var(--card); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; filter: brightness(1.08); }
  button.expected { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .note { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: var(--dim); }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  .pill { display: inline-block; padding: 0 8px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 11px; letter-spacing: .03em; white-space: nowrap; }
  .pill.in, .pill.FILLED, .pill.BOOKED, .pill.CAPTURED { color: var(--good); border-color: var(--good); }
  .pill.no, .pill.EXPIRED, .pill.CALLED_OFF, .pill.FAILED, .pill.TURNED_DOWN,
  .pill.WITHDRAWN, .pill.COURT_HOUR_LOST, .pill.CANCELLED { color: var(--bad); border-color: var(--bad); }
  .pill.phone { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.FILLING, .pill.SEAT_OPEN, .pill.WAITING_FOR_THE_CLUB, .pill.TAKING { color: var(--warn); border-color: var(--warn); }
  #outcome { padding: 8px 12px; border-radius: 6px; background: var(--soft); min-height: 34px; }
  #outcome.bad { background: #fef3f2; }

  .people { display: grid; gap: 8px; }
  .person { display: grid; grid-template-columns: 220px 1fr; gap: 12px;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .person.phone { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .who { display: flex; gap: 10px; align-items: flex-start; }
  .face { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none;
    background: var(--soft); display: grid; place-items: center; font-weight: 700; color: var(--dim); }
  .who .name { font-weight: 700; font-size: 15px; }
  .cards { display: grid; gap: 6px; }
  .rowcard { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 6px 8px; background: var(--soft); border-radius: 6px; }
  .rowcard .when { font-weight: 600; min-width: 130px; }

  .games { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .game { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .game.over { opacity: .6; }
  .game h3 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; }
  dt { color: var(--dim); font-size: 12px; }
  dd { margin: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  input[type=number] { font: inherit; width: 64px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
  .club { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card-on-file { margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .notices td { white-space: nowrap; }
  .moment { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .moment .countdown { font-variant-numeric: tabular-nums; color: var(--warn); }
  .moment .countdown.due { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Raketa · games test console</h1>
  <label>Group <select id="group"></select></label>
  <label>Sport <select id="sport"></select></label>
  <label>The phone <select id="protagonist"></select></label>
  <button id="refresh" class="primary">Refresh</button>
  <span class="note">local only · acts as seed accounts, without signing in</span>
</header>

<main>
  <section>
    <h2>Situations</h2>
    <div class="body">
      <div class="row">
        <button id="fresh-deal">1 · Fresh deal</button>
        <button id="needs-her-yes">2 · Needs <span class="her">her</span> yes · Instant club</button>
        <button id="card-declines">4 · Card declines at the fill</button>
        <button id="about-to-expire">5 · About to expire</button>
        <button id="empty-seat">7 · Empty seat at the cut-off</button>
        <button id="check-in">11 · Check-in at the club</button>
        <button id="day-close">12 · Club day close</button>
      </div>
      <div class="row">
        <button id="on-request">3 · Needs <span class="her">her</span> yes · On request club</button>
        <label>club asked already, answer due in
          <input id="answer-due" type="number" min="1" max="60" placeholder="—"> min</label>
        <span class="note">empty: her yes on the phone asks the club</span>
      </div>
      <div class="row" id="jobs">
        <strong>Run it now</strong>
        <span class="note">acts only on what is already due</span>
      </div>
      <div class="row">
        <strong>Payment provider</strong>
        <label><input id="refunds-wait" type="checkbox"> Refunds wait until delivered</label>
        <span id="provider-note" class="note"></span>
      </div>
      <div id="outcome" class="note">Pick a group. Every press refreshes the board; Refresh covers the rest.</div>
    </div>
  </section>

  <section>
    <h2>People <span id="people-note" class="note"></span></h2>
    <div class="body"><div id="people" class="people"></div></div>
  </section>

  <section>
    <h2>Games <span id="games-note" class="note"></span></h2>
    <div class="body">
      <div class="row">
        <label>Show <select id="show">
          <option value="all">every game in the last day and ahead</option>
          <option value="moving">games with somebody In, a booking or a charge</option>
        </select></label>
      </div>
      <div id="games" class="games"></div>
    </div>
  </section>
</main>

<script>
"use strict";

const state = { groups: null, board: null, protagonist: null, notices: {}, freeCourts: {}, jobs: [] };
const $ = (id) => document.getElementById(id);

// --------------------------------------------------------------------------
// Words
// --------------------------------------------------------------------------

const WARSAW = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Europe/Warsaw", weekday: "short", day: "2-digit", month: "short",
  hour: "2-digit", minute: "2-digit",
});
const when = (iso) => (iso ? WARSAW.format(new Date(iso)) : "—");
const CLOCK = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Europe/Warsaw", hour: "2-digit", minute: "2-digit",
});
const DAY = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Warsaw", dateStyle: "short" });

// "fires at 15:00 · 40 min", counted from this laptop's clock — the server's
// too, since neither ever moves (docs/adr/0194 §4).
function firesAt(iso, now) {
  const at = new Date(iso);
  const seconds = Math.ceil((at.getTime() - now) / 1000);
  if (seconds <= 0) return `due since ${CLOCK.format(at)} · Run it now`;
  const minutes = Math.ceil(seconds / 60);
  const left = seconds < 60 ? `${seconds} s`
    : minutes < 120 ? `${minutes} min`
    : `${Math.floor(minutes / 60)} h ${String(minutes % 60).padStart(2, "0")} min`;
  const today = DAY.format(at) === DAY.format(new Date(now));
  return `fires at ${today ? CLOCK.format(at) : when(iso)} · ${left}`;
}
const zl = (grosze) => (grosze === null || grosze === undefined ? "—" : (grosze / 100).toFixed(2) + " zł");

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}
const nameOf = (ref) => esc(ref?.name ?? "(unnamed)");
const names = (refs) => (refs && refs.length ? refs.map(nameOf).join(", ") : "nobody");
const pill = (text, kind) => `<span class="pill ${esc(kind ?? text)}">${esc(text)}</span>`;
const firstName = (name) => (name ? String(name).split(" ")[0] : "her");
const ANSWER_LOOK = { IN: "in", SAID_NO: "no" };
const answerPill = (answer) => pill(answer, ANSWER_LOOK[answer] ?? "");

// --------------------------------------------------------------------------
// The wire — no token: the acting account is in the path
// --------------------------------------------------------------------------

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (_) { json = null; }
  return { ok: response.ok, status: response.status, json, text };
}

function say(outcome, words) {
  const box = $("outcome");
  if (outcome && !outcome.ok) {
    const code = outcome.json?.code ?? outcome.status;
    const message = outcome.json?.message ?? outcome.text;
    box.className = "bad";
    box.innerHTML = `${words} → <strong>${esc(code)}</strong> · ${esc(message)}`;
  } else {
    box.className = "";
    box.innerHTML = words;
  }
}

// --------------------------------------------------------------------------
// Reading
// --------------------------------------------------------------------------

async function loadGroups() {
  const read = await call("GET", "/dev/groups");
  if (!read.ok) { say(read, "Reading the groups"); return; }
  state.groups = read.json;
  const chosen = $("group").value;
  $("group").innerHTML = read.json.groups.map((g) =>
    `<option value="${g.group_id}">${g.holds_the_protagonist ? "★ " : ""}` +
    `${esc(g.name)} · ${esc(g.club_name ?? "?")} · ` +
    `${g.seed_members} seeded${g.other_members ? ` + ${g.other_members} other` : ""}</option>`
  ).join("");
  if (chosen) $("group").value = chosen;
  if (!$("sport").options.length) {
    $("sport").innerHTML = read.json.sports.map((s) => `<option>${s}</option>`).join("");
  }
  if (!read.json.groups.length) {
    say(null, "No group has a seeded member. Run <code>make seed</code>.");
  }
}

async function loadBoard() {
  const group = $("group").value;
  if (!group) return;
  const read = await call("GET", `/dev/groups/${group}?sport=${$("sport").value}`);
  if (!read.ok) { say(read, "Reading the board"); return; }
  state.board = read.json;
  drawProtagonist();
  drawProvider();
  drawPeople();
  drawGames();
}

async function loadJobs() {
  const read = await call("GET", "/dev/jobs");
  if (!read.ok) { say(read, "Reading the jobs"); return; }
  state.jobs = read.json.jobs;
  const row = $("jobs");
  row.querySelectorAll("button").forEach((b) => b.remove());
  const note = row.querySelector(".note");
  state.jobs.forEach((j) => {
    const button = document.createElement("button");
    button.dataset.job = j.job;
    button.textContent = j.title;
    row.insertBefore(button, note);
  });
}

async function refresh() {
  await loadGroups();
  await loadJobs();
  await loadBoard();
}

// --------------------------------------------------------------------------
// The protagonist — the phone
// --------------------------------------------------------------------------

function drawProtagonist() {
  const rows = state.board.people;
  const chosen = state.protagonist;
  const fallback = state.groups?.protagonist?.player_id;
  const pick = rows.some((r) => r.player_id === chosen) ? chosen
    : rows.some((r) => r.player_id === fallback) ? fallback
    : rows[0]?.player_id ?? null;
  state.protagonist = pick;
  $("protagonist").innerHTML = rows.map((r) =>
    `<option value="${r.player_id}">${nameOf(r)} · ${esc(r.email)}</option>`).join("");
  if (pick) $("protagonist").value = pick;
  const her = rows.find((r) => r.player_id === pick);
  document.querySelectorAll(".her").forEach((el) => { el.textContent = firstName(her?.name) + "'s"; });
}

// --------------------------------------------------------------------------
// People rows — every button acts as the row's own person
// --------------------------------------------------------------------------

const EXPECTED = { DEALT: ["yes", "no"], IN: ["withdraw"], WITHDREW: ["yes"], REOPENED: ["yes"] };

function drawPeople() {
  const board = state.board;
  const others = board.group.other_members;
  $("people-note").textContent = `· ${board.people.length} seeded` +
    (others ? ` · ${others} other member(s) the console will not act as` : "");
  $("people").innerHTML = board.people.map((row) => {
    const phone = row.player_id === state.protagonist;
    const face = row.photo_url
      ? `<img class="face" src="${esc(row.photo_url)}" alt="">`
      : `<div class="face">${esc((row.name ?? "?").slice(0, 1))}</div>`;
    const cards = row.cards.length ? row.cards.map((card) => {
      const expected = EXPECTED[card.answer] ?? [];
      const button = (verb, label) =>
        `<button class="${expected.includes(verb) ? "expected" : ""}" ` +
        `data-act="${verb}" data-player="${row.player_id}" data-game="${card.proposal_id}" ` +
        `data-who="${esc(row.name ?? row.email)}">${label}</button>`;
      return `<div class="rowcard">
        <span class="when">${when(card.starts_at)}</span>
        ${pill(card.kind, "kind")}
        ${answerPill(card.answer)}
        <span>In: ${names(card.people_in)} · ${card.open_seats} open</span>
        <span class="row">${button("yes", "Yes")}${button("no", "No")}${button("withdraw", "Withdraw")}</span>
        <span class="mono">${esc(card.proposal_id.slice(0, 8))}</span>
      </div>`;
    }).join("") : `<div class="note">No card in ${esc(board.sport.toLowerCase())}.</div>`;
    return `<div class="person ${phone ? "phone" : ""}">
      <div class="who">${face}<div>
        <div class="name">${nameOf(row)} ${phone ? pill("the phone", "phone") : ""}</div>
        <div class="mono">${esc(row.email)}</div>
        <div class="note">Level ${row.level === null ? "—" : row.level.toFixed(2)}</div>
        ${cardOnFile(row)}
      </div></div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join("");
}

const VERBS = {
  yes: ["POST", "yes", "Yes"],
  no: ["POST", "no", "No"],
  withdraw: ["DELETE", "yes", "Withdraw"],
};

async function act(button) {
  const [method, tail, label] = VERBS[button.dataset.act];
  const { player, game, who } = button.dataset;
  const words = `${esc(who)} · ${label} on ${esc(game.slice(0, 8))}`;
  const done = await call(method, `/dev/as/${player}/proposals/${game}/${tail}`);
  if (done.ok && done.json) {
    const a = done.json;
    const after = a.booked ? "booked — It's a game!"
      : a.waiting_for_the_club ? "full — waiting for the club"
      : a.your_payment ? `payment refused (${esc(a.your_payment.refusal ?? "")})`
      : `${a.open_seats} seat(s) open`;
    say(done, `${words} → ${after}`);
  } else {
    say(done, done.ok ? `${words} → done` : words);
  }
  await loadBoard();
}

// --------------------------------------------------------------------------
// State panes — one per game
// --------------------------------------------------------------------------

function drawGames() {
  const every = state.board.games;
  const games = $("show").value === "all" ? every
    : every.filter((g) => g.people_in.length || g.booking || g.charges.length);
  $("games-note").textContent =
    `· ${games.length} of ${every.length} · read ${when(state.board.read_at)}`;
  $("games").innerHTML = games.length ? games.map((game) => {
    const booking = game.booking;
    const over = !["FILLING", "FILLED"].includes(game.standing);
    const club = game.club.confirms_each_game === null ? "not selling"
      : game.club.confirms_each_game ? "On request" : "Instant";
    const sides = game.sides
      ? `${names(game.sides.first)} <span class="note">v</span> ${names(game.sides.second)}`
      : "—";
    const versions = game.versions.map((v) =>
      `<div>v${v.number}: ${v.people.map((p) => `${nameOf(p)} ${answerPill(p.answer)}`).join(" ")}</div>`
    ).join("") || "—";
    const departures = booking && booking.departures.length
      ? booking.departures.map((d) => `${nameOf(d.player)} left ${when(d.at)}` +
          (d.rescued_by ? ` · seat taken by ${nameOf(d.rescued_by)}` : " · seat open")).join("<br>")
      : "—";
    const charges = game.charges.length ? `<table>
      <thead><tr><th>Who</th><th>Share</th><th>Status</th><th>Taken</th><th>Refund</th><th>Provider</th></tr></thead>
      <tbody>${game.charges.map((c) => `<tr>
        <td>${nameOf(c.player)}</td>
        <td>${zl(c.amount_grosze)}</td>
        <td>${pill(c.status)}${c.failure ? ` <span class="bad">${esc(c.failure)}</span>` : ""}</td>
        <td>${when(c.taken_at)}</td>
        <td>${c.refund ? `${zl(c.refund.given_back_grosze)}` +
          (c.refund.withholds_fee ? " less fee" : " in full") +
          (c.refund.given_at ? ` · given ${when(c.refund.given_at)}` : " · decided, on its way") : "—"}</td>
        <td>${chargeButtons(c)}</td>
      </tr>`).join("")}</tbody></table>` : `<span class="note">no charge</span>`;
    return `<div class="game ${over ? "over" : ""}">
      <h3>${when(game.starts_at)} · ${esc(game.club.name ?? "?")}
        ${pill(game.standing)} ${booking ? pill(booking.state) : ""}
        ${game.waiting_for_the_club ? pill("waiting for the club", "WAITING_FOR_THE_CLUB") : ""}</h3>
      <dl>
        <dt>Game</dt><dd>${esc(game.origin)} · ${esc(game.kind)} · ${club}${game.poster ? ` · posted by ${nameOf(game.poster)}` : ""}
          <span class="mono">${esc(game.game_id.slice(0, 8))}</span></dd>
        <dt>In</dt><dd>${names(game.people_in)} · ${game.open_seats} of ${game.seats} open</dd>
        <dt>Sides</dt><dd>${sides}</dd>
        <dt>Dealt</dt><dd>${versions}</dd>
        <dt>Court hour</dt><dd>${when(game.starts_at)}${booking ? ` · ${esc(booking.court_name)}` : ""}</dd>
        <dt>Book by</dt><dd>${when(game.book_by)}</dd>
        <dt>Cut-off</dt><dd>${when(game.cut_off)}</dd>
        <dt>Share</dt><dd>${zl(game.share_grosze)}</dd>
        ${booking ? `
        <dt>Booking</dt><dd>${pill(booking.state)}${booking.called_off ? ` ${esc(booking.called_off)}` : ""}
          ${booking.cancel_reason ? ` · ${esc(booking.cancel_reason)}` : ""}
          ${booking.booked_at ? ` · booked ${when(booking.booked_at)}` : ""}
          ${booking.answer_by ? ` · club answers by ${when(booking.answer_by)}` : ""}</dd>
        <dt>Left</dt><dd>${departures}</dd>
        <dt>Checked in</dt><dd>${names(booking.checked_in)}</dd>` : ""}
        <dt>Pending</dt><dd>${momentsOf(game)}</dd>
        <dt>Money</dt><dd>${charges}</dd>
        <dt>${esc(game.club.name ?? "The club")}</dt><dd>${clubButtons(game)}</dd>
        ${game.charges.length ? `<dt>Notices</dt><dd>${noticesOf(game)}</dd>` : ""}
      </dl>
    </div>`;
  }).join("") : `<div class="note">Nothing to show. Try <em>Fresh deal</em>, or show every game.</div>`;
}

const MOMENT_WORDS = {
  BOOK_BY: "Book-by", CLUB_ANSWER_DUE: "Club's answer due", CUT_OFF: "Cut-off",
  NEW_BOOKINGS_SUMMARY: "Day close · desk told", CLUB_PAYOUT: "Day close · club paid",
};

function momentsOf(game) {
  if (!game.moments.length) return `<span class="note">nothing ahead a job acts at</span>`;
  const now = Date.now();
  return game.moments.map((m) => `<div class="moment">
      <strong>${esc(MOMENT_WORDS[m.moment] ?? m.moment)}</strong>
      <span class="countdown" data-fires-at="${esc(m.at)}">${esc(firesAt(m.at, now))}</span>
      <button data-job="${esc(m.job)}">Run it now</button>
      <span class="note">${esc(m.says)}</span>
    </div>`).join("");
}

// --------------------------------------------------------------------------
// The club row — every button acts as the game's own club
// --------------------------------------------------------------------------

const CANCEL_REASONS = ["WEATHER", "REPAIR", "DOUBLE_BOOKING", "OTHER"];

function clubButtons(game) {
  const booking = game.booking;
  if (!booking) return `<span class="note">nothing for the club until the game is full</span>`;
  const club = game.club.club_id;
  const id = game.game_id;
  const b = (verb, label, extra = "") =>
    `<button data-club="${verb}" data-club-id="${club}" data-game="${id}" ${extra}>${label}</button>`;
  if (booking.state === "WAITING_FOR_THE_CLUB") {
    return `<span class="club">${b("accept", "Accept")}${b("refuse", "Refuse")}
      <span class="note">answer by ${when(booking.answer_by)}</span></span>`;
  }
  if (booking.state === "CALLED_OFF") return `<span class="note">called off</span>`;
  const courts = state.freeCourts[id];
  const moves = courts === undefined ? b("free-courts", "Move…")
    : courts.length ? courts.map((c) => b("move", `→ ${esc(c.name)}`, `data-court="${c.court_id}"`)).join("")
    : `<span class="note">no free court</span>`;
  const reasons = CANCEL_REASONS.map((r) => `<option>${r}</option>`).join("");
  const checkIns = booking.codes.map((c) =>
    b("check-in", `Check in ${nameOf(c.player)}`, `data-code="${esc(c.short_code)}"`) +
    `<span class="mono">${esc(c.short_code)}</span>`).join("");
  return `<span class="club">${moves}
      <select data-reason-for="${id}">${reasons}</select>${b("cancel", "Cancel")}</span>
    <div class="club">${checkIns}</div>`;
}

async function clubAct(button) {
  const { club: verb, clubId, game, court, code } = button.dataset;
  const at = (tail) => `/dev/clubs/${clubId}/${tail}`;
  const words = `The club · ${verb} on ${esc(game.slice(0, 8))}`;
  let done;
  if (verb === "accept") {
    done = await call("POST", at(`bookings/${game}/acceptance`));
    say(done, done.ok ? `${words} → ${esc(done.json.outcome)}` : words);
  } else if (verb === "refuse") {
    done = await call("POST", at(`bookings/${game}/refusal`));
    say(done, done.ok ? `${words} → refused` : words);
  } else if (verb === "free-courts") {
    done = await call("GET", at(`bookings/${game}/free-courts`));
    if (done.ok) state.freeCourts[game] = done.json.courts;
    say(done, done.ok ? `${words} → ${done.json.courts.length} free court(s)` : words);
    drawGames();
    return;
  } else if (verb === "move") {
    done = await call("POST", at(`bookings/${game}/move`), { court_id: court });
    say(done, done.ok ? `${words} → now on ${esc(done.json.name)}` : words);
  } else if (verb === "cancel") {
    const reason = document.querySelector(`select[data-reason-for="${game}"]`).value;
    done = await call("POST", at(`bookings/${game}/cancellation`), { reason });
    say(done, done.ok ? `${words} → cancelled (${esc(reason)})` : words);
  } else if (verb === "check-in") {
    done = await call("POST", at("check-ins"), { code });
    say(done, done.ok ? `${words} → ${nameOf(done.json.player)} checked in` : words);
  }
  delete state.freeCourts[game];
  await loadBoard();
}

// --------------------------------------------------------------------------
// The payment provider — the process's fake, steered
// --------------------------------------------------------------------------

const OUTCOMES = { SUCCEEDS: "pays", DECLINES: "declines", ASKS_FOR_VERIFICATION: "asks for the bank's check" };

function drawProvider() {
  const payments = state.board.payments;
  $("refunds-wait").disabled = !payments.steerable;
  $("refunds-wait").checked = Boolean(payments.refunds_wait);
  $("provider-note").textContent = payments.steerable
    ? "the in-process fake"
    : "this process pays through a real provider: nothing to steer";
}

function cardOnFile(row) {
  if (!row.card) return `<div class="card-on-file note">no card saved</div>`;
  const options = Object.entries(OUTCOMES).map(([value, label]) =>
    `<option value="${value}" ${row.card.outcome === value ? "selected" : ""}>${label}</option>`).join("");
  return `<div class="card-on-file"><span class="mono">${esc(row.card.brand)} •••• ${esc(row.card.last_four)}</span>
    ${row.card.outcome ? `<select data-card-for="${row.player_id}" data-who="${esc(row.name ?? row.email)}">${options}</select>` : ""}</div>`;
}

async function steerCard(select) {
  const words = `${esc(select.dataset.who)}'s card`;
  const done = await call("PUT", `/dev/payments/cards/${select.dataset.cardFor}`, { outcome: select.value });
  say(done, done.ok ? `${words} → ${esc(done.json.says)}` : words);
  await loadBoard();
}

async function refundsWait() {
  const done = await call("PUT", "/dev/payments/refunds", { wait: $("refunds-wait").checked });
  say(done, done.ok ? esc(done.json.says) : "Refunds");
  await loadBoard();
}

function chargeButtons(c) {
  const b = (verb, label) => `<button data-charge="${verb}" data-id="${c.charge_id}">${label}</button>`;
  return [
    c.status === "FAILED" && c.payment_id ? b("bank-confirms", "Bank confirms") : "",
    c.refund && !c.refund.given_at ? b("refund", "Deliver refund") : "",
  ].join("");
}

async function chargeAct(button) {
  const { charge: verb, id } = button.dataset;
  const done = await call("POST", `/dev/payments/charges/${id}/${verb}`);
  say(done, done.ok ? esc(done.json.says) : `Charge ${esc(id.slice(0, 8))} · ${verb}`);
  await loadBoard();
}

function noticesOf(game) {
  const id = game.game_id;
  const listed = state.notices[id];
  const load = `<button data-notices="read" data-game="${id}">${listed ? "Read again" : "Show"}</button>`;
  if (!listed) return load;
  const b = (verb, label, ids) =>
    `<button data-notices="${verb}" data-game="${id}" data-ids="${esc(ids.join(" "))}">${label}</button>`;
  const rows = listed.map((n) => `<tr>
    <td>${nameOf(n.player)}</td><td class="mono">${esc(n.kind)}</td><td>${pill(n.status)}</td>
    <td>${n.read ? "read ✓" : "—"}</td>
    <td>${b("deliver", "Deliver", [n.notice_id])}${b("deliver", "Twice", [n.notice_id, n.notice_id])}</td>
  </tr>`).join("");
  const newestFirst = listed.map((n) => n.notice_id).reverse();
  return `${load}${listed.length ? b("deliver", "All, newest first", newestFirst) : ""}
    <table class="notices"><tbody>${rows}</tbody></table>`;
}

async function noticesAct(button) {
  const { notices: verb, game, ids } = button.dataset;
  if (verb === "deliver") {
    const done = await call("POST", "/dev/payments/notices/delivery", { notice_ids: ids.split(" ") });
    say(done, done.ok ? esc(done.json.says) : "Delivering notices");
  }
  const read = await call("GET", `/dev/payments/notices?game_id=${game}`);
  if (read.ok) state.notices[game] = read.json.notices;
  else say(read, "Reading the notices");
  await loadBoard();
}

// --------------------------------------------------------------------------
// Run it now
// --------------------------------------------------------------------------

async function runJob(job) {
  const title = state.jobs.find((j) => j.job === job)?.title ?? job;
  const done = await call("POST", `/dev/jobs/${job}`);
  say(done, done.ok ? `Run it now · ${esc(title)} → ${esc(done.json.says)}` : `Run it now · ${esc(title)}`);
  await loadBoard();
}

// The one timer in this file. It redraws the countdowns' numbers from the
// moments already read, and nothing else: no fetch, no press.
function redrawCountdowns() {
  const now = Date.now();
  document.querySelectorAll("[data-fires-at]").forEach((el) => {
    el.textContent = firesAt(el.dataset.firesAt, now);
    el.classList.toggle("due", new Date(el.dataset.firesAt).getTime() <= now);
  });
}

// --------------------------------------------------------------------------
// Situations
// --------------------------------------------------------------------------

async function freshDeal() {
  const done = await call("POST", "/dev/situations/fresh-deal", { group_id: $("group").value });
  say(done, done.ok ? `Fresh deal → ${esc(done.json.says)}` : "Fresh deal");
  await loadBoard();
}

async function needsHerYes() {
  const done = await call("POST", "/dev/situations/needs-her-yes-instant-club", {
    group_id: $("group").value,
    sport: $("sport").value,
    protagonist_id: state.protagonist,
  });
  say(done, done.ok ? `Needs her yes → ${esc(done.json.says)} Say yes on the phone.` : "Needs her yes");
  await loadBoard();
}

function herSituation() {
  return { group_id: $("group").value, sport: $("sport").value, protagonist_id: state.protagonist };
}

async function onRequest() {
  const due = $("answer-due").value;
  const done = await call("POST", "/dev/situations/needs-her-yes-on-request-club", {
    ...herSituation(),
    ...(due ? { answer_due_in_minutes: Number(due) } : {}),
  });
  say(done, done.ok ? `On request club → ${esc(done.json.says)}` : "On request club");
  await loadBoard();
}

async function cardDeclines() {
  const done = await call("POST", "/dev/situations/card-declines-at-the-fill", herSituation());
  say(done, done.ok ? `Card declines → ${esc(done.json.says)} Say yes on the phone.` : "Card declines");
  await loadBoard();
}

async function checkIn() {
  const done = await call("POST", "/dev/situations/check-in-at-the-club", herSituation());
  say(done, done.ok ? `Check-in at the club → ${esc(done.json.says)}` : "Check-in at the club");
  await loadBoard();
}

async function aboutToExpire() {
  const done = await call("POST", "/dev/situations/about-to-expire", herSituation());
  say(done, done.ok ? `About to expire → ${esc(done.json.says)}` : "About to expire");
  await loadBoard();
}

async function emptySeat() {
  const done = await call("POST", "/dev/situations/empty-seat-at-the-cut-off", herSituation());
  say(done, done.ok ? `Empty seat at the cut-off → ${esc(done.json.says)}` : "Empty seat at the cut-off");
  await loadBoard();
}

async function dayClose() {
  const done = await call("POST", "/dev/situations/club-day-close", herSituation());
  say(done, done.ok ? `Club day close → ${esc(done.json.says)}` : "Club day close");
  await loadBoard();
}

// --------------------------------------------------------------------------
// Wiring
// --------------------------------------------------------------------------

$("refresh").addEventListener("click", refresh);
$("group").addEventListener("change", loadBoard);
$("sport").addEventListener("change", loadBoard);
$("show").addEventListener("change", () => { if (state.board) drawGames(); });
$("protagonist").addEventListener("change", () => {
  state.protagonist = $("protagonist").value;
  drawProtagonist(); drawPeople();
});
$("fresh-deal").addEventListener("click", freshDeal);
$("needs-her-yes").addEventListener("click", needsHerYes);
$("on-request").addEventListener("click", onRequest);
$("card-declines").addEventListener("click", cardDeclines);
$("check-in").addEventListener("click", checkIn);
$("about-to-expire").addEventListener("click", aboutToExpire);
$("empty-seat").addEventListener("click", emptySeat);
$("day-close").addEventListener("click", dayClose);
$("jobs").addEventListener("click", (event) => {
  const job = event.target.closest("button[data-job]");
  if (job) runJob(job.dataset.job);
});
$("refunds-wait").addEventListener("change", refundsWait);
$("people").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (button) act(button);
});
$("people").addEventListener("change", (event) => {
  const select = event.target.closest("select[data-card-for]");
  if (select) steerCard(select);
});
$("games").addEventListener("click", (event) => {
  const club = event.target.closest("button[data-club]");
  if (club) return clubAct(club);
  const charge = event.target.closest("button[data-charge]");
  if (charge) return chargeAct(charge);
  const notices = event.target.closest("button[data-notices]");
  if (notices) return noticesAct(notices);
  const job = event.target.closest("button[data-job]");
  if (job) return runJob(job.dataset.job);
});

// The first read, once, on load — and nothing after it unless pressed. It
// opens on the protagonist's biggest group, where the seed deals her games.
// The countdowns' redraw is the only thing that repeats, and it reads nothing.
setInterval(redrawCountdowns, 1000);
loadJobs();
loadGroups().then(() => {
  const hers = (state.groups?.groups ?? [])
    .filter((g) => g.holds_the_protagonist)
    .sort((a, b) => b.seed_members - a.seed_members);
  if (hers.length) $("group").value = hers[0].group_id;
  return loadBoard();
});
</script>
