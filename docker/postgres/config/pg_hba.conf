# Local development pg_hba — password (md5) auth over plain TCP from any host.
# Container is bound to a private network in compose; production uses RDS where
# this file is not deployed.
local   all   all                  trust
host    all   all   127.0.0.1/32   md5
host    all   all   ::1/128        md5
host    all   all   all            md5
