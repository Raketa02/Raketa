version: '3.8'

services:
  postgres:
    image: postgres:16.3
    container_name: postgres
    environment:
      POSTGRES_DB: backendb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./.secrets/server.crt:/var/lib/postgresql/server.crt:ro
      - ./.secrets/server.key:/var/lib/postgresql/server.key:ro
      - ./.secrets/rootCA.crt:/var/lib/postgresql/rootCA.crt:ro
    secrets:
      - postgres_password
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf

secrets:
  postgres_password:
    file: .secrets/postgres_password.txt