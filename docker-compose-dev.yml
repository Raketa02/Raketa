services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: basebackendb
      POSTGRES_USER: basebackend_user
      POSTGRES_PASSWORD: basebackend_pwd
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basebackend_user -d basebackendb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    image: basebackend_api:dev
    container_name: basebackend_api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Compose overrides — keep DB url consistent with the postgres service above.
      WRITER_DB_URL: postgresql+asyncpg://basebackend_user:basebackend_pwd@db:5432/basebackendb
      READER_DB_URL: postgresql+asyncpg://basebackend_user:basebackend_pwd@db:5432/basebackendb
      DB_SSL_MODE: disable
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      PYTHONPYCACHEPREFIX: /tmp/pycache
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
      - "5678:5678"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot-reload the source while developing.
      - ./app:/home/app/app
      - ./migrations:/home/app/migrations
      - ./alembic.ini:/home/app/alembic.ini

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
