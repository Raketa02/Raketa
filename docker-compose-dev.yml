services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: basebackend_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    networks:
      - backend
    secrets:
      - postgres_password
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./.secrets/server.crt:/var/lib/postgresql/server.crt:ro
      - ./.secrets/server.key:/var/lib/postgresql/server.key:ro
      - ./.secrets/rootCA.crt:/var/lib/postgresql/rootCA.crt:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
  
  api:
    image: robertconstantin02/basebackend_api:dev
    container_name: api
    restart: always
    env_file:
      - .env.docker
    ports:
      - '8000:8000' # uvicorn HTTP server port
      - '5678:5678' # debugger port
    secrets:
      - postgres_password
    networks:
      - backend
    tty: true
    depends_on:
      - db
    volumes:
      - ./.secrets/client.crt:/certs/client.crt:ro
      - ./.secrets/client.key:/certs/client.key:ro
      - ./.secrets/rootCA.crt:/certs/rootCA.crt:ro
      - ./src:/home/docker_user/app
      - ./migrations:/home/docker_user/migrations
      - ./alembic.ini:/home/docker_user/domain/alembic.ini
      - ./alembic.ini:/home/docker_user/app/alembic.ini

  redis:
    image: redis:7.2
    ports:
      - '6379:6379'
    networks:
      - backend

secrets:
  postgres_password:
    file: .secrets/postgres_password.txt

networks:
  backend:
    driver: overlay