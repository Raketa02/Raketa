  /* ---- the builder ---- */
  fourauto(){
    const F=fourInit(), sp=F.sport;
    const target=autoSeats(sp,S.mm.mode);
    /* keep anybody already seated by hand, fill the rest from the engine's line-up */
    const kept=F.seats.map(x=>x);
    const extras=target.filter(id=>id&&kept.indexOf(id)<0);
    F.searching=true; F.sel=null; render();
    let step=0;
    for(let i=0;i<kept.length;i++){
      if(kept[i]) continue;
      const id=extras.shift(); if(!id) continue;
      const seat=i, delay=650+step*550; step++;
      later(delay,()=>{
        const G=S.four; if(!G||!G.searching) return;
        G.seats[seat]=id;
        render();
      });
    }
    later(650+step*550+400,()=>{
      const G=S.four; if(!G) return;
      G.searching=false;
      if(G.seats.length===4&&G.seats.every(Boolean)) G.seats=evenSeats(G.sport,G.seats);
      const f=arrangedForecast(G.sport,G.seats);
      render();
      if(f) toast('Evenest line-up found \u00b7 '+f.pct+'% \u2014 swap anybody you like','ok');
    });

  fourseat(v){

    /* toggle off: a tap means "somebody else in this seat" */
    if(!F.swap){
      if(isLocked(F,F.seats[i])&&F.seats[i]!=='me'){
        toast(PLAYERS[F.seats[i]].n.split(' ')[0]+' already accepted \u2014 they keep their place');return;}
      if(F.seats[i]==='me'){toast('That seat is yours \u2014 turn on Swap players to change sides');return;}
      ACT.poolopen(String(i));return;
    }
    if(F.sel==null){F.sel=i;render();return;}
    if(F.sel===i){F.sel=null;render();return;}
    const a=F.sel, b=i;
    const t=F.seats[a]; F.seats[a]=F.seats[b]; F.seats[b]=t;
    F.sel=null;
    const f=arrangedForecast(F.sport,F.seats);

  /* invite whoever is newly seated \u2014 and nobody else */
  mufillsend(){

    if(!F.seats.every(Boolean)){toast('Fill every seat first');return;}
    const fresh=F.seats.filter(id=>m.players.indexOf(id)<0);
    if(!fresh.length){toast('Nobody new to invite');go('meetup',{id:m.id});return;}
    const sd=sidesOf(F.seats);
    m.sides={A:sd.A.slice(),B:sd.B.slice()};
    fresh.forEach(id=>m.players.push(id));
    S.four=null;
    chatAdd(m,'sys','Tomek invited '+fresh.map(p=>PLAYERS[p].n.split(' ')[0]).join(' and ')+' to complete the '+(seatsFor(m)===4?'four':'match'),'sys');
    S.stack=[{v:'home'},{v:'meetup',id:m.id}];render();
    toast('Invited \u00b7 '+fresh.length+' answer'+(fresh.length===1?'':'s')+' pending');
    fresh.forEach((p,i)=>{
      later(1500+i*1200,()=>{
        const mm=S.mus[m.id]; if(!mm||mm.players.indexOf(p)<0)return;
        /* the unreliable ones pass, and the seat comes back */
        if(PLAYERS[p].score<70){
          mm.players=mm.players.filter(x=>x!==p);
          if(mm.sides){mm.sides.A=mm.sides.A.filter(x=>x!==p);mm.sides.B=mm.sides.B.filter(x=>x!==p);}
          chatAdd(mm,'sys',PLAYERS[p].n.split(' ')[0]+' passed \u2014 the seat is open again','sys');
          toast(PLAYERS[p].n.split(' ')[0]+' passed \u00b7 one seat open again','bad');
          render();return;
        }
        mm.accepted.push(p);
        chatAdd(mm,'sys',PLAYERS[p].n.split(' ')[0]+' is in','sys');
        if(lineupDone(mm)){
          chatAdd(mm,'sys','The '+(seatsFor(mm)===4?'four':'match')+' is complete \u2014 now agree a day','sys');

    });

/* free text in a view: keep it in state as it is typed, because every
   chip tap re-renders the screen underneath it */
document.addEventListener('input',e=>{
  const f=e.target.closest?e.target.closest('[data-field]'):null;
  if(!f)return;
  const d=gnew(); d[f.dataset.field]=f.value;
});
/* ---------------- events ---------------- */
let HOLD_T=null, HELD=false;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.hold');if(!h)return;
  HELD=false;h.classList.add('holding');
  HOLD_T=setTimeout(()=>{HELD=true;h.classList.remove('holding');
    sheet(h.dataset.holdstyle==='social'?'playersocial':'player',
      {p:h.dataset.hold,sport:h.dataset.sport,
       seat:h.dataset.seat!=null&&h.dataset.seat!==''?h.dataset.seat:null});},430);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{
  clearTimeout(HOLD_T);
  const h=e.target.closest&&e.target.closest('.hold');if(h)h.classList.remove('holding');
},true));
document.addEventListener('click',e=>{
  if(HELD){HELD=false;e.stopPropagation();e.preventDefault();return;}
  if(e.target.id==='scrim'){closeSheet();return;}
  const a=e.target.closest('[data-act]');
  if(a){const act=ACT[a.dataset.act];
    if(act)act(a.dataset.v,a.dataset.id);return;}
  const g=e.target.closest('[data-go]');
  if(g){
    if(g.dataset.go==='player'){sheet('player',{p:g.dataset.id,sport:g.dataset.sport});return;}
    go(g.dataset.go,{id:g.dataset.id||undefined,sport:g.dataset.sport||undefined});return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='scrub'){
    S.now=TL0+(+e.target.value/1000)*(TL1-TL0);
    render();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatin')ACT.chatsend();
  if(e.key==='Escape'){
    if(document.getElementById('splash').classList.contains('on')){hideSplash();render();}
    else if(S.sheet)closeSheet();
    else if(document.body.classList.contains('railopen'))document.body.classList.remove('railopen');
  }
});

                   deadline:dayTs(-2)+30*HOUR,share:'32 z\u0142',cost:'128 z\u0142'},
          pay:{me:{method:'settled',paid:true,paidAt:T.now-6*DAY},
               ania:{method:'blik',paid:true,paidAt:T.now-5*DAY},

  payFix:{n:'Clearing a hold',d:'Settle, or say it was already paid \u2014 both lift it at once',

  statesSc:{n:'All the card states',d:'The nineteen states of a game, generated from the same list the app uses',

const RAIL=[
  ['Start here',['intro']],
  ['Onboarding · skill + social',['obStart','obSports','obQ','obBeginner','obContra','obSocial','obPhoto','obOptIn']],
  ['Matchmaking · competitive',['mmSetup','mmWhen','mmComp','mmChallenge']],
  ['Match me · the deck',['matchMe','deckFun','deckMutual','waveLift']],
  ['Building a line-up',['fourSc','fourAuto','fourSwap','seatReplace','seatRecord','fourManual','singlesSc']],
  ['For fun · the social court',['funFour','funSocialCard']],
  ['One-to-one, then a four',['challengeDbl','fillFromCard','fillPass']],
  ['A meetup, start to finish',['muIncoming','muMatched','muChat','muConfirmed','muToday','muNeedsResult','muConfirmRes','muCounted','muLapsed','muExpired']],
  ['The court &amp; the money',['ownNeeded','ownClaim','ownBooked','paySay','payCollect','payOverdue','payReport','payHeld','payFix','payFlagged']],
  ['People around you',['discoverSc','spotsSc','profileSc']],
  ['Getting together',['tonightSc','tonightOn','tonightPromote','tonightNew','tonightLoose','tonightAlong','tonightCourt']],
  ['Trust',['statesSc','passportSc','scoreSc','rankingSc','intentSc','photoRulesSc','privacySc']]
];
function renderRail(){
  const el=document.getElementById('railbody');
  el.innerHTML=RAIL.map(g=>`<div class="rgrp"><h5>${g[0]}</h5>
    ${g[1].map((id,i)=>{const s=SCEN[id];
      return `<button class="ritem ${S.scenario===id?'on':''}" data-act="scenario" data-v="${id}">
        <s>${i+1}</s><span>${s.n}<em>${s.d}</em></span></button>`;}).join('')}</div>`).join('');
}
function runScenario(id){
  const ep=S?S.epoch+1:1;
  resetPlayers();
  S=freshState();S.epoch=ep;S.scenario=id;
  S.mus=seedMUs(); S.gath=seedGath();
  hideSplash();
  const sc=SCEN[id]||SCEN.intro;
  sc.f();
  render();
}
/* boot */
S=freshState();S.mus=seedMUs();S.gath=seedGath();
runScenario('intro');
</script>
