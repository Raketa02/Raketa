<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rakieta — social player app prototype v1</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="Interactive prototype of the Rakieta players' network. Matchmaking, meetups, chat, rankings — the court is yours to book."/>
<meta name="theme-color" content="#08222B"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23071C24'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23E8482B'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --paper:#F6F4EE; --paper2:#EFECE4; --surface:#FFFFFF; --ink:#10191D; --night:#0B2B33; --night2:#134652;
  --muted:#6E7F85; --line:#E6E2D8; --line2:#F1EEE6;
  --coral:#E8482B; --coral-soft:#FDEBE6; --coral-ink:#B8351C;
  --mint:#0C8F6B; --mint-soft:#E2F3EC; --amber:#9A6A0B; --amber-soft:#FBF0DA;
  --red:#B4392C; --red-soft:#FBEAE7; --volt:#D9F24B; --volt-ink:#5E7010;
  --info:#12495B; --info-soft:#EAF1F4; --info-line:#C7DBE3;
  --pad:#E8482B; --ten:#0C8F6B; --squ:#12495B; --bad:#9A6A0B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08222B;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:left}
input{font:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:290px 1fr;height:100%}
#rail{background:#071C24;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
#railhead{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#railhead .brand{display:flex;align-items:center;gap:9px;color:#fff}
#railhead .dot{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center}
#railhead .dot i{width:9px;height:9px;border-radius:5px;background:var(--coral);display:block}
#railhead b{font-size:15px;letter-spacing:-.02em}
#railhead p{font-size:11px;color:rgba(255,255,255,.45);margin-top:7px;line-height:1.45}
#railbody{flex:1;overflow-y:auto;padding:12px 12px 24px}
#railbody::-webkit-scrollbar{width:6px}
#railbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.rgrp{margin-bottom:16px}
.rgrp h5{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt);
  padding:0 8px;margin-bottom:7px;font-weight:700}
.ritem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;
  color:rgba(255,255,255,.78);font-size:12.5px;font-weight:500;line-height:1.3;transition:.12s}
.ritem:hover{background:rgba(255,255,255,.08);color:#fff}
.ritem.on{background:var(--coral);color:#fff;font-weight:600}
.ritem s{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.1);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  text-decoration:none;font-family:'IBM Plex Mono',monospace}
.ritem.on s{background:rgba(255,255,255,.22)}
.ritem em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.4);display:block;margin-top:1px}
.ritem.on em{color:rgba(255,255,255,.7)}

/* ---------- stage ---------- */
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  overflow:hidden;padding:18px 20px 0}
#stagehead{position:absolute;top:16px;left:24px;right:24px;display:flex;align-items:center;gap:12px}
#scname{color:#fff;font-size:13px;font-weight:700;letter-spacing:-.01em}
#scdesc{color:rgba(255,255,255,.5);font-size:11.5px}
#phone{width:392px;height:788px;background:var(--paper);border-radius:34px;position:relative;
  border:1px solid #24505E;box-shadow:0 40px 90px -40px rgba(0,0,0,.8);display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0;margin-top:8px}
#statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:10.5px;font-weight:600;flex-shrink:0;background:transparent}
#statusbar .r{display:flex;gap:5px;align-items:center;color:var(--ink)}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 15px 14px;scroll-behavior:smooth}
#scroll::-webkit-scrollbar{width:0}
#cta{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:10px 15px;display:none}
#cta.on{display:block}
#tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:#fff;padding:7px 0 12px;flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.5px;
  color:var(--muted);font-weight:600}
.tab.on{color:var(--coral)}
.tab i{width:16px;height:16px;border-radius:5px;background:currentColor;opacity:.85;display:block}
.tab.fab i{width:30px;height:30px;border-radius:11px;background:var(--coral);opacity:1;margin-bottom:-4px;
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px -6px rgba(232,72,43,.7)}
.tab.fab i::before{content:'⚡';font-size:15px;font-style:normal}

/* ---------- time bar ---------- */
#timebar{width:100%;max-width:980px;margin-top:14px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px 14px;flex-shrink:0}
#timebar .th{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
#timebar .th b{color:#fff;font-size:12px;font-weight:700}
#timebar .th span{color:rgba(255,255,255,.5);font-size:11px}
#timebar .th .phase{margin-left:auto;padding:2px 9px;border-radius:6px;font-size:10px;font-weight:700;
  background:var(--coral);color:#fff}
#track{position:relative;height:34px}
#track .rail{position:absolute;left:0;right:0;top:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
#track .fill{position:absolute;left:0;top:6px;height:5px;border-radius:3px;background:var(--coral)}
#track .stop{position:absolute;top:0;transform:translateX(-50%);text-align:center;cursor:pointer;z-index:3;padding:0 4px}
#track .stop i{width:11px;height:11px;border-radius:6px;background:#0B2C38;border:2px solid rgba(255,255,255,.4);
  display:block;margin:2px auto 0}
#track .stop.done i{background:var(--coral);border-color:var(--coral)}
#track .stop u{display:block;font-size:9.5px;color:rgba(255,255,255,.55);margin-top:4px;
  text-decoration:none;white-space:nowrap;font-weight:600}
#track input{position:absolute;left:0;right:0;top:2px;height:14px;opacity:0;cursor:pointer;margin:0;width:100%;z-index:1}

/* ---------- phone primitives ---------- */
.pbar{display:flex;align-items:center;gap:10px;padding:12px 15px 9px;flex-shrink:0}
.pbar .back{font-size:20px;color:var(--muted);line-height:1;padding:0 2px}
.pbar .t{flex:1;min-width:0}
.pbody{padding:0 15px 14px}
.eyebrow{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flab{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--night);margin-bottom:7px}
.h1{font-size:19px;font-weight:800;letter-spacing:-.035em;margin-top:2px}
.h2{font-size:15px;font-weight:700;letter-spacing:-.025em}
.tiny{font-size:11px;line-height:1.45;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.card-n{background:var(--night);color:#fff;border-radius:15px;padding:14px;margin-bottom:9px}
.card-n .tiny{color:rgba(255,255,255,.68)}
.card-n .eyebrow{color:rgba(255,255,255,.52)}
.card.tap,.card-n.tap{cursor:pointer;transition:.12s}
.card.tap:hover{border-color:var(--coral);transform:translateY(-1px)}
.card-n.tap:hover{transform:translateY(-1px)}
.hair{border-top:1px solid var(--line2);margin-top:9px;padding-top:8px}
.card-n .hair{border-color:rgba(255,255,255,.15)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:9.5px;
  font-weight:700;background:var(--line2);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.ok{background:var(--mint-soft);color:var(--mint)}
.tag.hot{background:var(--coral-soft);color:var(--coral-ink)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.tag.volt{background:var(--volt);color:var(--night)}
.tag.w{background:rgba(255,255,255,.17);color:#fff}
.tag i{width:6px;height:6px;border-radius:3px;display:block;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);font-size:10.5px;background:#fff;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:2px;display:block}
.chip.sm{height:25px;padding:0 8px;font-size:10px;gap:4px}
.chip.sm i{width:5px;height:5px}
.row{display:flex;gap:5px;flex-wrap:wrap}
.sqrow{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.sqrow::-webkit-scrollbar{display:none}
.sqrow>*{flex:0 0 auto}
.hstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -15px 10px;padding:1px 15px 5px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{height:0}
.hstrip>*{scroll-snap-align:center;scroll-snap-stop:always;flex:0 0 100%;margin-bottom:0!important}
.dots{display:flex;gap:5px;justify-content:center;margin:-2px 0 11px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--line);display:block}
.dots i.on{background:var(--coral);width:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;
  border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.12s;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn.p{background:var(--coral);color:#fff}
.btn.n{background:var(--night);color:#fff}
.btn.v{background:var(--volt);color:var(--night)}
.btn.s{background:#fff;border:1px solid var(--line)}
.btn.w{background:rgba(255,255,255,.17);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.rl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:11.5px}
.rl+.rl{border-top:1px solid var(--line2)}
.rl b{font-weight:600}
.meter{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--night);border-radius:3px}
.fit{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:7px;
  background:var(--night);color:#fff;font-size:11px;font-weight:700}
.fit.hi{background:var(--coral)}
.balbar{display:flex;height:24px;border-radius:8px;overflow:hidden;background:var(--line2)}
.balbar i{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
  color:#fff;font-style:italic}
.avat{width:27px;height:27px;border-radius:9px;background:var(--night);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;overflow:hidden;position:relative}
.avat.d{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.avat.me{background:var(--coral)}
.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hold:active .avat{transform:scale(.93)}
.avat{transition:transform .12s}
.holding .avat{box-shadow:0 0 0 3px var(--coral-soft)}
.bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.seg{display:flex;background:var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:7px 4px;font-size:10.5px;font-weight:700;color:var(--muted);
  border-radius:8px;cursor:pointer}
.seg span.on{background:#fff;color:var(--ink)}
.note{padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--night);
  border-radius:10px;background:#fff;margin-bottom:9px}
.note b{display:block;font-size:11.5px;margin-bottom:3px}
.note.mint{border-left-color:var(--mint);background:var(--mint-soft);border-color:#CFE7DD}
.note.coral{border-left-color:var(--coral);background:var(--coral-soft);border-color:#F3CFC5}
.note.amber{border-left-color:var(--amber);background:var(--amber-soft);border-color:#EFDCB8}
.note.info{border-left-color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.note.info b{color:var(--info);display:flex;align-items:center;gap:6px}
.note.info b::before{content:'i';flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  background:var(--info);color:#fff;font-family:Georgia,'Times New Roman',serif;font-style:italic;
  font-size:10px;font-weight:700;line-height:14px;text-align:center}
.sect{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:14px 0 7px}
.sect:first-child{margin-top:2px}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty b{display:block;font-size:13px;color:var(--ink);margin-bottom:5px}

/* ---------- the player photo card (the signature) ----------
   No stock photography exists in this prototype, and the product rule is
   on-court photos only anyway — so a player's "photo" is a generated
   court poster: their identity hue, the glass wall, a silhouette mid-swing,
   and THE LEVEL AS THE BIGGEST THING ON IT. In this product your level is
   your face; the photo is scenery. That ordering is the whole argument
   against the dating-app reading. */
.photo{position:relative;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--night)}
.photo svg{display:block}
.photo .lv{position:absolute;left:10px;bottom:8px;color:#fff;line-height:1}
.photo .lv b{font-size:22px;font-weight:800;letter-spacing:-.04em;font-family:'IBM Plex Mono',monospace;display:block}
.photo .lv u{font-size:8px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;opacity:.75;font-weight:700}
.photo .shield{position:absolute;top:7px;right:7px;display:inline-flex;align-items:center;gap:3px;
  background:rgba(7,28,36,.72);color:var(--volt);font-size:8px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 6px;border-radius:6px}

/* deck card */
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px;
  box-shadow:0 18px 40px -26px rgba(11,43,51,.45)}
.pcard.leaving{animation:cardout .32s ease both}
@keyframes cardout{to{opacity:0;transform:translateX(-40px) rotate(-3deg)}}
.pcard.arriving{animation:cardin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* radar */
.radar{position:relative;border-radius:15px;background:linear-gradient(160deg,#0B2B33,#0E3947 70%,#134652);
  overflow:hidden;margin-bottom:9px}
.radar .ring{position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%}
.radar .sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(217,242,75,.13),transparent 70deg);
  animation:sweep 6s linear infinite;border-radius:50%}
@keyframes sweep{to{transform:rotate(360deg)}}
.rdot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:2}
.rdot i{display:block;width:26px;height:26px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.75);
  box-shadow:0 4px 12px rgba(0,0,0,.4);margin:0 auto}
.rdot u{display:block;text-decoration:none;font-size:7.5px;color:rgba(255,255,255,.8);font-weight:700;margin-top:2px;
  font-family:'IBM Plex Mono',monospace}
.rdot.mine i{border-color:var(--volt)}

/* matchmaking search */
.pulse{position:relative;width:150px;height:150px;margin:0 auto}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--volt);opacity:0;
  animation:pulse 2.1s cubic-bezier(.2,.7,.3,1) infinite}
.pulse i:nth-child(2){animation-delay:.7s}
.pulse i:nth-child(3){animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.15);opacity:0}}

/* chat */
.msg{max-width:78%;padding:8px 11px;border-radius:13px;font-size:12px;line-height:1.45;margin-bottom:6px}
.msg.me{background:var(--night);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{max-width:100%;background:none;border:none;text-align:center;font-size:10px;color:var(--muted);
  padding:2px 0;font-weight:600}
.typing{display:inline-flex;gap:3px;padding:9px 12px;background:#fff;border:1px solid var(--line);
  border-radius:13px;border-bottom-left-radius:4px;margin-bottom:6px}
.typing i{width:5px;height:5px;border-radius:3px;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
#chatbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px 10px;display:none}
#chatbar.on{display:block}
#chatbar .inrow{display:flex;gap:7px}
#chatin{flex:1;height:36px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:12px;background:var(--paper)}

/* availability grid */
.gridav{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px}
.gridav .gh{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;
  text-align:center;align-self:center}
.gcell{height:26px;border-radius:7px;background:var(--line2);cursor:pointer;transition:.1s;border:1px solid transparent}
.gcell.on{background:var(--mint);border-color:var(--mint)}
.gcell:hover{border-color:var(--night)}

/* Game on splash */
#splash{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%,#134652,#0B2B33 75%);animation:fade .25s}
#splash.on{display:flex}
#splash .inner{text-align:center;padding:0 26px;animation:splashup .4s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes splashup{from{opacity:0;transform:translateY(24px) scale(.92)}}
#splash .gm{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--volt);margin:14px 0 4px}
#splash .vs{display:flex;align-items:center;justify-content:center;gap:14px}
#splash .vs .x{color:rgba(255,255,255,.5);font-size:13px;font-weight:800;letter-spacing:.1em}

/* sheets */
#sheetwrap{position:absolute;inset:0;z-index:20;display:none}
#sheetwrap.on{display:block}
#scrim{position:absolute;inset:0;background:rgba(10,52,65,.45);animation:fade .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;
  border-radius:22px 22px 0 0;box-shadow:0 -20px 40px -22px rgba(10,32,40,.6);
  display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
#sheethead{padding:10px 15px 4px;flex-shrink:0;position:relative}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 10px}
#xsheet{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:14px;background:var(--line2);
  color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;z-index:3}
#xsheet:hover{background:var(--line);color:var(--ink)}
#sheetbody{overflow-y:auto;padding:0 15px 16px}
#sheetbody::-webkit-scrollbar{width:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
#toast{position:absolute;left:15px;right:15px;bottom:78px;z-index:60;pointer-events:none}
.tst{background:var(--night);color:#fff;border-radius:12px;padding:11px 14px;font-size:12px;

/* ------------------------------------------------------------------
   Open  →  Happening
   One object, not two lists of different things. You put up an
   invitation; while you are the only one in it, it is OPEN. The moment
   somebody counts themselves in it is HAPPENING, and the group is asked
   to pin whatever is still loose. If everybody drops out again it falls
   back to open, because that is what it is.

   Nobody approves anybody. A host cannot pick who joins, which is the
   single property that stops this being a selection game — and it is

   ------------------------------------------------------------------ */
function isOpen(g){return g.who.length<2;}

  if(countCategory(a,'execution')<4) cands.push({q:()=>execQuestion(a.sport,tierFor(est.mu),countCategory(a,'execution')),s:EXEC_SIGMA,id:'execution'});
  if(countCategory(a,'tactical')<2)  cands.push({q:()=>tacticQuestion(a.sport,1),s:TACTIC_SIGMA,id:'tactical'});
  if(!has(a,'act.volume'))       cands.push({q:()=>Q_VOLUME,s:1.00,id:'activity'});
  if(!has(a,'ctx.relative'))     cands.push({q:()=>Q_RELATIVE,s:Q_RELATIVE.sigma,id:'context'});
  if(!cands.length) return null;
  let best=null;
  cands.forEach(c=>{const g=estimate(a).sigma-projectedSigma(a,c.s);if(!best||g>best.g)best={c:c,g:g};});
  if(!best||best.g<MIN_GAIN){log(null,'stopped: best remaining question would move the band by only '+
    r2(best?best.g:0)+', under the '+MIN_GAIN+' threshold',cands.map(c=>c.id),best?best.g:0);return null;}
  return put(best.c.q(),'highest projected information gain of '+cands.length+' candidates',cands.map(c=>c.id),best.g);

function createAssessment(o){
  o=o||{};

    responses:[],routing:[],bank:{},answered:{},
    beginner:false,hasHistory:false,needsVolume:false,needsLayoff:false,layoff:null,
    tieBreakerAsked:false,tieBreakerTier:null,contradiction:null,contradictionResolved:null};

function recordAnswer(a,questionId,optionId){
  const q=a.bank[questionId];

  a.responses.push({questionId:questionId,optionId:optionId,askedOrder:a.responses.length+1,
    category:q.category,kind:q.kind,difficulty:q.difficulty||null});
  a.answered[questionId]=optionId;
  if(questionId==='act.regularity'){a.beginner=optionId===0;a.hasHistory=optionId>=2;a.needsVolume=optionId===2;}
  if(questionId==='act.volume') a.needsLayoff=a.hasHistory&&optionId<=1;
  if(questionId==='act.layoff') a.layoff=q.layoffKeys[optionId];
  if(a.tieBreakerAsked&&a.contradictionResolved===null&&q.category==='execution'&&a.responses.length>2){
    const c=detectContradiction(itemsOf(a));

    const list=byCat[cat]; if(!list||!list.length) return;
    const m=fuseFlat(list).mu;
    out.push({key:cat,label:list[0].label||LABELS[cat],
      dir:m>est.mu+0.15?'up':m<est.mu-0.15?'down':'flat',mu:r2(m)});
  });
  if(est.layoffAdd) out.push({key:'layoff',label:'Time away from the sport',dir:'wider',
    detail:(LAYOFF[a.layoff]||{}).label});
  if(est.contradiction&&a.contradictionResolved===false)
    out.push({key:'contradiction',label:'Answers pointing to different ranges',dir:'wider',

function confidenceReason(a,est){

    return {key:'contradiction',text:'Some of your answers point to different skill ranges, so we kept your starting range wider. Your first games will settle it quickly.'};
  if(a.layoff&&(LAYOFF[a.layoff]||{}).add>0)
    return {key:'layoff',text:'You have been away for a while, so we widened your range rather than lowering your level. A couple of games will bring it back in.'};
  return {key:'questionnaireOnly',text:'Your level is still an initial estimate because we have not seen enough match evidence yet.'};
}
function calibrationPlan(rating){

}
function finalize(a){
  const est=estimate(a);

  return {playerId:'me',sport:a.sport,format:a.format,mu:mu,sigma:sigma,confidence:conf(sigma),

/* the match-update maths (§29), kept — a confirmed result moves the level here too */
const expectedWin=(mu,opponentMu)=>1/(1+Math.pow(10,(opponentMu-mu)/0.6));
function marginFeature(gf,ga){
  const tot=(gf||0)+(ga||0); if(!tot) return 0.70;
  const share=gf/tot, d=clamp(Math.abs(share-0.5)/0.42,0,1);
  const capped=(1-Math.exp(-1.9*d))/(1-Math.exp(-1.9));
  return 0.5+0.5*capped;
}
function resultDelta(sport,oppMu,won,gf,ga){
  const L=S.me.lv[sport]; if(!L) return null;
  const E=expectedWin(L[0],oppMu), margin=gf!=null?marginFeature(gf,ga):0.70;
  const Sc=won?margin:1-margin;
  const K=0.30*(1-L[2]/100)+0.08;
  return {delta:r2(K*(Sc-E)),exp:E,K:r2(K)};
}
function atStake(sport,oppMu){
  const L=S.me.lv[sport]; if(!L) return null;
  const E=expectedWin(L[0],oppMu), K=0.30*(1-L[2]/100)+0.08;
  return {win:r2(K*(1-E)),lose:r2(-K*E),fav:E>0.5};

/* ==================================================================
   THE MATCHMAKING ENGINE
   ------------------------------------------------------------------
   Seven terms, one number — the matchFit idiom kept, retargeted at a
   person rather than a seat. The weights are the product decision:
   COMPETITIVE asks "will this be a real game", so level, predicted
   balance and reliability carry it. FOR FUN asks "will you enjoy the
   evening", so vibe overlap, availability and fresh faces do. Nothing
   is a hard filter except a block — the weights persuade, the player
   decides.
   ================================================================== */
const MM_W={comp:{level:34,balance:20,rel:16,avail:12,dist:8,vibe:6,fresh:4},
            fun: {level:16,balance:8, rel:10,avail:18,dist:14,vibe:24,fresh:10}};
function availOverlap(a,b){
  let n=0,mine=0;
  for(let d=0;d<7;d++)for(let s=0;s<3;s++){if(a[d][s]){mine++;if(b[d]&&b[d][s])n++;}}
  return mine?n/mine:0;
}
function sharedSlots(a,b){
  const out=[];
  for(let d=0;d<7;d++)for(let s=0;s<3;s++) if(a[d][s]&&b[d]&&b[d][s]) out.push([d,s]);
  return out;
}
function slotName(d,s){return DAYS7[d]+' '+['morning','afternoon','evening'][s];}
function pairBalance(myL,theirL){
  const gap=Math.abs(myL[0]-theirL[0]);
  const spread=Math.sqrt(myL[1]*myL[1]+theirL[1]*theirL[1]);
  return Math.max(35,Math.min(96,Math.round(100-gap*145-spread*32)));
}
function vibeOverlap(pid){
  const t=(PLAYERS[pid]||{}).tags||[], mine=S.myTags;
  const shared=t.filter(x=>mine.indexOf(x)>=0);
  return {n:shared.length, shared:shared, v:Math.min(1,shared.length/3)};
}

function avCount(av){let n=0;for(let d=0;d<7;d++)for(let x=0;x<3;x++)if(av[d][x])n++;return n;}
function avSame(a,b){for(let d=0;d<7;d++)for(let x=0;x<3;x++)if((a[d][x]?1:0)!==(b[d][x]?1:0))return false;return true;}
/* the rough window a challenge carries, derived from the grid instead of
   asked for twice */
function avWindow(av){
  const sel=[]; for(let d=0;d<7;d++)for(let x=0;x<3;x++)if(av[d][x])sel.push([d,x]);
  if(!sel.length) return 'any';
  const td=todayIdx();
  if(sel.every(x=>x[0]>=5)) return 'weekend';
  if(sel.length<=2&&sel.every(x=>x[0]===td)) return 'tonight';
  if(sel.length<=2&&sel.every(x=>x[0]===(td+1)%7)) return 'tomorrow';
  return sel.length>=12?'any':'week';
}
function compat(pid,sport,mode){
  const p=PLAYERS[pid], myL=S.me.lv[sport], thL=lv(pid,sport);
  if(!p||!myL||!thL) return null;
  const W=MM_W[mode]||MM_W.comp;
  const dmu=Math.abs(myL[0]-thL[0]);
  const level=Math.max(0,1-dmu/0.55);
  const bal=pairBalance(myL,thL);
  const rel=p.score/100;
  const av=availOverlap(myAv(),p.av);
  const dist=Math.max(0,Math.min(1,1-Math.max(0,p.km-S.radiusKm)/6))* (p.km<=S.radiusKm?1:0.85);
  const vb=vibeOverlap(pid);
  const fresh=p.played?0.35:1;
  const terms=[
    ['Level fit',W.level,level, dmu<=0.12?'Almost exactly your level — '+lvl(thL[0])+' against your '+lvl(myL[0])
      :thL[0]>myL[0]?lvl(thL[0])+' · '+lvl(dmu)+' above you':lvl(thL[0])+' · '+lvl(dmu)+' below you'],
    ['Predicted balance',W.balance,bal/100,'Forecast '+bal+'% — '+(bal>=85?'very even':bal>=70?'fairly even':bal>=55?'one side favoured':'lopsided')],
    ['Reliability',W.rel,rel,'Player Score '+p.score+(p.score>=90?' — turns up, answers, confirms':'')],
    ['Availability overlap',W.avail,av, sharedSlots(myAv(),p.av).length
      ? sharedSlots(myAv(),p.av).length+' shared slots · next: '+slotName.apply(null,sharedSlots(myAv(),p.av)[0])
      : 'No declared overlap — you would have to bend'],
    ['Distance',W.dist,dist,km(p.km)+' away · '+p.area],
    ['Shared vibe',W.vibe,vb.v, vb.n?('You both: '+vb.shared.slice(0,2).map(x=>TAGN[x].toLowerCase()).join(', ')):'No tags in common — could go either way'],
    ['Fresh faces',W.fresh,fresh, p.played?'You have played before':'Somebody new — variety feeds your rating too']
  ];
  let sc=terms.reduce((a,t)=>a+t[1]*t[2],0);
  const mods=[];
  /* deliberately NOT here: "they already said yes in the deck". That is
     how likely they are to accept, not how good the game would be, and
     mixing the two would quietly corrupt the only number the player is
     asked to trust. It orders the list instead — see rankScore. */
  if(p.score<SCORE_MIN){sc-=12;mods.push(['−12','a recent no-show on the record']);}
  sc=Math.max(20,Math.min(99,Math.round(sc)));
  const rank=terms.slice().sort((a,b)=>(b[1]*b[2])-(a[1]*a[2]));
  return {score:sc,terms:terms,mods:mods,bal:bal,
    reasons:rank.slice(0,3).map(t=>t[3]),
    warn:rank[rank.length-1][2]<0.4?rank[rank.length-1][3]:null};
}
function unsettled(pid){return !!caseOn(pid);}
/* said yes to you in Match me, and is still waiting to hear back */
function wantsMe(pid){return !!PLAYERS[pid].waved&&!hasOpenWith(pid);}
function iWant(pid){return S.myWaves.indexOf(pid)>=0;}
/* the order of a candidate list: fit, with anybody who already said yes
   lifted to the top and told why */
const WAVE_LIFT=12;
function rankScore(x){return x.c.score+(wantsMe(x.id)?WAVE_LIFT:0);}
function mmPool(sport,mode){
  return POOL
    .filter(id=>S.blocked.indexOf(id)<0 && lv(id,sport))
    .map(id=>({id:id,c:compat(id,sport,mode)}))
    .filter(x=>x.c)
    .sort((a,b)=>b.c.score-a.c.score);
}

/* the pairing maths for a doubles four, kept from v37 */
function teamStrength(a,b){if(b==null)return a;return 0.45*Math.max(a,b)+0.55*Math.min(a,b);}
function bestPairing(vals){
  if(vals.length<4) return {a:vals[0],b:vals[1],gap:Math.abs(vals[0]-vals[1]),opts:[]};
  const idx=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  const opts=idx.map(pr=>{
    const A=teamStrength(vals[pr[0][0]],vals[pr[0][1]]), B=teamStrength(vals[pr[1][0]],vals[pr[1][1]]);
    return {pair:pr,A:A,B:B,gap:Math.abs(A-B)};
  }).sort((x,y)=>x.gap-y.gap);
  return {a:opts[0].A,b:opts[0].B,gap:opts[0].gap,opts:opts};
}
function fourForecast(sport,ids){
  const Ls=ids.map(i=>i==='me'?S.me.lv[sport]:lv(i,sport));
  if(Ls.some(x=>!x)) return null;
  const bp=bestPairing(Ls.map(x=>x[0]));
  const sp=Math.sqrt(Ls.reduce((a,x)=>a+x[1]*x[1],0));
  const pct=Math.max(35,Math.min(96,Math.round(100-bp.gap*145-sp*32)));
  const pr=bp.opts.length?bp.opts[0].pair:[[0,1],[2,3]];
  let sideA=pr[0].map(i=>ids[i]), sideB=pr[1].map(i=>ids[i]);
  if(!sideA.includes('me')&&sideB.includes('me')){const t=sideA;sideA=sideB;sideB=t;}
  const sA=teamStrength.apply(null,sideA.map(i=>(i==='me'?S.me.lv[sport]:lv(i,sport))[0]));
  const sB=teamStrength.apply(null,sideB.map(i=>(i==='me'?S.me.lv[sport]:lv(i,sport))[0]));
  return {pct:pct,gap:r2(Math.abs(sA-sB)),A:r2(sA),B:r2(sB),sideA:sideA,sideB:sideB,
    conf:sp<0.28?'high':sp<0.42?'medium':'low'};
}
/* ------------------------------------------------------------------
   fourForecast answers "how even could these four be?" \u2014 it searches
   the three possible pairings and reports the best. That is the right
   answer when you are choosing PEOPLE, and the wrong one once you are
   choosing SIDES: it never changes when you move somebody across the
   net. arrangedForecast answers the other question \u2014 "how even is the
   line-up in front of me?" \u2014 and it is what the builder shows.
   ------------------------------------------------------------------ */
function seatCount(sport){return (COURTS[sport]||COURTS.Padel).seats.filter(Boolean).length;}
function sidesOf(seats){const h=seats.length/2;return {A:seats.slice(0,h),B:seats.slice(h)};}
function lvOf(id,sport){return id==='me'?S.me.lv[sport]:lv(id,sport);}
function arrangedForecast(sport,seats){
  if(!seats||seats.some(x=>!x)) return null;
  if(seats.some(id=>!lvOf(id,sport))) return null;
  const sd=sidesOf(seats);
  const sA=teamStrength.apply(null,sd.A.map(i=>lvOf(i,sport)[0]));
  const sB=teamStrength.apply(null,sd.B.map(i=>lvOf(i,sport)[0]));
  const spread=Math.sqrt(seats.reduce((a,i)=>a+lvOf(i,sport)[1]*lvOf(i,sport)[1],0));
  const gap=Math.abs(sA-sB);
  return {pct:Math.max(35,Math.min(96,Math.round(100-gap*145-spread*32))),
    gap:r2(gap),A:r2(sA),B:r2(sB),sideA:sd.A,sideB:sd.B,spread:r2(spread),
    conf:spread<0.28?'high':spread<0.42?'medium':'low'};
}
/* A running estimate while the court is still filling. A side with one
   player is read as if the empty seat next to them were filled
   like-for-like \u2014 which is an assumption, so everything built on it is
   labelled provisional rather than presented as the forecast. */
function partialForecast(sport,seats){
  const sd=sidesOf(seats);
  const A=sd.A.filter(Boolean), B=sd.B.filter(Boolean);
  if(!A.length||!B.length) return null;
  if(A.length===sd.A.length&&B.length===sd.B.length) return arrangedForecast(sport,seats);
  const mus=x=>x.map(i=>lvOf(i,sport)).filter(Boolean);
  const mA=mus(A), mB=mus(B);
  if(!mA.length||!mB.length) return null;
  const sA=mA.length>1?teamStrength(mA[0][0],mA[1][0]):mA[0][0];
  const sB=mB.length>1?teamStrength(mB[0][0],mB[1][0]):mB[0][0];
  const all=mA.concat(mB);
  const spread=Math.sqrt(all.reduce((a,L)=>a+L[1]*L[1],0)/all.length*seats.length);
  const gap=Math.abs(sA-sB);
  return {pct:Math.max(35,Math.min(96,Math.round(100-gap*145-spread*32))),
    gap:r2(gap),A:r2(sA),B:r2(sB),sideA:A,sideB:B,spread:r2(spread),
    provisional:true,seated:A.length+B.length,
    conf:spread<0.28?'high':spread<0.42?'medium':'low'};
}
/* five squares from a player id — formDots() already takes the array,
   this one saves every caller looking it up */
function formOf(id,size){
  const f=(id==='me'?S.me.form:(PLAYERS[id]||{}).form)||[];
  size=size||9;
  return `<span style="display:inline-flex;gap:3px;vertical-align:middle">${f.map(w=>
    `<span style="width:${size}px;height:${size}px;border-radius:2px;display:block;background:${w?'var(--mint)':'var(--line)'}"></span>`).join('')}</span>`;
}
/* the evenest seating of the same people \u2014 what "Even it out" restores */
function evenSeats(sport,seats){
  if(seats.length<4||seats.some(x=>!x)) return seats.slice();
  const f=fourForecast(sport,seats);
  return f?f.sideA.concat(f.sideB):seats.slice();
}
/* the engine's own line-up: it does not just take the three best fits, it
   takes the combination that plays out evenest */
function autoSeats(sport,mode){
  const pool=mmPool(sport,mode).filter(x=>!hasOpenWith(x.id)&&lvOf(x.id,sport)).map(x=>x.id);
  const n=seatCount(sport);
  if(n<=2){
    let best=null;
    pool.slice(0,10).forEach(id=>{
      const f=arrangedForecast(sport,['me',id]);
      if(f&&(!best||f.pct>best.f.pct)) best={id:id,f:f};});
    return best?['me',best.id]:['me',pool[0]||null];
  }
  const cand=pool.slice(0,6);
  let best=null;
  for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++)for(let k=j+1;k<cand.length;k++){
    const ids=['me',cand[i],cand[j],cand[k]];
    const f=fourForecast(sport,ids);
    if(f&&(!best||f.pct>best.pct)) best=f;
  }
  return best?best.sideA.concat(best.sideB):['me'].concat(cand.slice(0,3));
}
function balWord(p){return p>=85?'Very even':p>=70?'Fairly even':p>=55?'One side favoured':'Lopsided';}
function balTone(p){return p>=70?'var(--mint)':p>=55?'var(--amber)':'var(--red)';}
function sideNames(ids){return ids.map(i=>i==='me'?'You':(PLAYERS[i]?PLAYERS[i].n.split(' ')[0]:'?')).join(' + ');}

/* ==================================================================
   MEETUPS — the new state machine
   ------------------------------------------------------------------
   A meetup is people + a sport + an evolving plan. Thirteen contexts,
   the same idiom as v37's thirty-five: a tag, a context line, a
   checklist of true statements. Nothing here holds a court, charges a
   złoty or promises a refund — and the cards say so where it matters.

     proposed ──▶ matched ──▶ (planning) ──▶ confirmed ──▶ played
        │                                        │            │
        ├──▶ declined / expired                  └▶ cancelled ├▶ needsResult ▶ confirmResult ▶ counted
        └──────────────────────────────────────────────────────▶ uncounted / friendly
   ================================================================== */
const PROPOSAL_H=24;       /* a challenge holds an answer for a day        */
const RESULT_H=24;         /* the score window — social, so a day, not 30 min */
const WINDOWS={tonight:'Tonight',tomorrow:'Tomorrow',weekend:'This weekend',week:'Next week',any:'Whenever suits'};
function mkMU(o){
  return Object.assign({
    id:o.id, sport:o.sport, mode:o.mode||'comp', fmt:SPORTS[o.sport].fmt,
    dur:o.dur||SPORTS[o.sport].dur,
    players:o.players, proposedBy:o.proposedBy||'me',
    accepted:o.accepted||[o.proposedBy||'me'],
    state:o.state||'proposed', createdAt:o.createdAt||S.now,
    expiresAt:o.expiresAt||((o.createdAt||S.now)+PROPOSAL_H*HOUR),
    window:o.window||'any',
    /* the plan is a DAY and a PART OF THE DAY — never a clock time.
       Nobody can promise 18:30 before a court exists, so the app stops
       pretending: the exact hour is written by whoever books, and only
       when they have actually booked it. */
    plan:o.plan||{day:null,part:null,spot:null,custom:null,agreed:false},
    /* one owner per game: whoever takes on the booking. Claiming is
       irreversible while the game lives — two owners means two courts. */
    owner:o.owner||null,
    booking:o.booking||{time:null,spot:null,custom:null,at:null,
                        deadline:null,share:null,cost:null},
    pay:o.pay||{},               /* pid -> {method,declaredAt,paid,paidAt,reminded} */
    caseId:o.caseId||null,       /* an open unpaid case, if it came to that   */
    chat:o.chat||[], score:o.score||null, scoreBy:o.scoreBy||null, confirmed:!!o.confirmed,
    counted:o.counted!==false, attendance:o.attendance||null, declinedBy:o.declinedBy||null,
    resultSeen:false
  },o);
}
/* ---------------- the plan: day + part of day ---------------- */
const PARTS=[{k:0,n:'Morning',s:'morning',h:10,r:'08:00–12:00'},
             {k:1,n:'Afternoon',s:'afternoon',h:15,r:'12:00–17:00'},
             {k:2,n:'Evening',s:'evening',h:19,r:'17:00–22:30'}];
function partName(i){return i==null?null:PARTS[i].n;}
function planWord(m){
  if(!m.plan||m.plan.day==null) return WINDOWS[m.window];
  const d=dow(m.plan.day)+' '+new Date(m.plan.day).getDate();
  return m.plan.part==null?d:d+' · '+PARTS[m.plan.part].s;
}
/* the headline: an exact time only exists once somebody booked a court */
function planExact(m){return !!(m.booking&&m.booking.time!=null);}
function headTime(m){
  const t=planTs(m);
  if(planExact(m)&&t!=null) return hm(t);
  if(m.plan&&m.plan.part!=null) return PARTS[m.plan.part].n;
  if(m.plan&&m.plan.day!=null) return dowl(m.plan.day);
  return WINDOWS[m.window];
}
function whereWord(m){
  const b=m.booking||{};
  if(b.spot) return spotOf(b.spot).n;
  if(b.custom) return b.custom;
  if(m.plan.spot) return spotOf(m.plan.spot).n;
  if(m.plan.custom) return m.plan.custom;
  return null;
}
function others(m){return m.players.filter(p=>p!=='me');}
/* ------------------------------------------------------------------
   A doubles game challenged one-to-one starts life half-built: two
   people, four seats. The line-up is therefore a property of the
   MEETUP, not only of the builder \u2014 it can be completed later, from
   the card, by the same engine or the same list.
   ------------------------------------------------------------------ */
function seatsFor(m){return SPORTS[m.sport].players;}
function seatsOpen(m){return Math.max(0,seatsFor(m)-m.players.length);}
function pendingOf(m){return m.players.filter(p=>p!=='me'&&m.accepted.indexOf(p)<0);}
function lineupDone(m){return seatsOpen(m)===0&&pendingOf(m).length===0;}
/* where everybody stands: the saved arrangement if there is one, else
   you on one side and whoever you challenged on the other */
function muSeats(m){
  const n=seatsFor(m);
  if(m.sides){
    const h=n/2, a=m.sides.A.slice(0,h), b=m.sides.B.slice(0,h);
    while(a.length<h)a.push(null);
    while(b.length<h)b.push(null);
    return a.concat(b);
  }
  const seats=new Array(n).fill(null), oth=others(m);
  seats[0]='me';
  if(n===2){seats[1]=oth[0]||null;return seats;}
  seats[2]=oth[0]||null; seats[1]=oth[1]||null; seats[3]=oth[2]||null;
  return seats;
}
/* A timestamp always exists for sorting and for the clock, but it is the
   booked time when there is one and the middle of the agreed part of the
   day when there is not. The interface never shows the second kind as a
   clock time — only as "Saturday evening". */
function planTs(m){
  if(!m.plan||m.plan.day==null) return null;
  const d=new Date(m.plan.day);
  if(m.booking&&m.booking.time!=null){d.setHours(Math.floor(m.booking.time/60),m.booking.time%60,0,0);return d.getTime();}
  if(m.plan.part==null) return null;
  d.setHours(PARTS[m.plan.part].h,0,0,0); return d.getTime();
}
/* enough to lock: a day, a part of the day, and where you are aiming */
function planReady(m){return m.plan&&m.plan.day!=null&&m.plan.part!=null&&(m.plan.spot!=null||m.plan.custom);}
function muEnd(m){const t=planTs(m);return t==null?null:t+m.dur*60e3;}
function syncMU(m){
  if(m.state==='proposed'&&S.now>=m.expiresAt) m.state='expired';
  if((m.state==='matched'||m.state==='confirmed')){
    const end=muEnd(m);
    if(end!=null&&S.now>=end){m.state='played';m.playedAt=end;}
  }
  return m;
}
function syncAll(){Object.keys(S.mus).forEach(k=>syncMU(S.mus[k]));}
function resultOpen(m){return m.state==='played'&&!m.confirmed&&m.playedAt&&S.now<m.playedAt+RESULT_H*HOUR;}
function resultLapsed(m){return m.state==='played'&&!m.confirmed&&m.playedAt&&S.now>=m.playedAt+RESULT_H*HOUR;}
const ST_TONE={good:'var(--mint)',watch:'var(--coral)',time:'var(--amber)',
               ended:'var(--red)',idle:'rgba(255,255,255,.45)'};

/* ==================================================================
   COURT & MONEY — ownership, the split, and the unpaid case
   ------------------------------------------------------------------
   The app still touches no money. What it does is name the one person
   who took on the booking, record how everybody says they will settle
   with that person, and let that person tick people off. Every number
   here is a note between friends, not a transaction.

   The unpaid case is the sharpest tool in the product, so it is the
   most constrained: only the owner can open one, only after the game,
   only after a deadline and a reminder, the accused can answer it, it
   expires on its own, and opening a false one costs the owner. See the
   pipeline document for why the city-wide wall of shame was cut.
   ================================================================== */
const PAY_GRACE_H=24;      /* after the deadline, before a report is possible */
const CASE_FREEZE_D=14;    /* a hold nobody can extend by doing nothing       */
const METHODS=[['blik','BLIK'],['transfer','Bank transfer'],['cash','Cash on the day'],
               ['revolut','Revolut'],['settled','Already settled up']];
const METHODN={}; METHODS.forEach(m=>METHODN[m[0]]=m[1]);
const DEADLINES=[['before','Before we play',-2*HOUR],['day','On the day',10*HOUR],
                 ['after2','Two days after',2*DAY],['after7','A week after',7*DAY]];
function isOwner(m){return m.owner==='me';}
function payers(m){return m.owner?m.players.filter(p=>p!==m.owner):[];}
function payOf(m,pid){return m.pay[pid]||(m.pay[pid]={method:null,declaredAt:null,paid:false,paidAt:null,reminded:false});}
function booked(m){return !!(m.booking&&m.booking.at&&m.booking.time!=null);}
function unpaid(m){return payers(m).filter(p=>!payOf(m,p).paid);}
function iOwe(m){return m.owner&&m.owner!=='me'&&booked(m)&&!payOf(m,'me').paid;}
function deadlinePassed(m){return booked(m)&&m.booking.deadline!=null&&S.now>m.booking.deadline;}
function moneyOpen(m){return booked(m)&&unpaid(m).length>0;}
function shareTxt(m){return m.booking&&m.booking.share?m.booking.share:'to be agreed';}
/* cases */
function openCases(){return (S.cases||[]).filter(c=>!c.released);}
function caseOn(pid){return openCases().filter(c=>c.on===pid)[0]||null;}
function myCase(){return caseOn('me');}
function frozen(){const c=myCase();
  return !!(c&&!c.disputed&&S.now<c.at+CASE_FREEZE_D*DAY);}
function caseOf(m){return (S.cases||[]).filter(c=>c.id===m.caseId)[0]||null;}
function canReport(m,pid){
  /* the gate, in full: you own it, you played it, a court was actually
     booked, they have not settled, your deadline passed, a further grace
     period passed, you sent exactly one reminder, and nobody else is
     already holding them. Any one of these missing and the button is not
     there. */
  return isOwner(m)&&m.state==='played'&&booked(m)&&!payOf(m,pid).paid
    &&deadlinePassed(m)&&S.now>m.booking.deadline+PAY_GRACE_H*HOUR
    &&payOf(m,pid).reminded&&!caseOn(pid);
}
/* the block a case puts on a player — new commitments only. Chat with
   the person owed stays open, because a hold that stops you settling up
   is a hold that never ends. */
function blockNew(){
  if(!frozen()) return null;
  const c=myCase();
  return {why:'One unsettled payment · '+PLAYERS[c.by].n.split(' ')[0]+' · '+(c.share||'the court'),id:c.id};
}
function guardNew(){
  const b=blockNew();
  if(b){go('cases');return true;}
  return false;
}

/* ==================================================================

   these; the reference screen (You → Match card states) is generated
   from this list, so what the app shows and what it documents cannot

   ================================================================== */
const MU_PHASES=['Before it is a game','Getting it organised','The court and the money',

const MU_STATES=[

 {k:'filling',ph:1,tag:'Line-up incomplete',tone:'time',

const MU_ST={}; MU_STATES.forEach(s=>MU_ST[s.k]=s);

function muState(m){
  syncMU(m);
  const them=others(m), n1=them.length===1, nm=n1?PLAYERS[them[0]].n.split(' ')[0]:them.length+' players';
  const iProposed=m.proposedBy==='me';
  const spotN=whereWord(m);
  const t=planTs(m), oN=m.owner?(m.owner==='me'?'you':PLAYERS[m.owner].n.split(' ')[0]):null;
  const out=(k,ctx,lines)=>({key:k,tag:MU_ST[k].tag,tone:MU_ST[k].tone,ctx:ctx,lines:lines});
  const c=caseOf(m);
  if(c&&!c.released) return out('reported',
    c.on==='me'?'you owe '+PLAYERS[c.by].n.split(' ')[0]:PLAYERS[c.on].n.split(' ')[0]+' has not settled',
    c.on==='me'
      ?[[0,'Your account is on hold until this is settled or you answer it'],
        [1,'The chat with '+PLAYERS[c.by].n.split(' ')[0]+' stays open — that is how it gets fixed'],
        [0,'It lifts the moment they mark you paid, and lapses on its own after '+CASE_FREEZE_D+' days']]
      :[[1,'You reported '+PLAYERS[c.on].n.split(' ')[0]+' '+when(c.at).toLowerCase()+' for '+(c.share||'the court')],
        [1,'They cannot start anything new until it is settled or answered'],
        [0,'Release it the moment the money lands — that is on you, not on support']]);
  if(m.state==='declined') return out('declined',iProposed?nm+' passed this time':'you passed',
    [[1,'Nothing happened to anybody — a pass costs nothing on either side'],
     [0,'The matcher learns from it and stops proposing games like this one'],
     [0,'Their answer is between you and them. Nobody else is told']]);
  if(m.state==='expired') return out('expired','no answer within '+PROPOSAL_H+' hours',
    [[1,'The challenge lapsed quietly — nobody is charged, blamed or notified'],
     [0,'Leaving challenges unanswered does show on the answer record'],
     [0,'You can challenge somebody else in two taps']]);
  if(m.state==='cancelled') return out('cancelled','the plan was called off',
    [[1,'Everybody was told the moment it happened'],
     [0,'A cancelled plan is on the record of whoever cancelled — that is all'],
     [0,m.owner?(oN==='you'?'You booked it, so the court is yours to unwind':oN+' booked it and will unwind the court'):'Nobody had booked anything yet']]);
  if(m.state==='proposed'){
    return iProposed
      ? out('sent','waiting for '+nm,
         [[1,'Sent '+when(m.createdAt)+' · '+WINDOWS[m.window].toLowerCase()],
          [0,nm+' has until '+when(m.expiresAt)+' '+hm(m.expiresAt)+' to answer'],
          [0,'Nothing opens until they accept — no chat, no plan, no pressure'],
          [0,'If it lapses, nobody is told and nothing is held against you']])
      : out('incoming','from '+nm,
         [[1,nm+' wants a '+m.sport.toLowerCase()+' game · '+WINDOWS[m.window].toLowerCase()],
          [0,'Answer by '+when(m.expiresAt)+' '+hm(m.expiresAt)+' — after that it lapses quietly'],
          [0,'Declining costs nothing and '+nm+' is simply told not this time'],
          [0,'Accepting opens a chat about this game, and nothing else']]);
  }
  if(m.state==='played'){
    const money=moneyOpen(m)?[deadlinePassed(m)?0:1,
      isOwner(m)?(unpaid(m).length+' of '+payers(m).length+' still to settle with you')
                :(payOf(m,'me').paid?'You are marked paid':'You still owe '+PLAYERS[m.owner].n.split(' ')[0]+' '+shareTxt(m))]:null;
    if(m.confirmed&&moneyOpen(m)&&deadlinePassed(m)) return out('overdue',
      isOwner(m)?'the deadline passed':'you owe '+PLAYERS[m.owner].n.split(' ')[0],
      [[1,'The game is counted — the court is what is outstanding'],
       [0,isOwner(m)?'Send one reminder. A report only becomes possible '+PAY_GRACE_H+' h after that':'Settle it and mark how — the owner ticks it off'],
       [0,'Nothing here moves money. The app only records who says what']]);
    if(m.confirmed) return out('counted','confirmed by both sides',
      [[1,(m.score||'The result')+' · confirmed on one tap by the other side'],
       [1,'Your '+m.sport.toLowerCase()+' level has already moved'],
       money||[1,'Everybody settled up — nothing outstanding'],
       [1,'Attendance recorded for everybody — turning up is the whole Player Score']]);
    if(!m.counted) return out('friendly','a friendly — no level moves',
      [[1,'You played '+when(t)+' — the score can be recorded, levels stay put'],
       [0,'Attendance and reliability still count, exactly as for a counted game'],
       money||[0,'A friendly is a real setting, not a loophole']]);
    if(resultLapsed(m)) return out('uncounted','the result window closed',
      [[1,'No score was confirmed within '+RESULT_H+' hours of the end'],
       [0,'The game counts for nobody — there is nothing to dispute and no appeal'],
       money||[0,'Everybody loses a point of answer record. Getting the result in is a shared job']]);
    if(m.score) return out('confirmres','one tap from you',
      [[1,PLAYERS[m.scoreBy]?PLAYERS[m.scoreBy].n.split(' ')[0]+' entered '+m.score:m.score+' entered'],
       [0,'You played the other side, so one tap from you makes it final'],
       money||[0,'Then, and only then, does anybody\u2019s level move']]);
    return out('needsres','any of you can enter it',
      [[1,'You played '+when(t)+' at '+(spotN||'your court')],
       [0,'Either side enters the score, the other confirms — '+RESULT_H+' h from the end'],
       money||[0,'Unconfirmed means uncounted. No dispute process, because there is nothing left to dispute']]);
  }
  if(m.state==='confirmed'){
    /* locked, but is there a court? */
    if(!m.owner) return out('needsowner','somebody has to book it',
      [[1,'Agreed for '+planWord(m)+(spotN?' · aiming for '+spotN:'')],
       [0,'No court exists until one of you books one — the app cannot do it for you'],
       [0,'Whoever takes it on becomes the owner: they book, they set the deadline, they tick off payments'],
       [0,'One owner only. Two people booking is two courts and one argument']]);
    if(!booked(m)) return out('booking',oN+' '+(oN==='you'?'are booking it':'is booking it'),
      [[1,'Agreed for '+planWord(m)+(spotN?' · aiming for '+spotN:'')],
       [1,(oN==='you'?'You took':oN+' took')+' the booking on '+when(m.ownerAt||m.createdAt).toLowerCase()],
       [0,oN==='you'?'Book the court, then write in the time, the place and when you want people to settle'
                    :'The exact time appears here the moment '+oN+' has a court'],
       [0,'Nobody owes anything until there is a court to owe for']]);
    const today=t!=null&&sameDay(t,S.now);
    const mine=payOf(m,'me');
    if(today) return out('today',hm(t)+' at '+(spotN||'your court'),
      [[1,'Booked by '+(oN==='you'?'you':oN)+' · '+m.dur+' minutes'],
       [iOwe(m)?0:1,iOwe(m)?'You still owe '+PLAYERS[m.owner].n.split(' ')[0]+' '+shareTxt(m)
                           :(isOwner(m)?(unpaid(m).length?unpaid(m).length+' still to settle with you':'Everybody has settled')
                                       :'You are settled with '+PLAYERS[m.owner].n.split(' ')[0])],
       [0,'The score goes in right after — either side enters, the other confirms']]);
    if(moneyOpen(m)&&deadlinePassed(m)) return out('overdue',
      isOwner(m)?unpaid(m).length+' unsettled':'you owe '+PLAYERS[m.owner].n.split(' ')[0],
      [[1,'Court booked · '+when(t)+' '+hm(t)+' at '+(spotN||'your place')],
       [0,isOwner(m)?'The deadline you set has passed. One reminder first — a report is a last resort'
                    :'The deadline has passed. Settle it and mark how you paid'],
       [0,'The app moves no money. '+(isOwner(m)?'You tick people off as it lands':PLAYERS[m.owner].n.split(' ')[0]+' ticks you off when it lands')]]);
    if(moneyOpen(m)) return out('settle',
      isOwner(m)?'collecting from '+unpaid(m).length+' of '+payers(m).length:'your share: '+shareTxt(m),
      [[1,'Court booked by '+(oN==='you'?'you':oN)+' · '+when(t)+' '+hm(t)+' at '+(spotN||'your place')],
       [isOwner(m)?1:(mine.method?1:0),
        isOwner(m)?(unpaid(m).length?'Waiting on '+unpaid(m).map(p=>PLAYERS[p].n.split(' ')[0]).join(', '):'Everybody has settled')
                  :(mine.method?'You said you would pay by '+METHODN[mine.method]:'Say how you will settle — it takes one tap')],
       [0,m.booking.deadline?(isOwner(m)?'You asked for it by ':'Owner asked for it by ')+when(m.booking.deadline)+' '+hm(m.booking.deadline):'No deadline set'],
       [0,'Rakieta never touches the money — this is a shared note, nothing more']]);
    return out('confirmedmu','locked, booked and settled',
      [[1,when(t)+' '+hm(t)+' at '+(spotN||'your place')+' · booked by '+(oN==='you'?'you':oN)],
       [1,payers(m).length?'Everybody has settled with '+(oN==='you'?'you':oN):'Nothing to split'],
       [0,'Changing the plan reopens it for everybody, and the change is on the record of whoever moved it']]);
  }
  /* matched, but a doubles line-up that is not yet four */
  if(!lineupDone(m)){
    const gap=seatsOpen(m), pend=pendingOf(m);
    return out('filling',
      gap?gap+' seat'+(gap===1?'':'s')+' still open':'waiting on '+pend.map(p=>PLAYERS[p].n.split(' ')[0]).join(' and '),
      [[1,'You and '+m.accepted.filter(p=>p!=='me').map(p=>PLAYERS[p].n.split(' ')[0]).join(', ')+' are in'],
       [gap?0:1,gap?(m.sport+' is doubles — '+gap+' more player'+(gap===1?'':'s')+' needed before anybody books anything')
              :('Invited: '+pend.map(p=>PLAYERS[p].n.split(' ')[0]).join(', ')+' · '+PROPOSAL_H+' h each to answer')],
       [0,gap?'The engine can find the evenest pair to complete it, or you can pick them yourself'
             :'A pass reopens the seat and the engine offers a replacement'],
       [0,'The plan cannot be locked until every seat is taken']]);
  }
  const planned=[m.plan.day!=null,m.plan.part!=null,(m.plan.spot!=null||m.plan.custom)].filter(Boolean).length;
  if(planned>0) return out('planning',planned+' of 3 agreed — day · part of day · where',
    [[1,'Matched with '+nm+' · the chat is open'],
     [m.plan.day!=null?1:0,m.plan.day!=null?dowl(m.plan.day)+' agreed':'Agree a day'],
     [m.plan.part!=null?1:0,m.plan.part!=null?PARTS[m.plan.part].n+' agreed ('+PARTS[m.plan.part].r+')':'Agree a part of the day'],
     [(m.plan.spot||m.plan.custom)?1:0,(m.plan.spot||m.plan.custom)?spotN+' agreed':'Agree where you are aiming'],
     [0,'No exact time yet — that comes from whoever gets the court']]);
  return out('matched','matched · plan it in the chat',
    [[1,'You and '+nm+' both said yes — the chat is open'],
     [0,'Agree a day, a part of the day and roughly where. The plan card keeps track'],
     [0,'Then one of you takes on the booking — courts are not bookable here, and never will be'],
     [0,'The clock time appears when the court is real, not before']]);
}

function myMUs(){
  return Object.values(S.mus).filter(m=>{
    syncMU(m);
    if(['declined','expired','cancelled'].indexOf(m.state)>=0) return false;
    if(m.state==='played'&&m.confirmed&&m.resultSeen) return false;
    if(m.state==='played'&&resultLapsed(m)&&m.resultSeen) return false;
    return true;
  }).sort((a,b)=>{
    const ta=planTs(a)||a.expiresAt, tb=planTs(b)||b.expiresAt;
    return ta-tb;
  });
}
function incoming(){return Object.values(S.mus).filter(m=>{syncMU(m);return m.state==='proposed'&&m.proposedBy!=='me';});}

/* ---------------- the simulation ----------------
   Other players are simulated: they accept, decline, type and reply.
   Every scheduled callback carries the epoch it was born in, so a
   scenario switch or a fresh state silently orphans it. */
function later(ms,fn){
  const ep=S.epoch;
  setTimeout(()=>{if(S&&S.epoch===ep)fn();},ms);
}
function notify(o){S.notif.unshift(Object.assign({t:S.now,unread:true},o));}
function gathAdd(g,who,txt,kind){g.chat.push({who:who,txt:txt,t:S.now,kind:kind||null});}
function simGath(g,pid,txt,ms){
  if(!pid)return;
  later(ms||1400,()=>{const gg=S.gath[g.id];if(!gg)return;gathAdd(gg,pid,txt);render();});
}
function chatAdd(m,who,txt,kind){
  m.chat.push({who:who,txt:txt,t:S.now,kind:kind||'msg'});
}

function discPool(sport){
  const F=S.filters;
  return POOL.filter(id=>{
    const p=PLAYERS[id];
    if(S.blocked.indexOf(id)>=0) return false;
    const L=lv(id,sport); if(!L) return false;
    const my=S.me.lv[sport]; if(!my) return false;
    if(F.band&&Math.abs(L[0]-my[0])>F.band+1e-9) return false;
    if(p.km>F.km) return false;
    if(F.avail==='today'&&!p.av[todayIdx()].some(Boolean)) return false;
    if(F.avail==='tonight'&&p.av[todayIdx()][2]!==1) return false;
    if(F.rel70&&p.score<SCORE_MIN) return false;
    if(F.tags.length&&!F.tags.some(t=>(p.tags||[]).indexOf(t)>=0)) return false;
    return true;
  }).map(id=>({id:id,c:compat(id,sport,'comp')})).sort((a,b)=>(b.c?b.c.score:0)-(a.c?a.c.score:0));
}
function activeDiscFilters(){
  const F=S.filters; let n=0;
  if(F.band!==0.35)n++; if(F.km!==10)n++; if(F.avail!=='any')n++; if(F.tags.length)n++; if(F.rel70)n++;
  return n;
}

  let list=mmPool(sp,S.mm.mode).filter(x=>seated.indexOf(x.id)<0&&!hasOpenWith(x.id)&&lvOf(x.id,sp));
  const sort=F.sort||'fit';
  if(sort==='fit') list=list.slice().sort((a,b)=>rankScore(b)-rankScore(a));
  if(sort==='near') list=list.slice().sort((a,b)=>PLAYERS[a.id].km-PLAYERS[b.id].km);

    if(oneLeft){

      const fb=arrangedForecast(sp,fillFirst(F.seats,b.id))||{pct:0};
      return fb.pct-fa.pct;

    ${pf?`<div class="hair">

      <div class="balbar" style="height:16px">
        <i style="width:${Math.max(20,Math.min(80,50+(pf.A-pf.B)*34))}%;background:rgba(255,255,255,.85);color:var(--night);font-size:8px">${sideNames(pf.sideA)}</i>
        <i style="width:${100-Math.max(20,Math.min(80,50+(pf.A-pf.B)*34))}%;background:${balTone(pf.pct)};font-size:8px">${sideNames(pf.sideB)}</i></div>
      ${pf.provisional?`<div class="tiny" style="color:rgba(255,255,255,.75);margin-top:6px">Runs on what is seated so far, reading each half-empty side as if the missing player matched the one already there. It settles as you add.</div>`:''}</div>`
     :`<div class="hair"><span class="tiny" style="color:rgba(255,255,255,.75)">Add somebody to the far side and a running balance appears here.</span></div>`}</div>`;
  h+=`<div class="sqrow" style="margin-bottom:10px">
    ${[['fit','Best fit'],['even',singles?'Evenest game':'Evenest four'],['near','Closest'],['rel','Most reliable']]
      .map(x=>`<button class="chip sm ${sort===x[0]?'on':''}" data-act="foursort" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  if(sort==='even'&&!oneLeft&&open_)
    h+=`<div class="tiny" style="margin:-4px 0 10px">Sorted by the balance each one would leave on court. With seats still empty that reading is provisional — it assumes the gaps get filled like for like.</div>`;
  if(!list.length) h+=`<div class="card"><div class="empty"><b>Nobody left in range</b>Everybody compatible already has an open game with you. Widen the radius in You, or wait for an answer.</div></div>`;

    const nextSeats=(F.replace!=null&&F.seats[F.replace])
      ? F.seats.map((id,ix)=>ix===F.replace?x.id:id)
      : fillFirst(F.seats,x.id);

    ${m.players.map(p=>playerRow(p,sp,p===m.proposedBy?'<span class="tag">proposed it</span>':(m.accepted.indexOf(p)>=0?'<span class="tag ok">in</span>':'<span class="tag warn">asked</span>'))).join('')}
    <div class="tiny hair">Press and hold anyone for the full record — level, form, and how they behave. Machine-derived only; nobody writes reviews of people here.</div></div>`;
  /* the plan */

  if(m.state==='matched'&&!lineupDone(m)){
    const gap=seatsOpen(m), pend=pendingOf(m), seats=muSeats(m);

          <span class="tiny">${gap?'You challenged '+PLAYERS[others(m)[0]].n.split(' ')[0]+' one-to-one and they said yes. '+sp+' is doubles, so it needs '+gap+' more before it is a game.'

      :`<div class="tiny" style="margin-top:9px">Nothing to do but wait. If somebody passes, the seat comes back here.</div>`}
    </div>`;
  }
  if(['matched','confirmed'].indexOf(m.state)>=0){
    h+=planCard(m);
    h+=moneyCard(m);
    h+=`<button class="btn n full" style="margin-bottom:9px" data-go="chat" data-id="${m.id}">Open the chat</button>`;

};
function planCard(m){

      <span class="eyebrow">The plan</span>

    <div class="row" style="flex-wrap:nowrap">
      <button class="chip ${p.day!=null?'on':''}" style="flex:1;justify-content:center" data-act="planday" data-id="${m.id}">${p.day!=null?dow(p.day)+' '+new Date(p.day).getDate():'Day'}</button>
      <button class="chip ${p.part!=null?'on':''}" style="flex:1.2;justify-content:center" data-act="planpart" data-id="${m.id}">${p.part!=null?PARTS[p.part].n:'Part of day'}</button>
      <button class="chip ${sN?'on':''}" style="flex:1.3;justify-content:center;overflow:hidden" data-act="planspot" data-id="${m.id}">${sN||'Where'}</button></div>
    <div class="note info" style="margin:9px 0 0;padding:9px 11px"><b>No clock time yet — on purpose</b>
      <span class="tiny">Nobody can promise 18:30 before a court exists. Agree the day and the part of the day here; the exact hour is written in by whoever books, once they have booked.</span></div>
    ${m.state!=='confirmed'?`<button class="btn ${ready?'p':'s'} full" style="margin-top:9px;${ready?'':'opacity:.55'}" data-act="planlock" data-id="${m.id}" ${ready?'':'disabled'}>Lock it in${ready?'':' \u00b7 set all three first'}</button>`:''}
  </div>`;
}
/* ---------------- the court & money card ----------------
   One owner, one booking, one deadline, and a row per player showing how
   they say they will settle. The app is a shared notebook here: it moves
   nothing, holds nothing and charges nothing. */
function moneyCard(m){
  if(['matched','confirmed','played'].indexOf(m.state)<0) return '';
  if(m.state==='matched') return '';
  const oN=m.owner?(isOwner(m)?'You':PLAYERS[m.owner].n.split(' ')[0]):null;
  let h=`<div class="card" style="border:2px solid ${m.owner?(moneyOpen(m)?'var(--amber)':'var(--line)'):'var(--coral)'}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="eyebrow">The court &amp; the money</span>
      ${m.owner?`<span class="tag ${booked(m)?(moneyOpen(m)?'warn':'ok'):''}">${booked(m)?(moneyOpen(m)?unpaid(m).length+' to settle':'all settled'):'booking'}</span>`
               :'<span class="tag hot">no owner yet</span>'}</div>`;
  /* --- who owns it --- */
  if(!m.owner){
    h+=`<div class="tiny" style="margin-bottom:9px">Rakieta cannot book a court and never will. One of you has to do it — and whoever does becomes the owner of this game: they choose the place and the hour, they set when they want the money by, and they are the only one who can tick people off.</div>
      <button class="btn p full" data-act="claimowner" data-id="${m.id}">I\u2019ll book the court</button>
      <button class="btn s full" style="margin-top:7px" data-act="askowner" data-id="${m.id}">Ask the others to take it on</button>
      <div class="tiny" style="text-align:center;margin-top:7px">One owner per game. Once somebody claims it, the rest of you are players.</div>`;
    return h+`</div>`;
  }
  h+=`<div class="rl" style="border-top:0"><span>Owner</span>
    <b style="display:flex;align-items:center;gap:6px">${faceAvat(m.owner,20)} ${isOwner(m)?'You':PLAYERS[m.owner].n}</b></div>`;
  /* --- the booking --- */
  if(!booked(m)){
    if(isOwner(m)){
      const b=m.booking;
      h+=`<div class="tiny" style="margin:8px 0 9px">Book it wherever you like — by phone, in the club\u2019s own app, at the desk. Then write down what you booked so the others know when to turn up.</div>
        <div class="row" style="flex-wrap:nowrap;margin-bottom:7px">
          <button class="chip ${b.time!=null?'on':''}" style="flex:1;justify-content:center" data-act="booktime" data-id="${m.id}">${b.time!=null?hm(planTs(m)):'Hour'}</button>
          <button class="chip ${b.spot||b.custom?'on':''}" style="flex:1.4;justify-content:center;overflow:hidden" data-act="bookspot" data-id="${m.id}">${b.spot?spotOf(b.spot).n:(b.custom||'Which court')}</button></div>
        <div class="row" style="flex-wrap:nowrap;margin-bottom:9px">
          <button class="chip ${b.share?'on':''}" style="flex:1;justify-content:center" data-act="bookshare" data-id="${m.id}">${b.share||'Share each'}</button>
          <button class="chip ${b.deadline!=null?'on':''}" style="flex:1.2;justify-content:center" data-act="bookdead" data-id="${m.id}">${b.deadline!=null?'By '+when(b.deadline).toLowerCase():'Pay by'}</button></div>
        <button class="btn ${(b.time!=null&&(b.spot||b.custom))?'p':'s'} full" ${(b.time!=null&&(b.spot||b.custom))?'':'disabled style="opacity:.55"'} data-act="markbooked" data-id="${m.id}">Court booked \u2014 tell everybody</button>
        <div class="tiny" style="text-align:center;margin-top:7px">The share is a note between you. Rakieta shows it and counts nothing.</div>`;
    } else {
      h+=`<div class="tiny" style="margin:8px 0 0">${oN} is getting a court for ${planWord(m)}. The exact hour and the place appear here as soon as they have it, and only then does anybody owe anything.</div>
        <button class="btn s full" style="margin-top:9px" data-go="chat" data-id="${m.id}">Ask how it is going</button>`;
    }
    return h+`</div>`;
  }
  /* --- booked: the split --- */
  const b=m.booking;
  h+=`<div class="rl"><span>Court</span><b>${whereWord(m)} \u00b7 ${hm(planTs(m))}</b></div>
    <div class="rl"><span>Share each</span><b>${b.share||'not written down'}</b></div>
    <div class="rl"><span>Owner asked for it by</span><b class="mono">${b.deadline!=null?when(b.deadline)+' '+hm(b.deadline):'no deadline'}
      ${deadlinePassed(m)&&moneyOpen(m)?'<span class="tag bad">passed</span>':''}</b></div>`;
  /* my own row, when I am a player */
  if(m.owner!=='me'){
    const mine=payOf(m,'me');
    h+=`<div class="hair"><span class="flab">How you are settling with ${oN}</span>
      <div class="row">${METHODS.map(x=>`<button class="chip sm ${mine.method===x[0]?'on':''}" data-act="paymethod" data-id="${m.id}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
      <div class="tiny" style="margin-top:7px">${mine.paid?'\u2713 '+oN+' marked you paid '+when(mine.paidAt).toLowerCase()+'. Nothing outstanding.'
        :mine.method?'Noted. Send it however you said — then '+oN+' ticks you off when it lands. Rakieta is not in the middle of this.'
        :'Pick one so '+oN+' knows what to expect. It is a note, not a payment.'}</div></div>`;
  }
  /* the owner's table */
  if(isOwner(m)){
    h+=`<div class="hair"><span class="flab">Who has settled with you</span>`;
    payers(m).forEach(pid=>{
      const pay=payOf(m,pid), c=caseOn(pid);
      h+=`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line2)">
        ${faceAvat(pid,26)}
        <span style="flex:1;min-width:0"><b style="font-size:11.5px;display:block">${PLAYERS[pid].n}</b>
          <span class="tiny">${pay.paid?'Paid \u00b7 '+when(pay.paidAt).toLowerCase():(pay.method?'Says: '+METHODN[pay.method]:'Has not said how yet')}${pay.reminded&&!pay.paid?' \u00b7 reminded':''}</span></span>
        ${c?`<span class="tag bad">reported</span>`
          :pay.paid?`<span class="tag ok">paid</span>`
          :`<button class="btn s" style="height:26px;font-size:10.5px" data-act="markpaid" data-id="${m.id}" data-v="${pid}">Mark paid</button>`}</div>`;
      if(!pay.paid&&!c&&deadlinePassed(m)){
        h+=`<div class="row" style="padding-bottom:6px">
          ${!pay.reminded?`<button class="chip sm" data-act="remind" data-id="${m.id}" data-v="${pid}">Send a reminder</button>`:''}
          ${canReport(m,pid)?`<button class="chip sm" style="color:var(--red);border-color:#F0CFC9" data-act="reportask" data-id="${m.id}" data-v="${pid}">Report unpaid</button>`
            :`<span class="tiny" style="padding:4px 2px">${pay.reminded?'A report opens '+PAY_GRACE_H+' h after the reminder, and only after you have played.':'A reminder comes first.'}</span>`}</div>`;
      }
    });
    h+=`<div class="tiny hair">You booked it, so you are the one who knows what landed. Mark people off as it comes in — a paid tick lifts everything immediately.</div></div>`;
  }
  return h+`</div>`;
}

        <span class="tag">${planWhen(g)}</span></div>`;});
    h+=`</div>`;
  }
  h+=`<div class="note info"><b>Chat exists only inside a game or a plan</b><span class="tiny">A conversation opens when a challenge is accepted, or when you count yourself into something tonight. There is no way to message a stranger privately — that line is what keeps this a sports app.</span></div>`;

V.result=function(){
  const m=S.mus[cur().id]||Object.values(S.mus).filter(x=>resultOpen(x))[0];
  if(!m) return head('Match result','',true)+'<div class="empty"><b>Nothing needs a result</b></div>';
  syncMU(m);
  const them=others(m), sp=m.sport, oneOpp=them.length===1?PLAYERS[them[0]]:null;
  const end=m.playedAt||muEnd(m)||S.now;
  const left=dur(end+RESULT_H*HOUR-S.now), lapsed=resultLapsed(m);
  let h=head('Match result',`${m.sport} · ${when(planTs(m)||end)} · ${whereWord(m)||'your court'}`,true);
  if(lapsed&&!m.confirmed){
    h+=`<div class="note"><b>The window closed</b><span class="tiny">No score was confirmed within ${RESULT_H} hours of the end, so this game counts towards nobody's level. There is nothing to argue about and nothing to appeal — it is simply uncounted.</span></div>`;
    h+=`<button class="btn n full" data-act="home">Back to Now</button>`;
    m.resultSeen=true;
    return h;
  }
  if(m.confirmed){
    const d=m.lastDelta||{delta:0};
    const L=S.me.lv[sp];
    h+=`<div class="card-n" style="text-align:center;padding:14px">

        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <span class="mono num" style="font-size:18px;color:var(--muted)">${lvl(L[0]-d.delta)}</span><span style="color:var(--muted)">→</span>
          <span class="mono num" style="font-size:23px;color:${d.delta>=0?'var(--mint)':'var(--red)'}">${lvl(L[0])}</span>
          <span class="tag ${d.delta>=0?'ok':'bad'}">${d.delta>=0?'+':''}${lvl(d.delta)}</span></div>
        ${[['Expected result',oneOpp?oneOpp.n.split(' ')[0]+' averaged '+lvl((lv(them[0],sp)||[0])[0])+' against your '+lvl(L[0]-d.delta)+(d.delta>0?' — the upset paid':''):'Computed from both sides'],
           ['Confidence','Yours was '+L[2]+'%, so the move is moderate rather than violent'],
           ['Sport','Only your '+sp.toLowerCase()+' level moved. Everything else is untouched'],
           ['Attendance','Recorded for everybody — turning up is the whole Player Score']]
          .map(r=>`<div style="padding:7px 0;border-top:1px solid var(--line2)">
            <div class="eyebrow" style="font-size:8.5px">${r[0]}</div>
            <div class="tiny" style="color:var(--ink);margin-top:2px">${r[1]}</div></div>`).join('')}</div>`;
    } else h+=`<div class="note"><b>A friendly</b><span class="tiny">The score is recorded, nobody's level moves, and attendance still counts.</span></div>`;
    if(!m.attendance){
      h+=`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Did everybody turn up?</div>
        <div class="row"><button class="btn s" style="flex:1" data-act="attyes" data-v="${m.id}">Everyone did</button>
        <button class="btn s" style="flex:1;color:var(--red)" data-act="attno" data-v="${m.id}">Somebody didn't</button></div>
        <div class="tiny" style="margin-top:8px">Attendance is confirmed by the people who were there. A no-show is the strongest mark on a Player Score, so it is never recorded silently.</div></div>`;
    } else h+=`<div class="note mint"><b>Attendance recorded</b><span class="tiny">${m.attendance==='all'?'Everyone confirmed present. Player Scores move up a point each.':'The absence is on their record — and only theirs. Your evening is not the thing that gets punished.'}</span></div>`;
    h+=`<button class="btn n full" data-act="resultdone" data-v="${m.id}">Back to Now</button>`;
    return h;
  }
  if(m.score){
    h+=`<div class="card-n" style="text-align:center;padding:14px">
      <span class="tag w"><i style="background:var(--coral)"></i>${left} left</span>
      <div class="num" style="font-size:26px;margin:10px 0 5px">${m.score}</div>
      <div class="tiny">Entered by ${PLAYERS[m.scoreBy].n.split(' ')[0]} · you played the other side</div></div>`;
    h+=`<div class="note mint"><b>One tap from you makes it final</b><span class="tiny">The score is entered by one side and confirmed by the other. That is the whole check — a teammate agreeing with a teammate would prove nothing.</span></div>`;
    h+=`<button class="btn p full" style="height:40px;margin-bottom:8px" data-act="confirmres" data-v="${m.id}">That's the score</button>
      <button class="btn s full" style="margin-bottom:9px" data-act="fixscore">No — let me correct it</button>
      <div class="tiny" style="text-align:center">If neither side confirms within ${RESULT_H} hours, the game does not count for anyone. There is no dispute process, because there is nothing left to dispute.</div>`;
    return h;
  }
  h+=`<div class="card-n" style="padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
      <span class="eyebrow">Enter the score</span><span class="tag w"><i style="background:var(--coral)"></i>${left} left</span></div>
    <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px">
      ${[['6','4'],['3','6'],['6','2']].map(g=>`<div style="text-align:center">
        <div class="num mono" style="font-size:26px;line-height:1.05">${g[0]}</div>
        <div style="height:1px;background:rgba(255,255,255,.25);margin:4px 0"></div>
        <div class="num mono" style="font-size:26px;line-height:1.05;color:rgba(255,255,255,.65)">${g[1]}</div></div>`).join('')}</div>
    <div class="tiny" style="text-align:center;color:rgba(255,255,255,.8)">You · ${them.map(p=>PLAYERS[p].n.split(' ')[0]).join(' & ')}</div></div>`;
  h+=`<div class="note"><b>Anybody who played can do this</b><span class="tiny">Not just whoever proposed the game. Making one person responsible turns a social evening into somebody's admin job.</span></div>`;
  h+=`<button class="btn p full" style="height:40px;margin-bottom:9px" data-act="entersscore" data-v="${m.id}">Enter · the other side confirms</button>
    <div class="tiny" style="text-align:center">${left} left. After that this game counts for nobody, and everybody's answer record slips a point — getting the result in is a shared job.</div>`;
  return h;
};

      <button class="btn p full" style="height:42px" data-act="obgo" data-v="avail">Use this one</button>`;
  if(ob.step==='avail')
    return prog+head('When can you usually play?','A preference, not a promise',false)+
      `<div class="card"><div class="gridav">
        <span></span>${DAYS7.map(d=>`<span class="gh">${d}</span>`).join('')}
        ${['AM','PM','EVE'].map((s,si)=>`<span class="gh">${s}</span>`+

      <button class="btn p full" style="height:42px" data-act="obgo" data-v="optin">Continue</button>`;
  if(ob.step==='optin')
    return prog+head('May the engine propose?','The one thing we ask before finishing',false)+
      `<div class="card"><div class="eyebrow" style="margin-bottom:6px">If you say yes</div>

        .map(r=>`<div class="rl" style="align-items:flex-start"><b style="width:100px;flex-shrink:0">${r[0]}</b><span class="tiny" style="text-align:right">${r[1]}</span></div>`).join('')}</div>
      <div class="row" style="flex-wrap:nowrap">

      <button class="btn p full" style="height:42px;margin-top:12px" data-act="obfinish" ${ob.opt===null?'disabled':''}>Finish — show me players</button>`;
  return prog+`<div class="empty"><b>Done</b></div>`;
};

let MUN=10;
function newMU(o){o.id='c'+(++MUN);S.mus[o.id]=mkMU(o);return S.mus[o.id];}
function acceptMU(m,greet){
  m.state='matched';
  if(m.accepted.indexOf('me')<0)m.accepted.push('me');
  others(m).forEach(p=>{if(m.accepted.indexOf(p)<0)m.accepted.push(p);});
  chatAdd(m,'sys','Game on — '+(others(m).length===1?'you both said yes':'everybody said yes'),'sys');
  if(seatsOpen(m))
    chatAdd(m,'sys',m.sport+' is doubles — '+seatsOpen(m)+' more to find, from the card','sys');
  if(greet!==false) chatAdd(m,others(m)[0],voice(others(m)[0],0));
  showSplash(m); render();
}
function sendChallenge(pid,sport,mode,window_){
  if(guardNew())return null;
  const m=newMU({sport:sport,mode:mode,window:window_,players:['me',pid],proposedBy:'me'});
  toast(SPORTS[sport].players===4
    ?'Challenge sent — if '+PLAYERS[pid].n.split(' ')[0]+' says yes you can fill the other two seats'
    :'Challenge sent — '+PLAYERS[pid].n.split(' ')[0]+' has '+PROPOSAL_H+' h');
  const p=PLAYERS[pid];
  if(p.waved||p.score>=88) later(1900,()=>{const mm=S.mus[m.id];if(mm&&mm.state==='proposed')acceptMU(mm);});
  return m;

function applyResult(m){
  const sp=m.sport, oppMu=(lv(others(m)[0],sp)||[S.me.lv[sp][0]])[0];
  const d=resultDelta(sp,oppMu,m.winner==='me',15,12)||{delta:0};
  const L=S.me.lv[sp];
  L[0]=r2(L[0]+d.delta); L[3]=(L[3]||0)+1;
  L[2]=Math.min(99,L[2]+4); L[1]=r2(Math.max(0.06,L[1]-0.02));
  m.lastDelta=d; m.confirmed=true;
}
