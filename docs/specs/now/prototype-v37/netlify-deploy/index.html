/* ==================================================================
   LIFECYCLE
   Everything a match does to itself, in one place: the court is
   protected at the third payment, money commits only when the deadline
   has passed AND the match is complete, and T-2h means two different
   things depending on whether the match was ever confirmed.
   ================================================================== */
function syncMatch(m){
  if(m.forced) return m;
  const d=deadlines(m);
  const wasForm=m.formCancelled, wasChk=m.checkpointCancelled, wasRescue=m.rescueOpen;
  if(m.kind==='private'){
    if(!m.courtId){const c=COURTS.filter(x=>x.club===m.club&&x.sport===m.sport)[0];m.courtId=c?c.id:null;}
    return m;
  }
  /* --- court certainty: the hold ladder, and it runs both ways --- */
  const wasCourt=m.courtId, hold=courtHold(m);
  if(hold.kind!=='none'){
    if(!m.courtId){
      const cid=pickCourt(m);
      if(cid){ m.courtId=cid; m.protectedAt=S.now; m.holdKind=hold.kind; }
      else if(hold.kind==='hard' && !m.inventoryLost){
        /* \u00a76 \u00b7 a complete match with nowhere to go. The last compatible court
           went while the match was unsecured, so it cannot be fulfilled. */
        m.inventoryLost=true; m.clubCancelled=true;
      }
    } else m.holdKind=hold.kind;
  } else if(m.committedAt==null){
    m.courtId=null; m.protectedAt=null; m.holdKind=null;
    if(wasCourt) m.releasedAt=S.now;
  }
  /* \u00a714 \u00b7 an unsecured match whose category has sold out cannot be completed.
     Only inside the last twelve hours, though. A match four days out with no
     court held is not doomed \u2014 the club\u2019s calendar is still moving, bookings
     get cancelled, and declaring it dead on a Wednesday for a Sunday morning
     would kill every ordinary forming match on the board. */
  if(!m.courtId && m.committedAt==null && !m.inventoryLost && !m.clubCancelled
     && S.now>=m.start-HOLD_FAR*HOUR && S.now<d.check && !openCourtsFor(m).length){
    m.inventoryLost=true; m.clubCancelled=true;
  }
  /* --- commitment: the clock alone is not enough --- */
  if(m.committedAt==null && S.now>=d.commit && isFull(m))
    m.committedAt = S.now>d.commit+60e3 ? S.now : d.commit;   /* filled late commits on the spot */
  /* --- T-2h --- */
  if(S.now>=d.check){
    if(m.committedAt==null && !isFull(m)) m.formCancelled=true;         /* never completed */
    else if(m.committedAt!=null && filled(m)<m.n && !m.sponsoredGuest && CLUBS[m.club].rebooking)
      m.checkpointCancelled=true;                                       /* protected rebooking club */
  }
  /* §32 · the notifications that only the passage of time can produce */
  if(!wasRescue && rescueCore(m)){
    m.rescueOpen=true;
    notify({title:'Rescue Seat available',body:'A confirmed seat at '+CLUBS[m.club].n+' for '+zl(m.share/2)+
      ' instead of '+zl(payable(m))+'. Ten minutes to accept.',to:'the standby pool',tone:'var(--amber-soft)'});
  }
  if(!wasForm && m.formCancelled)
    notify({title:'Match cancelled \u2014 it stayed incomplete',body:'Two hours before play with seats unsold. Everybody is refunded in full and the court has gone back.',to:'everyone',tone:'var(--red-soft)'});
  if(!wasChk && m.checkpointCancelled)
    notify({title:'Match cancelled at the checkpoint',body:'No replacement was found. '+CLUBS[m.club].n+' credit is in your account.',to:'the three who stayed',tone:'var(--red-soft)'});
  if(m.courtId && !wasCourt && m.holdKind==='soft' && !m.softNotified){m.softNotified=true;
    notify({title:'A court is being held',body:'Two paid seats, so '+CLUBS[m.club].n+' is holding a '+
      (m.category||'compatible')+' court until '+HOLD_FAR+' hours before play. One more player makes it firmer.',
      to:'everyone in the match',tone:'var(--info-soft)'});}
  if(!m.courtId && wasCourt && m.releasedAt===S.now && !m.clubCancelled)
    notify({title:'The court went back',body:'The match is still short with '+
      (courtHold(m).why==='farLapsed'?HOLD_FAR:HOLD_NEAR)+' hours to go, so the court returned to the club. '+
      'Nothing you paid is affected, and the court comes back the moment another player pays.',
      to:'everyone in the match',tone:'var(--amber-soft)'});
  if(m.inventoryLost && !m.invNotified){m.invNotified=true;
    notify({title:'Cancelled \u2014 no court left',body:'The last '+(m.category||'compatible')+' court at '+
      CLUBS[m.club].n+' was sold while this match was still short. Everybody is refunded in full.',
      to:'everyone',tone:'var(--red-soft)'});}
  if(m.clubCancelled && !m.clubNotified && !m.inventoryLost){m.clubNotified=true;
    notify({title:'Court or weather cancellation',body:'The club cancelled. Everybody is refunded in full, including anybody who had already left.',to:'everyone',tone:'var(--red-soft)'});}
  return m;
}
function syncAll(){Object.keys(S.matches).forEach(k=>syncMatch(S.matches[k]));}
/* was the match committed late, i.e. by the final payment rather than by the clock? */
function committedOnFill(m){return m.committedAt!=null && m.committedAt>deadlines(m).commit+60e3;}

function matchState(m){
  syncMatch(m);
  if(m.forced){
    const keep=S.now; if(m.demoEnd) S.now=matchEnd(m)+6*60e3; if(m.demoCut) S.now=deadlines(m).check+5*60e3;
    if(m.demoFar) S.now=m.start-20*HOUR; if(m.demoNear) S.now=m.start-3*HOUR;
    const d=Object.assign({key:m.forced},ST[m.forced](m)); S.now=keep; return d;
  }
  const d=deadlines(m), end=m.start+m.dur*60e3;
  let k;
  if(m.inventoryLost) k='inventoryLost';
  else if(m.clubCancelled||m.weather) k='cancelledClub';
  else if(m.formCancelled) k='cancelledIncomplete';
  else if(m.checkpointCancelled) k='cancelledCheckpoint';
  else if(S.now>=end){
    if(m.noShow) k='playedNoShow';
    else if(filled(m)<m.n) k='playedShort';
    else if(m.confirmed) k='completed';
    else if(S.now>=resultWindow(m)) k='playedNoScore';
    else k = m.score?'confirmResult':'needsResult';
  }
  else if(!mySeat(m) && S.waitlists.includes(m.id)) k='waitlisted';
  else if(m.kind==='private'){
    k = m.openSeats>0?'privateOpen' : m.payModel==='split'?'privatePartial':'privateReserved';
  }
  else if(m.vacated && m.committedAt!=null){
    k = m.transferring ? 'replacementTransfer'
      : S.now>=d.check ? 'rescueLate'
      : S.now>=d.rescue ? 'rescue'
      : 'replacement';
  }
  else if(m.vacated) k = isProtected(m) ? 'protectedBack' : 'formingBack';
  else if(isFull(m)){
    k = S.now>=m.start-15*60e3 ? 'ready'
      : m.committedAt!=null ? (committedOnFill(m)?'confirmedOnFill':'confirmed')
      : 'full';
  }
  else if(isProtected(m)){
    const h=courtHold(m);
    k = h.why==='club' ? 'clubHeld'
      : h.kind==='soft' ? 'heldSoft'
      : S.now>=d.commit ? 'protectedLate' : 'protectedCourt';
  }
  /* a court that was held and went back is its own state — the player paid for a
     match that briefly had a court and now does not, and silence there would be
     the single most alarming gap on the screen */
  else if(m.releasedAt!=null && filled(m)>=2 && S.now<d.check) k='heldReleased';
  else if(m.seats.some(s=>s.p&&!s.paid)) k='formingHeld';
  else if(S.now>=d.commit) k='formingLate';
  else k='forming';
  const d2=Object.assign({key:k},ST[k](m));
  if(!mySeat(m) && k!=='waitlisted'){
    d2.lines=d2.lines.map(l=>/^You paid/.test(l[1])
      ? [0,'Your share would be '+zl(payable(m))+' · booking fee 0,00 zł']
      : l);
  }
  return d2;
}

SH.calendar=function(){
  const courts=S.sheet.mode==='courts';
  const base=new Date(S.now); base.setHours(0,0,0,0);
  const view=S.calMonth!=null?S.calMonth:0;
  const first=new Date(base.getFullYear(),base.getMonth()+view,1);
  const start=(first.getDay()+6)%7;                       /* Monday-first, Polish convention */
  const days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const counts={};
  const bump=t=>{const d=new Date(t);const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();counts[key]=(counts[key]||0)+1;};
  if(courts){const b0=new Date(S.now);b0.setHours(0,0,0,0);
    for(let dd=0;dd<14;dd++){
      const any=Object.keys(CLUBS).some(id=>clubPasses(id)&&
        CLUBS[id].sports.some(sp=>(S.sport==='all'||sp===S.sport)&&freeStarts(id,sp,SPORTS[sp].dur[0],dd).length));
      if(any) bump(b0.getTime()+dd*DAY);
    }}
  else Object.values(S.matches).forEach(m=>{if(m.forced||mySeat(m)||m.start<S.now)return;bump(m.start);});
  let cells='';
  for(let i=0;i<start;i++) cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const dt=new Date(first.getFullYear(),first.getMonth(),d);
    const past=dt<base, key=dt.getFullYear()+'-'+dt.getMonth()+'-'+d, has=counts[key]||0;
    const sel=(courts?S.cPickDate:S.pickDate)&&sameDay(courts?S.cPickDate:S.pickDate,dt), today=sameDay(dt,S.now);
    cells+=`<button ${past?'disabled':`data-act="${courts?'cpickday':'pickday'}" data-v="${dt.getTime()}"`}
      style="height:36px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      background:${sel?'var(--ink)':today?'var(--line2)':'transparent'};color:${sel?'#fff':past?'var(--line)':'var(--ink)'};
      font-size:12px;font-weight:${today||sel?700:500};cursor:${past?'default':'pointer'}">
      ${d}<i style="width:4px;height:4px;border-radius:2px;display:block;background:${has&&!past?(sel?'var(--volt)':'var(--coral)'):'transparent'}"></i></button>`;
  }
  const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">

   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px">${cells}</div>
   <div class="eyebrow" style="margin-bottom:6px">Time of day</div>

     .map(x=>`<span class="${(courts?S.cTod:S.timeOfDay)===x[0]?'on':''}" data-act="${courts?'ctod':'tod'}" data-v="${x[0]}">${x[1]}</span>`).join('')}</div>
   ${(function(){const pd=courts?S.cPickDate:S.pickDate, td=courts?S.cTod:S.timeOfDay;
     return `<div class="tiny" style="margin-bottom:11px">${pd?`${dowl(pd)} ${new Date(pd).getDate()} ${MON[new Date(pd).getMonth()]}${td!=='any'?' · '+td:''}`:'No date picked — the list is showing every day.'}</div>`;})()}

const TABS=[['now','Now','home'],['find','Find','find'],['create','','create'],['you','You','you']]; /* Create restored for the full Walkthrough section; Inbox stays out */
let VIEWKEY=null;
/* The popover is anchored to the mark that opened it, but it must also stay
   inside the phone: the scroll column clips horizontally, and a 250px box
   hung off an icon sitting two thirds of the way across a 362px card would
   lose its right edge. So it is measured and clamped after render, and the
   arrow slides along the top edge to keep pointing at the icon. */
function placeInfoPopover(sc){
  const pop=sc.querySelector('.ipop'); if(!pop) return;
  const btn=pop.parentNode.querySelector('.ibtn'); if(!btn) return;
  const pad=8;
  const box=sc.getBoundingClientRect(), b=btn.getBoundingClientRect();
  const w=Math.min(266, box.width-2*pad);
  pop.style.width=w+'px';
  const cx=b.left+b.width/2;
  let left=cx-w/2;
  left=Math.max(box.left+pad, Math.min(left, box.right-pad-w));
  pop.style.left=(left-b.left)+'px';
  const arrow=pop.querySelector('.ipop-arrow');
  if(arrow) arrow.style.left=Math.max(10, Math.min(w-20, cx-left-5.5))+'px';
}

function render(){
  const t=cur(), fn=(S.ob?V.onboard:(V[t.v]||V.home));
  const sc=document.getElementById('scroll');
  /* Changing a filter, a duration, a day or a court redraws the same screen, so the
     scroll position is kept. Only an actual navigation starts at the top. */
  syncAll();
  const key=[t.v,t.step||'',t.id||'',S.tab,S.findTab].join('|');
  const same=(key===VIEWKEY);
  const y=same?sc.scrollTop:0;
  const xs=same?[].slice.call(sc.querySelectorAll('.sqrow')).map(e=>e.scrollLeft):[];
  VIEWKEY=key;
  CTA=null;
  sc.innerHTML=fn();
  placeInfoPopover(sc);
  if(same) [].slice.call(sc.querySelectorAll('.sqrow')).forEach((e,i)=>{
    if(xs[i]!=null) e.scrollLeft=xs[i];});
  const c=document.getElementById('cta');
  if(CTA){c.className='on';
    c.innerHTML=`<button class="btn ${CTA.kind||'p'} full" style="height:38px" data-go="${CTA.go}" data-id="${CTA.id}">${CTA.label}</button>`+
      (CTA.sub?`<div class="tiny" style="text-align:center;margin-top:7px">${CTA.sub}</div>`:'');}
  else {c.className='';c.innerHTML='';}
  sc.scrollTop=y;
  document.getElementById('tabbar').innerHTML=S.ob?'':TABS.map(x=>
    `<button class="tab ${x[0]==='create'?'fab':''} ${S.tab===x[0]?'on':''}" data-act="tab" data-v="${x[0]}">
      <i></i>${x[1]}</button>`).join('');
  const sw=document.getElementById('sheetwrap');
  if(S.sheet){sw.classList.add('on');document.getElementById('sheetbody').innerHTML=(SH[S.sheet.v]||(()=>''))();}
  else sw.classList.remove('on');
  document.getElementById('clock').textContent=hm(S.now);
  document.getElementById('sbday').textContent=dow(S.now);
  wireStrip();renderTime();renderRail();
}

function wireStrip(){
  const st=document.querySelector('.hstrip'), dots=document.querySelector('.dots');
  if(!st||!dots) return;
  st.addEventListener('scroll',()=>{
    const i=Math.round(st.scrollLeft/(st.firstElementChild.offsetWidth+10));
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
    const cap=document.getElementById('galcap');
    if(cap&&S.gallery){const list=Object.values(S.matches).filter(m=>m.forced);
      const m=list[Math.max(0,Math.min(list.length-1,i))];
      if(m){const st=matchState(m);cap.textContent=st.tag+' — '+st.ctx;}}
  },{passive:true});
}

const STOPS=[['created','Created',()=>T.created],['commit','Commitment',()=>T.commit],
             ['rescue','Rescue opens',()=>T.rescue],['play','Play',()=>T.play]];
function renderTime(){
  const a=T.created-6*HOUR, b=T.play+2*HOUR, span=b-a;
  const pos=(S.now-a)/span*100;
  const m1=S.matches.m1, ph=m1?phase(m1):'—';
  document.getElementById('tnow').textContent=dowl(S.now)+', '+hm(S.now);
  const pe=document.getElementById('tphase');
  pe.textContent=ph;
  pe.style.background=({forming:'var(--muted)',confirmed:'var(--night2)',committed:'var(--coral)',
    rescue:'var(--amber)',played:'var(--mint)',cancelled:'var(--red)'})[ph]||'var(--coral)';
  document.getElementById('track').innerHTML=
    `<div class="rail"></div><div class="fill" style="width:${Math.max(0,Math.min(100,pos))}%"></div>
     ${STOPS.map(s=>{const p=(s[2]()-a)/span*100;
       return `<button class="stop ${S.now>=s[2]()?'done':''}" data-act="jump" data-v="${s[0]}" style="left:${p}%">
         <i></i><u>${s[1]}</u></button>`;}).join('')}

}

function payFor(m,who,amount,label){
  m.seats.find(s=>!s.p).p=who;
  const seat=m.seats.find(s=>s.p===who); seat.paid=true; seat.at=S.now;
}
function joinMatch(m){
  const slot=m.seats.find(s=>!s.p);
  if(!slot){toast('This match is full','bad');return;}
  slot.p='me'; slot.paid=true; slot.at=S.now;
  const amt=payable(m), d=deadlines(m);
  const wasProtected=!!m.courtId;
  syncMatch(m);                                   /* protection and commitment, in one step */
  const nowCommitted = m.committedAt!=null && committedOnFill(m);
  ledgerAdd({label:'BLIK payment',ref:'PAY-'+m.id.toUpperCase()+'-4F',amt:-amt,held:!settledNow(m)});
  ledgerAdd({label:'Service fee',ref:'—',amt:0});
  notify({title:'A new player joined',body:PLAYERS.me.n+' paid their seat. '+filled(m)+' of '+m.n+' now.',
    to:'the others',tone:'var(--line2)'});
  if(!wasProtected && m.courtId)
    notify({title:'Court is now protected',body:'Three paid seats, so a '+m.category+' court is reserved. A private booking can no longer take it.',to:'everyone',tone:'var(--mint-soft)'});
  if(isFull(m))
    notify({title:'The match is full',body:m.n+' of '+m.n+' seats paid.'+(committedNow(m)?'':' Free cancellation until '+hm(d.commit)+'.'),to:'everyone',tone:'var(--mint-soft)'});
  if(nowCommitted)
    notify({title:'Match confirmed on the spot',body:'The deadline had passed, so your payment committed everybody at once.',to:'everyone',tone:'var(--coral-soft)'});
  notify({title:'You joined '+CLUBS[m.club].n,
    body:'Paid '+zl(amt)+'. '+(committedNow(m)?'This match is committed.':'Held until the match is complete and the deadline has passed.'),
    to:'you',tone:'var(--mint-soft)'});
  toast(nowCommitted?'Paid '+zl(amt)+' · match confirmed':'Paid '+zl(amt)+' · seat is yours','ok');
  reset('home');go('match',{id:m.id});
}
function leaveMatch(m){
  const out=leaveOutcome(m), seat=mySeat(m);
  if(!seat) return;
  m.vacated='me'; m.vacatedAt=S.now; m.left=true;
  seat.p=null; seat.paid=out.kind!=='reversal';
  if(out.kind==='reversal'){
    /* not committed: either the deadline has not passed, or the match was never complete */
    S.ledger.filter(l=>l.held).forEach(l=>l.held=false);
    ledgerAdd({label:'Payment reversed',ref:'REV-2291',amt:m.share});
    syncMatch(m);                                  /* the court may fall back below protection */
    notify({title:'Your cancellation has been processed',
      body:'Your complete seat payment is being returned. Wallet money is immediate; a card refund appears once your bank posts it.',
      to:'you',tone:'var(--mint-soft)'});
    toast(zl(m.share)+' reversed — nothing was committed','ok');
    go('resolved',{id:m.id,who:'Nobody needed to',mode:'reversal'});
  } else {
    notify({title:PLAYERS.me.n+' left after the commitment deadline',
      body:'We are looking for a replacement. Your payment will not change.',to:'the others',tone:'var(--coral-soft)'});
    notify({title:'We will search for a replacement',
      body:'Your refund depends on how your seat is filled: 100% at full price, 50% through Rescue, nothing if nobody comes.',
      to:'you',tone:'var(--coral-soft)'});
    toast('Full-price search started');
    go('search',{id:m.id});
  }
}
function fillSeat(m){
  const d=deadlines(m), rescue=S.now>=d.rescue;
  notify({title:'Replacement found',body:'The seat is taken. Nothing about your booking changes.',
    to:'the others',tone:'var(--mint-soft)'});
  const who=rescue?'zofia':'ania';
  const slot=m.seats.find(s=>!s.p); if(slot){slot.p=who;slot.paid=true;slot.at=S.now;}
  const back=rescue?m.share/2:m.share;
  m.rescueTaken=rescue; m.vacated=null;
  ledgerAdd({label:rescue?'Rescue Seat refund · 50%':'Replacement found · full refund',
    ref:'REF-'+(rescue?'1180':'1181'),amt:back,pending:true});
  S.me.credit+=0;
  notify({title:PLAYERS[who].n+' took the seat',body:rescue?'Half price. '+zl(back)+' on its way back to you.':'Full price. All of your '+zl(back)+' comes back.',
    to:'you',tone:'var(--mint-soft)'});
  notify({title:'Match confirmed again',body:'Back to '+m.n+' of '+m.n+'. Nothing to do.',to:'the others',tone:'var(--mint-soft)'});
  toast(PLAYERS[who].n+' took it · '+zl(back)+' back','ok');
  go('resolved',{id:m.id,who:PLAYERS[who].n,mode:rescue?'rescue':'full'});
}

function runScenario(id){
  const sc=SCEN[id]; if(!sc) return;
  S=freshState(); S.matches=seedMatches(); S.scenario=id;
  /* baseline ledger */
  ledgerAdd({label:'BLIK payment',ref:'PAY-9C02-T7',amt:-38,held:true});
  ledgerAdd({label:'Service fee',ref:'—',amt:0});
  ledgerAdd({label:'VAT invoice issued',ref:'FV/2026/08/118',amt:0});
  sc.f();
  document.getElementById('scname').textContent=sc.n;
  const mt=document.getElementById('mtopname'); if(mt) mt.textContent=sc.n;
  document.body.classList.remove('railopen');   /* picking a scenario closes the drawer */
  document.getElementById('scdesc').textContent=sc.d;
  render();
}

/* ---------------- long press ---------------- */
let HOLD=null, HX=0, HY=0, SUPPRESS=false;
function holdStart(e){
  const el=e.target.closest('[data-hold]'); if(!el) return;
  HX=e.clientX; HY=e.clientY; el.classList.add('holding');
  HOLD=setTimeout(()=>{HOLD=null;SUPPRESS=true;el.classList.remove('holding');
    sheet('player',{p:el.dataset.hold,sport:el.dataset.sport||'Padel'});},420);
}
function holdEnd(){if(HOLD){clearTimeout(HOLD);HOLD=null;}
  document.querySelectorAll('.holding').forEach(x=>x.classList.remove('holding'));}
document.addEventListener('pointerdown',holdStart);
document.addEventListener('pointerup',holdEnd);
document.addEventListener('pointercancel',holdEnd);
document.addEventListener('pointerleave',holdEnd);
document.addEventListener('pointermove',e=>{
  if(HOLD&&(Math.abs(e.clientX-HX)>8||Math.abs(e.clientY-HY)>8)) holdEnd();});
document.addEventListener('contextmenu',e=>{
  const el=e.target.closest('[data-hold]');
  if(el){e.preventDefault();holdEnd();sheet('player',{p:el.dataset.hold,sport:el.dataset.sport||'Padel'});}});

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  if(SUPPRESS){SUPPRESS=false;e.stopPropagation();return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){e.stopPropagation();ACT[a.dataset.act](a);return;}
  const g=e.target.closest('[data-go]');
  if(g){e.stopPropagation();
    const v=g.dataset.go;
    if(v==='inbox'){S.tab='msg';reset('inbox');return;}
    go(v,{id:g.dataset.id,step:g.dataset.step?+g.dataset.step:undefined,kind:g.dataset.kind});return;}
  if(e.target.id==='scrim') closeSheet();
  /* an open information popover closes on any tap that is not one of its own
     controls; the two that are have already returned above */
  if(S.ob&&S.ob.info){S.ob.info=null;render();}
});
document.addEventListener('input',e=>{
  const a=e.target.dataset.act;
  if(a==='cprice'||a==='ctravel'){
    if(a==='cprice') S.cPrice=+e.target.value; else S.cTravel=+e.target.value;
    render();
    const el=document.querySelector(`[data-act="${a}"]`); if(el){el.focus();}
    return;
  }
  if(a==='price'||a==='travel'){
    if(a==='price') S.price=+e.target.value; else S.travel=+e.target.value;
    render();
    const el=document.querySelector(`[data-act="${a}"]`); if(el){el.focus();}
    return;
  }
  if(e.target.dataset.act==='scrub'){
    const a=T.created-6*HOUR,b=T.play+2*HOUR;
    S.now=a+(b-a)*(+e.target.value/1000);
    const t=cur();
    document.getElementById('scroll').innerHTML=(V[t.v]||V.home)();
    document.getElementById('clock').textContent=hm(S.now);
    document.getElementById('sbday').textContent=dow(S.now);
    const m1=S.matches.m1,ph=m1?phase(m1):'—';
    const pe=document.getElementById('tphase');pe.textContent=ph;
    pe.style.background=({forming:'var(--muted)',confirmed:'var(--night2)',committed:'var(--coral)',
      rescue:'var(--amber)',played:'var(--mint)',cancelled:'var(--red)'})[ph]||'var(--coral)';
    document.getElementById('tnow').textContent=dowl(S.now)+', '+hm(S.now);
    const fill=document.querySelector('#track .fill');
    if(fill) fill.style.width=((S.now-a)/(b-a)*100)+'%';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.sheet)closeSheet();else back();}
});

/* ==================================================================
   RACKETSKILL FUSION v3 — the initial rating engine
   ------------------------------------------------------------------
   Built to 2_racketskill_fusion_v3_refined_skill_rating_model.md and
   replacing the v2 engine outright. The statistical core survives
   (group by class, fuse within, add irreducible bias and dispersion,
   fuse across, then contradiction and layoff, then the confidence
   policy). Everything the player touches is new: four question
   categories instead of a self-description ladder, execution
   questions that carry a difficulty, a tie-breaker instead of a
   verdict, and an evidence surface cut back to what a recreational
   marketplace can actually supply.
   ================================================================== */

/* ==================================================================
   RACKETSKILL FUSION v3 — initial rating engine
   Built to 2_racketskill_fusion_v3_refined_skill_rating_model.md.
   Replaces the v22 engine completely.

   What v3 changes, and where it is written down:

     §6.1  evidence surface cut to four sources: questionnaire,
           Tennis<->Padel transfer, same-sport format link, weak prior.
           Federation ratings, coach and club assessments, imported
           results and the all-sport transfer matrix are REMOVED.
     §7    years played, age, gender, goal and broad self-classification
           ("beginner / intermediate / advanced") are REMOVED.
     §8    the questionnaire becomes four categories plus one
           conditional module.
     §12.3 execution questions carry a DIFFICULTY, and the same answer
           means a different level depending on which tier was asked.
     §19.4 a contradiction now triggers ONE tie-breaker question, and
           resolution is symmetric — broad claims lose precision in
           whichever direction they disagree.
     §23.1 confidence ceilings: 30 / 35 / 42%.
     §24.3 transfer restricted to Tennis->Padel 0,55 and Padel->Tennis 0,45.
     §26   calibration is adaptive (~3-5), not a fixed first five.
     §27   bootstrap calibration, so a marketplace with no anchors can
           still stabilise its own players.
     §42   states are Initial Estimate -> Calibrating -> Stable.
     §44   every answer, routing decision and derived feature is logged
           in the shapes a future model will need.

   §20 is explicit that the v2 statistical core stays: group by class,
   fuse within, apply irreducible bias and dispersion, fuse across
   classes, then contradiction and layoff, then the confidence policy.
   ================================================================== */

   Built to 2_racketskill_fusion_v3_refined_skill_rating_model.md.
   Replaces the v22 engine completely.

   What v3 changes, and where it is written down:

     §6.1  evidence surface cut to four sources: questionnaire,
           Tennis<->Padel transfer, same-sport format link, weak prior.
           Federation ratings, coach and club assessments, imported
           results and the all-sport transfer matrix are REMOVED.
     §7    years played, age, gender, goal and broad self-classification
           ("beginner / intermediate / advanced") are REMOVED.
     §8    the questionnaire becomes four categories plus one
           conditional module.
     §12.3 execution questions carry a DIFFICULTY, and the same answer
           means a different level depending on which tier was asked.
     §19.4 a contradiction now triggers ONE tie-breaker question, and
           resolution is symmetric — broad claims lose precision in
           whichever direction they disagree.
     §23.1 confidence ceilings: 30 / 35 / 42%.
     §24.3 transfer restricted to Tennis->Padel 0,55 and Padel->Tennis 0,45.
     §26   calibration is adaptive (~3-5), not a fixed first five.
     §27   bootstrap calibration, so a marketplace with no anchors can
           still stabilise its own players.
     §42   states are Initial Estimate -> Calibrating -> Stable.
     §44   every answer, routing decision and derived feature is logged
           in the shapes a future model will need.

   §20 is explicit that the v2 statistical core stays: group by class,
   fuse within, apply irreducible bias and dispersion, fuse across
   classes, then contradiction and layoff, then the confidence policy.
   ================================================================== */

const ENGINE_VERSION = 'rsf-v3.0.0';
const QUESTIONNAIRE_VERSION = 'q-v3.0.0';
const TRANSFER_VERSION = 'tau-v3.0.0';
const PRIOR_VERSION = 'prior-v3.0.0';
const FEATURE_VERSION = 'feat-v3.0.0';

const r2 = v => Math.round(v * 100) / 100;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ------------------------------------------------------------------
   §4 · the scale. 1,00-5,00, public and internal, one scale only.
   5,0 is the top of the amateur marketplace, not "professional".
   ------------------------------------------------------------------ */
const SCALE_MIN = 1.0, SCALE_MAX = 5.0;
const BANDS = [
  { key: 'new',         lo: 1.0, hi: 1.5, name: 'New',
    meaning: 'New or nearly new. Learning reliable contact, movement, rules, basic rallying and positioning.' },
  { key: 'developing',  lo: 1.6, hi: 2.6, name: 'Developing',
    meaning: 'Plays real matches and sustains basic patterns, but execution, movement and positioning are still inconsistent.' },
  { key: 'established', lo: 2.7, hi: 3.8, name: 'Established',
    meaning: 'Reliable recreational or club player. Fundamentals hold under match pressure and tactical understanding is meaningful.' },
  { key: 'advanced',    lo: 3.9, hi: 5.0, name: 'Advanced',
    meaning: 'Strong amateur. Consistent technique, tactical adaptation, pressure tolerance and advanced sport-specific execution.' }
];
const bandOf = mu => BANDS.filter(b => mu >= b.lo - 0.05).pop() || BANDS[0];

/* §52 · sport configuration registry.

   MVP scope decision: ONE rating per sport. The document keeps singles
   and doubles separate (§25) and the machinery for it is intact below —
   formatLinkEvidence, the formatLink evidence class and its 42% ceiling
   all still work. It is simply not switched on, because asking a tennis
   player two full questionnaires to produce two numbers nobody can yet
   act on doubles the cost of signup for no product benefit. The day
   tennis doubles becomes a distinct thing to match on, adding
   'Doubles' to the array below turns it back on and the second pass
   starts seeded from the first rather than from nothing. */
const SPORT_FORMATS = {
  Padel:     ['Doubles'],
  Tennis:    ['Singles'],
  Squash:    ['Singles'],
  Badminton: ['Doubles']
};
/* whether the player is ever shown the format alongside the sport */
const SHOWS_FORMAT = sport => (SPORT_FORMATS[sport] || []).length > 1;

/* ------------------------------------------------------------------
   Confidence. Unchanged definition, new ceilings (§23.1).
   ------------------------------------------------------------------ */
const SIGMA_MAX = 1.20;
const conf  = s => clamp(Math.round(100 * (1 - s / SIGMA_MAX)), 0, 99);
const sigOf = c => r2(SIGMA_MAX * (1 - c / 100));

const CAPS = {
  questionnaire:   30,   /* questionnaire only — the MVP path              */
  formatLink:      42    /* + the same sport's other format, already rated */
};
const capFloor = classes => sigOf(Math.max(...(classes || []).map(c => CAPS[c] || 0), 0));

/* §22 · irreducible bias per evidence class, and dispersion */
const BIAS = {
  questionnaire:   0.75,
  formatLink:      0.30
};
const DISPERSION_LAMBDA = 0.70;

/* §21 · a weak, broad population prior. Its only job is to stop one
   extreme answer deciding the rating. Deliberately too wide to drag
   thin evidence toward the middle. */
const PRIOR = { mu: 2.60, sigma: 2.60 };

/* §9.4 + §35.1 · layoff widens sigma and never touches mu */
const LAYOFF = {
  active:   { label: 'I am playing regularly right now', add: 0.00 },
  under3:   { label: 'Less than 3 months ago',           add: 0.00 },
  m3to6:    { label: '3 to 6 months ago',                add: 0.08 },
  m6to12:   { label: '6 to 12 months ago',               add: 0.16 },
  y1to2:    { label: '1 to 2 years ago',                 add: 0.28 },
  over2:    { label: 'More than 2 years ago',            add: 0.45, returnCalibration: true }
};

/* §24 · CROSS-SPORT TRANSFER IS REMOVED FROM MVP.

   Not deferred on grounds of effort — removed because as specified it was
   directionally wrong for most of the people it applied to.

   The transfer estimate is mu = 1 + tau x (source - 1), and tau shrinks the
   source level toward the BOTTOM of the scale to account for the padel-
   specific skills a tennis player is missing. With tau 0,55 that caps the
   transferred estimate at 2,71 even for "strong competitive amateur". So
   any padel player whose own answers put them above 2,71 was pulled DOWN by
   declaring strong tennis:

       same padel answers, no tennis declared        3,53  Established
       ... plus "strong competitive amateur" tennis  3,11  Established
       ... plus "solid club player" tennis           2,82  Established
       ... plus "I play socially" tennis             2,56  Developing

   Every available answer lowered the rating. The cause is double counting:
   tau shrinks for missing padel skills, but a player who has already told
   us they play most weeks in competitive club matches has ALREADY reported
   those padel skills. The transfer then subtracts them a second time.

   The fix, when it returns, is decay by same-sport evidence (§24.4): weight
   the transfer down as questionnaire demonstrations accumulate, so it does
   the work only where it is genuinely the best information available — a
   complete beginner in one sport who plays the other. That is one branch,
   and it costs a question, an evidence class, a confidence tier and a whole
   explanatory screen to serve. Out for v1.

   Consequence to accept: a complete beginner at padel who plays competitive
   tennis now starts at 1,40 New rather than 2,17 Developing, and will be
   matched as a beginner. Calibration corrects that in three to five matches
   and volatility accelerates it, but the first match will be lopsided. */

/* §25 · same-sport format link */
const FORMAT_TAU = 0.72;
const FORMAT_SIGMA = 0.45;

/* ==================================================================
   §53 + §52 · the question bank.
   Every question carries the fields §44.1 asks for, so a response can
   always be re-read against the exact question that produced it.
   ================================================================== */
const SCALE_5 = ['Almost never', 'Occasionally', 'About half the time', 'Usually', 'Consistently'];

/* §12.3 · adaptive difficulty. The same word means a different level
   depending on which tier was asked, which is the entire point of
   asking a harder question of a stronger player. */
const EXEC_ANCHORS = {
  basic: [1.20, 1.70, 2.15, 2.55, 2.90],
  mid:   [1.75, 2.30, 2.80, 3.25, 3.65],
  adv:   [2.40, 2.95, 3.45, 3.95, 4.45]
};
const EXEC_SIGMA = 0.80;                 /* strongest questionnaire evidence, §12.1 */
const TACTIC_ANCHORS = [1.90, 2.45, 2.95, 3.45, 3.90];
const TACTIC_SIGMA = 0.85;

function Q(o) { return Object.assign({ version: QUESTIONNAIRE_VERSION, active: true, answerScale: SCALE_5 }, o); }

/* ---- category 1 · recent activity and exposure (§9) ---- */
const Q_REGULARITY = Q({
  id: 'act.regularity', category: 'activity', kind: 'claim', dimension: 'recentExposure',
  text: 'How often do you play?',
  answerScale: ['I have never played', 'I have tried it a few times', 'Now and then',
                'Most weeks', 'Several times a week'],
  /* "never" is not an absent answer, it is the most informative one in the
     bank. It used to carry no anchor, which left the fast path relying on a
     technique question a first-timer cannot meaningfully answer. */
  anchors: [1.20, 1.45, 2.30, 2.95, 3.25],
  /* the more somebody plays, the less their frequency alone tells us about
     their level, so the band widens as the answers go up */
  sigmas:  [0.75, 0.85, 1.05, 1.15, 1.20]
});
const Q_VOLUME = Q({
  id: 'act.volume', category: 'activity', kind: 'claim', dimension: 'recentVolume',
  situation: 'In the last 8 weeks',
  text: 'How many matches have you played?',
  answerScale: ['None', '1 or 2', '3 to 5', '6 to 10', 'More than 10'],
  anchors: [1.95, 2.35, 2.75, 3.05, 3.25],
  sigmas:  [1.20, 1.15, 1.10, 1.15, 1.20]
});
const Q_LAYOFF = Q({
  id: 'act.layoff', category: 'activity', kind: 'meta', dimension: 'layoff',
  situation: 'You have played before',
  text: 'When did you last play regularly?',
  answerScale: Object.keys(LAYOFF).map(k => LAYOFF[k].label),
  layoffKeys: Object.keys(LAYOFF)
});

/* ---- category 2 · competitive context (§11) ---- */
const Q_ENVIRONMENT = Q({
  id: 'ctx.environment', category: 'context', kind: 'claim', dimension: 'matchEnvironment',
  text: 'What kind of matches do you normally play?',
  answerScale: ['I am still learning to play full matches',
                'Casual matches with friends',
                'Regular matches against different people',
                'Club matches where the result counts',
                'Local competitions, or strong club matches'],
  anchors: [1.55, 2.25, 2.85, 3.45, 4.05],
  sigmas:  [0.95, 1.00, 0.95, 0.90, 0.95]
});
/* §11.3 · relative performance is relative to opponents we cannot see,
   so it is encoded as an OFFSET on the environment answer rather than
   as a level of its own, and it carries the widest band in the bank. */
const Q_RELATIVE = Q({
  id: 'ctx.relative', category: 'context', kind: 'claim', dimension: 'relativeResult',
  situation: 'Against the people you usually play',
  text: 'How do the matches normally go?',
  answerScale: ['I struggle to keep it close', 'I lose more than I win',
                'It is usually balanced', 'I win more than I lose',
                'I need stronger opponents'],
  offsets: [-0.55, -0.25, 0.00, 0.25, 0.50],
  sigma: 1.20, relative: true
});


/* ---- categories 3 and 4 · execution and tactical, per sport (§13-§17) ----
   The basic/intermediate/advanced wordings come from the model document
   itself; the second question in each tier is written to match. */
/* Every question is a short SITUATION plus a short QUESTION, rather than
   one long sentence. A player reading "When an opponent's lob forces you
   away from the net, how reliably can you play a controlled overhead and
   recover your team's position rather than forcing a winner?" has to hold
   four clauses in their head before they can even start answering, and a
   question that costs mental effort to parse gets answered carelessly.

   Vocabulary is matched to the tier, which is matched to the estimate.
   Basic questions use words anybody would use. Discriminating questions
   are allowed sport-specific terms — the T, base, length, double wall —
   because by the time somebody is asked one, they demonstrably know them.
   The core meaning of every question is unchanged. */
const BANK = {
  Padel: {
    exec: {
      basic: [
        { situation: 'The ball comes off the back wall', text: 'How often can you get it back and keep the rally going?' },
        { situation: 'A slow ball at waist height', text: 'How often do you hit it cleanly and keep the point alive?' }],
      mid: [
        { situation: 'You are at the net', text: 'How often does your volley go where you aimed, not just back?' },
        { situation: 'You lob', text: 'How often does it land deep enough to push them off the net?' }],
      adv: [
        { situation: 'A deep lob pushes you off the net', text: 'How often do you play a controlled overhead and recover position, instead of going for a winner?' },
        { situation: 'A double-wall ball', text: 'How often do you read the second bounce and still play it under control?' }]
    },
    tactic: [
      { situation: 'Your team is stuck at the back', text: 'How often do you lob or reset to win the net back, rather than attack from there?' },
      { situation: 'Your partner is pulled wide', text: 'How often do you cover the middle instead of holding your own side?' }]
  },
  Tennis: {
    exec: {
      basic: [
        { situation: 'A normal rally', text: 'How often do you keep the ball in play for several shots without missing?' },
        { situation: 'A medium-paced ball at a comfortable height', text: 'How often do you hit it cleanly and land it in?' }],
      mid: [
        { situation: 'Second serve, under pressure', text: 'How often do you start the point without a double fault or an easy ball?' },
        { situation: 'A short ball, and you come forward', text: 'How often do you finish the point instead of giving it back?' }],
      adv: [
        { situation: 'Neutral from the baseline', text: 'How often can you change direction or add pace without losing control of the rally?' },
        { situation: 'Heavy topspin to your backhand', text: 'How often do you hold your depth instead of floating it short?' }]
    },
    tactic: [
      { situation: 'Pulled wide, defending', text: 'How often do you play a safe recovery ball before attacking again?' },
      { situation: '30-30 or deuce', text: 'How often do you play the pattern you planned, not the first shot available?' }]
  },
  Squash: {
    exec: {
      basic: [
        { situation: 'A straight drive', text: 'How often does it go deep enough to move your opponent behind you?' },
        { situation: 'A loose ball in the middle', text: 'How often do you hit it cleanly and keep the rally going?' }],
      mid: [
        { situation: 'You have played into a back corner', text: 'How often do you get back to the T before they hit?' },
        { situation: 'Your straight drive', text: 'How often does it stay tight enough to stop an easy volley?' }],
      adv: [
        { situation: 'Under pressure in a back corner', text: 'How often do you still find enough length to stop an attack?' },
        { situation: 'The ball is drifting through', text: 'How often do you volley early to cut out their length, rather than let it drop?' }]
    },
    tactic: [
      { situation: 'They have played a good length', text: 'How often do you recover position instead of going for a low-percentage winner?' },
      { situation: 'You are on top in the rally', text: 'How often do you keep it tight instead of going short too early?' }]
  },
  Badminton: {
    exec: {
      basic: [
        { situation: 'From the back court', text: 'How often does your clear go deep enough to reset the rally?' },
        { situation: 'A shuttle at a comfortable height near the net', text: 'How often do you hit it cleanly and keep the rally going?' }],
      mid: [
        { situation: 'You have played a shot from a corner', text: 'How often do you get back to a good base position?' },
        { situation: 'A shuttle at net height', text: 'How often do you intercept it instead of lifting?' }],
      adv: [
        { situation: 'Your pair switches from attack to defence', text: 'How often do you move into side-by-side defence without hesitating?' },
        { situation: 'You are behind the shuttle', text: 'How often does your smash stay steep instead of going flat?' }]
    },
    tactic: [
      { situation: 'Your pair lifts the shuttle', text: 'How often do both of you drop into side-by-side defence?' },
      { situation: 'You are out of position', text: 'How often do you play a high, deep reset rather than go for a winner?' }]
  }
};
/* the doubles-shaped wordings do not make sense in a singles assessment */
const SINGLES_SUBS = {
  Badminton: {
    adv0:    { situation: 'Forced deep into a rear corner', text: 'How often do you still recover to base before the next shot?' },
    tactic0: { situation: 'You are pulled to the net', text: 'How often do you lift high and deep rather than try a risky net shot?' }
  }
};

function execQuestion(sport, tier, idx, format) {
  const list = ((BANK[sport] || {}).exec || {})[tier] || [];
  const i = idx % Math.max(1, list.length);
  let q = list[i];
  if (format === 'Singles' && SINGLES_SUBS[sport] && SINGLES_SUBS[sport][tier + i]) q = SINGLES_SUBS[sport][tier + i];
  return Q({ id: 'exec.' + sport.toLowerCase() + '.' + tier + '.' + i, category: 'execution',
             kind: 'demo', dimension: 'execution:' + tier, difficulty: tier,
             situation: q.situation, text: q.text,
             anchors: EXEC_ANCHORS[tier], sigma: EXEC_SIGMA });
}
function tacticQuestion(sport, idx, format) {
  const list = (BANK[sport] || {}).tactic || [];
  const i = idx % Math.max(1, list.length);
  let q = list[i];
  if (format === 'Singles' && SINGLES_SUBS[sport] && SINGLES_SUBS[sport]['tactic' + i]) q = SINGLES_SUBS[sport]['tactic' + i];
  return Q({ id: 'tactic.' + sport.toLowerCase() + '.' + i, category: 'tactical', kind: 'demo',
             dimension: 'tactical', situation: q.situation, text: q.text,
             anchors: TACTIC_ANCHORS, sigma: TACTIC_SIGMA });
}

/* ==================================================================
   §54 · evidence encoder — one answer becomes one structured item
   ================================================================== */
function encode(q, optionId, ctx) {
  if (q.kind === 'meta') return null;
  if (q.relative) {
    const base = (ctx && ctx.environmentMu != null) ? ctx.environmentMu : PRIOR.mu;
    return { mu: clamp(base + q.offsets[optionId], SCALE_MIN, SCALE_MAX), sigma: q.sigma,
             cls: 'questionnaire', kind: q.kind, questionId: q.id, questionVersion: q.version,
             dimension: q.dimension, category: q.category, label: 'Results against your usual group' };
  }
  const mu = q.anchors ? q.anchors[optionId] : null;
  if (mu == null) return null;
  return { mu: mu, sigma: q.sigma != null ? q.sigma : q.sigmas[optionId],
           cls: 'questionnaire', kind: q.kind, questionId: q.id, questionVersion: q.version,
           dimension: q.dimension, category: q.category, difficulty: q.difficulty || null,
           label: LABELS[q.category] || q.category };
}
const LABELS = { activity: 'Recent activity', context: 'Competitive context',
                 execution: 'Match execution', tactical: 'Tactical execution',
                 formatLink: 'Your other format' };

function formatLinkEvidence(fromFormat, toFormat, mu, sigma) {
  if (!fromFormat || fromFormat === toFormat) return null;
  return { mu: clamp(1 + FORMAT_TAU * (mu - 1), SCALE_MIN, SCALE_MAX),
           sigma: Math.sqrt(FORMAT_SIGMA * FORMAT_SIGMA + (FORMAT_TAU * (sigma || 0.4)) * (FORMAT_TAU * (sigma || 0.4))),
           cls: 'formatLink', kind: 'claim', questionId: 'link.format', questionVersion: TRANSFER_VERSION,
           dimension: 'formatLink', category: 'formatLink', label: fromFormat + ' \u2192 ' + toFormat };
}

/* ==================================================================
   §20 · the statistical core, kept from v2
   ================================================================== */
function fuseFlat(items) {
  const use = (items || []).filter(Boolean);
  if (!use.length) return { mu: PRIOR.mu, sigma: SIGMA_MAX, wsum: 0 };
  let wsum = 0, msum = 0;
  use.forEach(e => { const p = (e.weight != null ? e.weight : 1) / (e.sigma * e.sigma); wsum += p; msum += p * e.mu; });
  return { mu: msum / wsum, sigma: Math.sqrt(1 / wsum), wsum: wsum };
}
function dispersionOf(items, mu) {
  let wsum = 0, acc = 0;
  items.forEach(e => { const p = (e.weight != null ? e.weight : 1) / (e.sigma * e.sigma);
                       wsum += p; acc += p * (e.mu - mu) * (e.mu - mu); });
  return wsum ? Math.sqrt(acc / wsum) : 0;
}
function fuseGroup(cls, items) {
  const f = fuseFlat(items), d = dispersionOf(items, f.mu), b = BIAS[cls] || 0;
  return { cls: cls, mu: f.mu, n: items.length, within: f.sigma, dispersion: d,
           sigma: Math.sqrt(f.sigma * f.sigma + b * b + (DISPERSION_LAMBDA * d) * (DISPERSION_LAMBDA * d)) };
}
function fuseAll(items) {
  const by = {};
  (items || []).filter(Boolean).forEach(e => { (by[e.cls] = by[e.cls] || []).push(e); });
  const groups = Object.keys(by).map(c => fuseGroup(c, by[c]));
  const withPrior = groups.concat([{ cls: 'populationPrior', mu: PRIOR.mu, sigma: PRIOR.sigma,
                                     within: PRIOR.sigma, dispersion: 0, n: 1 }]);
  const f = fuseFlat(withPrior);
  return { mu: f.mu, sigma: f.sigma, groups: groups };
}

/* ==================================================================
   §19 + §55 · consistency / contradiction engine
   ================================================================== */
const CONTRA_GAP = 1.30;      /* between claim-group and demo-group means */
const CONTRA_GAMMA = 0.45;    /* how hard an unresolved conflict widens sigma */
const CLAIM_PENALTY = 0.40;   /* precision kept by broad claims when unresolved */

function detectContradiction(items) {
  const claims = items.filter(e => e.kind === 'claim');
  const demos  = items.filter(e => e.kind === 'demo');
  if (!claims.length || !demos.length) return null;
  const c = fuseFlat(claims), d = fuseFlat(demos);
  const gap = c.mu - d.mu;
  if (Math.abs(gap) <= CONTRA_GAP) return null;
  return { gap: r2(Math.abs(gap)), signedGap: r2(gap), claimMu: r2(c.mu), demoMu: r2(d.mu),
           direction: gap > 0 ? 'claimsHigher' : 'claimsLower' };
}

/* §19.4 step 2 · the tie-breaker. One discriminating execution question,
   pitched at the level the CLAIMS imply. If the player can do the thing
   their claims imply, the claims were right; if not, they were not.
   Either way the engine learns which side to trust, and only if it
   still cannot tell does it fall through to widening. */
function tieBreakerTier(claimMu) {
  return claimMu >= 3.15 ? 'adv' : claimMu >= 2.45 ? 'mid' : 'basic';
}

/* ==================================================================
   §18 + §53 · adaptive questionnaire engine
   ================================================================== */
const MAX_Q = 9, MAX_Q_NORMAL = 8;
const MIN_EXEC = 2, MIN_TACTIC = 1;
const MIN_GAIN = 0.020;
const BEGINNER_MAX_Q = 4;

function ctxOf(a) {
  const env = a.responses.filter(r => r.questionId === 'ctx.environment')[0];
  return { environmentMu: env ? Q_ENVIRONMENT.anchors[env.optionId] : null };
}

function itemsOf(a) {
  const out = [];
  a.responses.forEach(r => {
    const q = a.bank[r.questionId];
    if (!q) return;
    const e = encode(q, r.optionId, ctxOf(a));
    if (e) out.push(e);
  });
  if (a.formatLink) out.push(a.formatLink);
  return out;
}

function classesOf(a) {
  const c = ['questionnaire'];
  if (a.formatLink) c.push('formatLink');
  return c;
}

const has = (a, id) => Object.prototype.hasOwnProperty.call(a.answered, id);

function countCategory(a, cat) {
  return a.responses.filter(r => (a.bank[r.questionId] || {}).category === cat).length;
}

/* the live estimate, used by the router and by the result screen */
function estimate(a) {
  let items = itemsOf(a);
  const contra = a.contradictionResolved === false ? a.contradiction : detectContradiction(items);
  if (a.contradictionResolved === false && contra) {
    /* §19.4.3 · symmetric: broad claims lose precision in whichever
       direction they disagreed. This is not a downward correction. */
    items = items.map(e => (e.kind === 'claim' && (e.category === 'activity' || e.category === 'context'))
      ? Object.assign({}, e, { weight: CLAIM_PENALTY }) : e);
  }
  const f = fuseAll(items);
  let sigma = f.sigma;
  if (a.contradictionResolved === false && contra) sigma = Math.sqrt(sigma * sigma + Math.pow(CONTRA_GAMMA * contra.gap, 2));
  const lay = a.layoff ? (LAYOFF[a.layoff] || {}).add || 0 : 0;
  if (lay) sigma = Math.sqrt(sigma * sigma + lay * lay);
  const rawSigma = Math.min(SIGMA_MAX, sigma);
  const floor = capFloor(classesOf(a));
  return { mu: clamp(f.mu, SCALE_MIN, SCALE_MAX), sigma: Math.min(SIGMA_MAX, Math.max(rawSigma, floor)),
           rawSigma: rawSigma, floor: floor, groups: f.groups, items: items,
           contradiction: contra, layoffAdd: lay };
}

/* projected sigma if the best available next question agreed exactly */
function projectedSigma(a, sigmaItem) {
  const probe = { mu: estimate(a).mu, sigma: sigmaItem, cls: 'questionnaire', kind: 'demo' };
  const f = fuseAll(itemsOf(a).concat([probe]));
  const lay = a.layoff ? (LAYOFF[a.layoff] || {}).add || 0 : 0;
  const s = lay ? Math.sqrt(f.sigma * f.sigma + lay * lay) : f.sigma;
  return Math.max(Math.min(SIGMA_MAX, s), capFloor(classesOf(a)));
}

/* §53 · pick the next question, or return null to stop.
   Also emits the §44.4 routing_event, because a future model has to
   know WHY a question was never asked. */
function nextQuestion(a) {
  const asked = a.responses.length;
  const est = estimate(a);
  const log = (qid, reason, cands, gain) => {
    a.routing.push({ assessmentId: a.assessmentId, step: asked + 1,
      currentMu: r2(est.mu), currentSigma: r2(est.sigma),
      candidateQuestionIds: cands, selectedQuestionId: qid, selectionReason: reason,
      projectedInformationGain: gain != null ? r2(gain) : null, timestamp: a.clock ? a.clock() : 0 });
  };
  const put = (q, reason, cands, gain) => { a.bank[q.id] = q; log(q.id, reason, cands || [q.id], gain); return q; };

  /* 1 · the opening question is always recent regularity (§9.3) */
  if (!a.responses.length) return put(Q_REGULARITY, 'opening question, every assessment starts here');

  /* 2 · §10 · beginner fast path, enforced here rather than by the UI.

     A player who has never held a padel racket cannot answer "how often
     do you get the ball back off the wall". Whatever they tap is not a
     report, it is a guess about a thing they have never done, and it
     enters the fusion looking exactly like evidence. So the fast path
     asks nothing about technique at all. "I have never played" is now
     itself the evidence — it is the single most informative answer in
     the bank — and the only branch still worth exploring is whether
     they play the one sport that transfers.

     That leaves: never played + plays the partner sport -> 3 questions.
     Never played + does not -> 2. Squash and badminton, which have no
     transfer partner -> 1. Below §10's "3 to 4", and deliberately: the
     honest answer to a first-timer is that we already know everything
     self-report can tell us, and their first match will tell us more
     than five more taps ever could. */
  if (a.beginner) {
    log(null, 'stopped: a first-timer has no technique to report on, and nothing else self-report can add', [], 0);
    return null;
  }

  /* 3 · recent volume, then layoff — only down the ambiguous branch (§9.2, §9.4) */
  if (a.needsVolume && !has(a, 'act.volume'))
    return put(Q_VOLUME, '"occasionally" is ambiguous, so recent match volume is the highest-value follow-up');
  if (!has(a, 'act.layoff') && a.needsLayoff)
    return put(Q_LAYOFF, 'recent volume is low but the player has played before, so time away is the open question');

  /* 4 · one competitive-context question before any execution question */
  if (countCategory(a, 'context') < 1)
    return put(Q_ENVIRONMENT, 'competitive context not yet covered');

  /* 5 · §18.4 · minimum demonstration. Broad claims alone never finish.

     The requirement scales with the estimate. Two answers are enough to
     separate a New player from a Developing one, because the bands down
     there are narrow and the basic questions are decisive. Established
     spans 2,7 to 3,8 and Advanced runs to 5,0 — a whole level of range
     each — and two answers cannot place somebody inside that. So a player
     whose estimate has climbed into Established or above is asked a third
     demonstration before the marginal-value rule is even consulted. */
  const execCount = countCategory(a, 'execution');
  const needExec = est.mu >= 2.65 ? MIN_EXEC + 1 : MIN_EXEC;
  if (execCount < needExec) {
    const tier = tierFor(est.mu);
    return put(execQuestion(a.sport, tier, execCount, a.format),
      'execution evidence below the ' + needExec + ' this estimate needs; tier ' + tier + ' chosen for it',
      ['exec.basic', 'exec.mid', 'exec.adv']);
  }

  /* 6 · §19.4 · the tie-breaker, asked once, before anything else */
  if (est.contradiction && !a.tieBreakerAsked) {
    const tier = tieBreakerTier(est.contradiction.claimMu);
    a.tieBreakerAsked = true;
    a.tieBreakerTier = tier;
    return put(execQuestion(a.sport, tier, 1, a.format),
      'claims and demonstrations disagree by ' + est.contradiction.gap + '; one discriminating question at the level the claims imply',
      ['exec.' + tier], null);
  }

  if (countCategory(a, 'tactical') < MIN_TACTIC)
    return put(tacticQuestion(a.sport, 0, a.format), 'tactical execution not yet observed');

  /* 8 · §18.5 · marginal information value.
     Two different things can still be unknown, and only one of them is
     sigma. When a player answers at the very end of the scale we have
     not BRACKETED them: "consistently" on the hardest question we have
     tells us they are at least that good and nothing about how much
     more. Confidence is already pinned at its ceiling, so a sigma-only
     rule would stop here — which is exactly why the document expects an
     advanced player to answer more questions than a developing one,
     not fewer. */
  if (asked >= (est.contradiction ? MAX_Q : MAX_Q_NORMAL)) return null;
  const lastDemo = a.responses.filter(r => r.kind === 'demo').slice(-1)[0];
  const extreme = lastDemo && (lastDemo.optionId === 0 || lastDemo.optionId === 4);
  if (extreme && countCategory(a, 'execution') < 4) {
    const tier = tierFor(est.mu);
    return put(execQuestion(a.sport, tier, countCategory(a, 'execution'), a.format),
      'the last answer sat at the end of the scale, so the level is not yet bracketed; asking a ' + tier + ' question',
      ['exec.' + tier], null);
  }
  const cands = [];
  if (countCategory(a, 'execution') < 4) cands.push({ q: () => execQuestion(a.sport, tierFor(est.mu), countCategory(a, 'execution'), a.format), s: EXEC_SIGMA, id: 'execution' });
  if (countCategory(a, 'tactical') < 2)  cands.push({ q: () => tacticQuestion(a.sport, 1, a.format), s: TACTIC_SIGMA, id: 'tactical' });
  if (!has(a, 'act.volume'))         cands.push({ q: () => Q_VOLUME, s: 1.00, id: 'activity' });
  if (!has(a, 'ctx.relative'))       cands.push({ q: () => Q_RELATIVE, s: Q_RELATIVE.sigma, id: 'context' });
  if (!cands.length) return null;

  let best = null;
  cands.forEach(c => { const g = est.sigma - projectedSigma(a, c.s); if (!best || g > best.g) best = { c: c, g: g }; });
  if (!best || best.g < MIN_GAIN) { log(null, 'stopped: best remaining question would move the band by only ' +
      r2(best ? best.g : 0) + ', under the ' + MIN_GAIN + ' threshold', cands.map(c => c.id), best ? best.g : 0); return null; }
  return put(best.c.q(), 'highest projected information gain of ' + cands.length + ' candidates', cands.map(c => c.id), best.g);
}
const tierFor = mu => mu < 2.45 ? 'basic' : mu < 3.15 ? 'mid' : 'adv';


/* ==================================================================
   §44 · the assessment object. Every field a future model needs is
   recorded as it happens, not reconstructed afterwards.
   ================================================================== */
let _seq = 0;
function createAssessment(o) {
  o = o || {};
  return {
    assessmentId: o.assessmentId || ('as_' + (++_seq)),
    playerId: o.playerId || 'me',
    sport: o.sport, format: o.format,
    questionnaireVersion: QUESTIONNAIRE_VERSION, engineVersion: ENGINE_VERSION,
    startedAt: o.now || 0, completedAt: null,
    responses: [], routing: [], bank: {}, answered: {},
    beginner: false, hasHistory: false, needsVolume: false, needsLayoff: false, layoff: null,
    crossSportEvidence: null,   /* reserved: transfer returns with evidence decay */
    formatLink: o.formatLink || null, formatLinkSource: o.formatLinkSource || null,
    tieBreakerAsked: false, tieBreakerTier: null,
    contradiction: null, contradictionResolved: null,
    clock: o.clock || (() => 0)
  };
}

function recordAnswer(a, questionId, optionId) {
  const q = a.bank[questionId];
  if (!q) throw new Error('unknown question ' + questionId);
  a.responses.push({ assessmentId: a.assessmentId, questionId: questionId, questionVersion: q.version,
                     optionId: optionId, ordinalValue: q.answerScale.length > 1 ? optionId / (q.answerScale.length - 1) : 0,
                     askedOrder: a.responses.length + 1, answeredAt: a.clock(),
                     category: q.category, kind: q.kind, difficulty: q.difficulty || null });
  a.answered[questionId] = optionId;

  if (questionId === 'act.regularity') {
    a.beginner = optionId === 0;                                  /* §10, decided in the engine */
    a.hasHistory = optionId >= 2;
    a.needsVolume = optionId === 2;      /* "I play occasionally" is the ambiguous answer:
                                            it can mean winding down, or ramping up */
  }
  if (questionId === 'act.volume') a.needsLayoff = a.hasHistory && optionId <= 1;
  if (questionId === 'act.layoff') a.layoff = q.layoffKeys[optionId];
  /* the tie-breaker verdict (§19.4) */
  if (a.tieBreakerAsked && a.contradictionResolved === null && q.category === 'execution' && a.responses.length > 2) {
    const c = detectContradiction(itemsOf(a));
    a.contradiction = c;
    a.contradictionResolved = !c;                    /* still disagreeing -> unresolved */
  }
  return a;
}

/* ==================================================================
   §57 · initial inference engine
   ================================================================== */
function finalize(a) {
  a.completedAt = a.clock();

  /* §10 · the beginner result is inferred, not hard-coded: it is the
     ordinary pipeline run over a beginner's very short answer set. */
  const est = estimate(a);
  const classes = classesOf(a);
  const mu = r2(est.mu), sigma = r2(est.sigma);
  const lo = mu - sigma, hi = mu + sigma;
  const qGroup = est.groups.filter(g => g.cls === 'questionnaire')[0];
  const band = bandOf(mu);

  const rating = {
    playerId: a.playerId, sport: a.sport, format: a.format,
    mu: mu, sigma: sigma, confidence: conf(sigma),
    volatility: 1.0,
    status: 'Initial Estimate',                                   /* §23.3, §42 */
    likelyRange: [r2(Math.max(SCALE_MIN, lo)), r2(Math.min(SCALE_MAX, hi))],
    rangeClamped: lo < SCALE_MIN || hi > SCALE_MAX,
    /* The band's own boundaries travel with the rating. The screen used to
       read them off the drawing constants in the bar, which are contiguous
       (2,65-3,85) rather than the documented band edges (2,70-3,80), so the
       card quietly printed a different Established to the one in the model. */
    band: band.key, bandName: band.name, bandMeaning: band.meaning,
    bandLo: band.lo, bandHi: band.hi,
    countedMatches: 0, informativeMatches: 0,
    distinctOpponents: [], distinctPartners: [],
    lastActiveAt: null, ceilingRisk: false, integrityState: 'clean',
    calibrationPriority: (est.contradiction && a.contradictionResolved === false) ? 'high'
                       : (a.layoff && LAYOFF[a.layoff].returnCalibration) ? 'high' : 'normal',
    engineVersion: ENGINE_VERSION, questionnaireVersion: QUESTIONNAIRE_VERSION,
    assessmentId: a.assessmentId,
    /* explanation payload */
    classes: classes, floor: est.floor, rawSigma: r2(est.rawSigma),
    floorBinding: est.rawSigma < est.floor - 0.005,
    confidenceReason: confidenceReason(a, est, classes),
    factors: factors(a, est),
    questionsAsked: a.responses.length,
    beginner: a.beginner,
    contradiction: est.contradiction || null,
    contradictionResolved: a.contradictionResolved,
    tieBreakerAsked: a.tieBreakerAsked,
    layoff: a.layoff, layoffAdd: r2(est.layoffAdd),
    dispersion: qGroup ? r2(qGroup.dispersion) : 0,
    groups: est.groups.map(g => ({ cls: g.cls, mu: r2(g.mu), sigma: r2(g.sigma), n: g.n, dispersion: r2(g.dispersion) }))
  };

  /* §44.6 · the derived features a model will want, stored not recomputed */
  const claims = est.items.filter(e => e.kind === 'claim'), demos = est.items.filter(e => e.kind === 'demo');
  a.features = {
    assessmentId: a.assessmentId,
    questionnaireGroupMu: qGroup ? r2(qGroup.mu) : null,
    questionnaireGroupSigma: qGroup ? r2(qGroup.sigma) : null,
    dispersion: rating.dispersion,
    claimMu: claims.length ? r2(fuseFlat(claims).mu) : null,
    demoMu: demos.length ? r2(fuseFlat(demos).mu) : null,
    contradictionGap: est.contradiction ? est.contradiction.gap : 0,
    contradictionDetected: !!est.contradiction,
    tieBreakerAsked: a.tieBreakerAsked,
    layoffAdjustment: r2(est.layoffAdd),
    populationPriorVersion: PRIOR_VERSION,
    derivedFeatureVersion: FEATURE_VERSION
  };
  /* §44.2 */
  a.summary = { assessmentId: a.assessmentId, playerId: a.playerId, sport: a.sport, format: a.format,
    questionnaireVersion: QUESTIONNAIRE_VERSION, engineVersion: ENGINE_VERSION,
    startedAt: a.startedAt, completedAt: a.completedAt,
    initialMu: mu, initialSigma: sigma, initialConfidence: rating.confidence, initialStatus: rating.status };
  return rating;
}

/* §67 · explainability — one row per evidence CATEGORY, arrows computed
   from the same numbers the rating came from */
function factors(a, est) {
  const out = [], byCat = {};
  est.items.forEach(e => { (byCat[e.category] = byCat[e.category] || []).push(e); });
  ['activity', 'context', 'execution', 'tactical', 'formatLink'].forEach(cat => {
    const list = byCat[cat]; if (!list || !list.length) return;
    const m = fuseFlat(list).mu;
    out.push({ key: cat, label: list[0].label || LABELS[cat],
               dir: m > est.mu + 0.15 ? 'up' : m < est.mu - 0.15 ? 'down' : 'flat',
               mu: r2(m), effect: 'level' });
  });
  if (est.layoffAdd) out.push({ key: 'layoff', label: 'Time away from the sport', dir: 'wider',
                                effect: 'uncertainty', detail: (LAYOFF[a.layoff] || {}).label });
  if (est.contradiction && a.contradictionResolved === false)
    out.push({ key: 'contradiction', label: 'Answers pointing to different ranges', dir: 'wider',
               effect: 'uncertainty', detail: 'gap of ' + est.contradiction.gap });
  return out;
}

/* §49 · why confidence is what it is, in the player's words */
function confidenceReason(a, est, classes) {
  if (est.contradiction && a.contradictionResolved === false)
    return { key: 'contradiction',
      text: 'Some of your answers point to different skill ranges, so we kept your starting range wider. Your first matches will settle it quickly.' };
  if (a.layoff && (LAYOFF[a.layoff] || {}).add > 0)
    return { key: 'layoff',
      text: 'You have been away for a while, so we widened your range rather than lowering your level. A couple of matches will bring it back in.' };
  return { key: 'questionnaireOnly',
    text: 'Your level is still an initial estimate because we have not seen enough match evidence yet.' };
}

/* ==================================================================
   §59-§62 · calibration and match updates
   ================================================================== */
const STABLE_SIGMA = 0.38;
const OBS_BASE = { Singles: { 0: 0.95, 1: 0.62, 2: 0.55 },
                   Doubles: { 0: 1.30, 1: 1.00, 2: 0.78, 3: 0.70 } };
const REPEAT_OPP = [1.00, 1.15, 1.35];      /* §39 · seen this opponent before */
const REPEAT_PARTNER = [1.00, 1.12, 1.25];

/* §28.1 · score margin, capped and heavy-tailed */
function marginFeature(gamesFor, gamesAgainst) {
  const tot = (gamesFor || 0) + (gamesAgainst || 0);
  if (!tot) return 0.70;
  const share = gamesFor / tot;
  const d = clamp((Math.abs(share - 0.5)) / 0.42, 0, 1);
  const capped = (1 - Math.exp(-1.9 * d)) / (1 - Math.exp(-1.9));
  return 0.5 + 0.5 * capped;                 /* 0,50 dead heat -> 1,00 total blowout */
}
const expectedWin = (mu, opponentMu) => 1 / (1 + Math.pow(10, (opponentMu - mu) / 0.6));

function observationSigma(format, anchors, oppRepeat, partnerRepeat) {
  const tbl = OBS_BASE[format === 'Singles' ? 'Singles' : 'Doubles'];
  const key = Math.min(anchors || 0, format === 'Singles' ? 2 : 3);
  let s = tbl[key] != null ? tbl[key] : 1.4;
  s *= REPEAT_OPP[Math.min(oppRepeat || 0, 2)];
  if (format !== 'Singles') s *= REPEAT_PARTNER[Math.min(partnerRepeat || 0, 2)];
  return s;
}

/* §29 + §61/§62 */
function applyMatch(rating, m) {
  const format = rating.format || 'Doubles';
  const anchors = m.anchors || 0;
  const integrity = m.integrityWeight != null ? m.integrityWeight : 1.0;   /* §63 */
  const E = m.expected != null ? m.expected : expectedWin(rating.mu, m.opponentMu != null ? m.opponentMu : rating.mu);
  const margin = m.gamesFor != null ? marginFeature(m.gamesFor, m.gamesAgainst) : 0.70;
  const S = m.won ? margin : 1 - margin;                                    /* §28 */
  const surprise = S - E;

  const obs = observationSigma(format, anchors, m.opponentRepeat, m.partnerRepeat) / Math.max(0.2, integrity);
  const prec = 1 / (rating.sigma * rating.sigma) + 1 / (obs * obs);
  let sigma = Math.max(0.06, Math.sqrt(1 / prec));

  /* §31 · volatility */
  const streak = Math.abs(surprise) > 0.30 ? (rating.surpriseStreak || 0) + 1 : 0;
  let volatility = rating.volatility || 1.0;
  if (streak >= 2) volatility = Math.min(1.8, volatility + 0.3);
  else volatility = Math.max(1.0, volatility - 0.15);
  if (volatility > 1.0) sigma = Math.min(SIGMA_MAX, sigma * (1 + 0.12 * (volatility - 1)));

  const K = (0.30 * (1 - conf(rating.sigma) / 100) + 0.08) * volatility * integrity;
  const mu = clamp(rating.mu + K * surprise, SCALE_MIN, SCALE_MAX);

  const opponents = Array.from(new Set((rating.distinctOpponents || []).concat(m.opponentIds || [])));
  const partners  = Array.from(new Set((rating.distinctPartners || []).concat(m.partnerIds || [])));
  const informative = (rating.informativeMatches || 0) + (integrity >= 0.5 ? 1 : 0);
  const counted = (rating.countedMatches || 0) + 1;

  /* §4.4 · a player who keeps beating the top of the marketplace */
  const ceilingRisk = rating.ceilingRisk || (mu >= 4.85 && surprise > 0.25);

  const st = statusOf({ sigma: sigma, informativeMatches: informative, anchoredMatches:
    (rating.anchoredMatches || 0) + (anchors > 0 ? 1 : 0), distinctOpponents: opponents,
    distinctPartners: partners, format: format, integrityState: rating.integrityState });

  const lo = mu - sigma, hi = mu + sigma;
  return Object.assign({}, rating, {
    mu: r2(mu), sigma: r2(sigma), confidence: conf(sigma), volatility: r2(volatility),
    likelyRange: [r2(Math.max(SCALE_MIN, lo)), r2(Math.min(SCALE_MAX, hi))],
    rangeClamped: lo < SCALE_MIN || hi > SCALE_MAX,
    band: bandOf(mu).key, bandName: bandOf(mu).name,
    countedMatches: counted, informativeMatches: informative,
    anchoredMatches: (rating.anchoredMatches || 0) + (anchors > 0 ? 1 : 0),
    distinctOpponents: opponents, distinctPartners: partners,
    surpriseStreak: streak, ceilingRisk: ceilingRisk,
    status: st.status, calibrationMode: st.mode, calibrationPriority: st.priority,
    lastObservation: { predictedWinProbability: r2(E), scoreMarginFeature: r2(margin),
      observedPerformance: r2(S), informationWeight: r2(1 / (obs * obs)), integrityWeight: integrity,
      ratingDelta: r2(mu - rating.mu), sigmaDelta: r2(sigma - rating.sigma), anchorCount: anchors }
  });
}

/* §42 + §26 + §27 · the three public states, with both calibration modes */
function statusOf(r) {
  const doubles = (r.format || 'Doubles') !== 'Singles';
  const opp = (r.distinctOpponents || []).length, par = (r.distinctPartners || []).length;
  const inf = r.informativeMatches || 0, anch = r.anchoredMatches || 0;
  if (!inf) return { status: 'Initial Estimate', mode: 'pending', priority: 'normal' };
  const anchored  = anch >= 2 && inf >= 3 && opp >= 3 && (!doubles || par >= 2);
  const bootstrap = inf >= 8 && opp >= 5 && (!doubles || par >= 3);
  const clean = (r.integrityState || 'clean') === 'clean';
  if (r.sigma <= STABLE_SIGMA && clean && (anchored || bootstrap))
    return { status: 'Stable', mode: anchored ? 'anchored' : 'bootstrap', priority: 'low' };
  return { status: 'Calibrating', mode: anch > 0 ? 'anchored' : 'bootstrap',
           priority: r.sigma > 0.60 ? 'high' : 'normal' };
}

/* §26 · what the player should be matched into next */
function calibrationPlan(rating) {
  const doubles = (rating.format || 'Doubles') !== 'Singles';
  const need = rating.sigma > 0.70 ? 5 : rating.sigma > 0.50 ? 4 : 3;
  return { anchor: r2(rating.mu),
           lo: r2(Math.max(SCALE_MIN, rating.mu - 0.6 * rating.sigma)),
           hi: r2(Math.min(SCALE_MAX, rating.mu + 0.6 * rating.sigma)),
           matches: Math.max(0, need - (rating.informativeMatches || 0)),
           anchorsWanted: doubles ? 3 : 1,
           partnersWanted: doubles ? 2 : 0,
           opponentsWanted: 3 };
}

/* §35 · inactivity, applied to an existing rating */
function applyInactivity(rating, months) {
  const add = months < 3 ? 0 : months < 6 ? 0.08 : months < 12 ? 0.16 : months < 24 ? 0.28 : 0.45;
  if (!add) return rating;
  const sigma = Math.min(SIGMA_MAX, Math.sqrt(rating.sigma * rating.sigma + add * add));
  return Object.assign({}, rating, { sigma: r2(sigma), confidence: conf(sigma),
    likelyRange: [r2(Math.max(SCALE_MIN, rating.mu - sigma)), r2(Math.min(SCALE_MAX, rating.mu + sigma))],
    volatility: months >= 24 ? Math.max(rating.volatility || 1, 1.3) : rating.volatility || 1,
    calibrationPriority: months >= 24 ? 'high' : rating.calibrationPriority });
}

/* §33 · peer feedback never writes mu */
function applyPeerFeedback(rating, reports) {
  const uneven = (reports || []).filter(r => r.balance === 'clearlyUneven' && r.acceptedForSignal);
  const evaluators = Array.from(new Set(uneven.map(r => r.evaluatorPlayerId)));
  if (evaluators.length < 2) return Object.assign({}, rating, { peerSignal: 'none' });
  return Object.assign({}, rating, {
    peerSignal: 'recalibrate',
    volatility: Math.min(1.8, (rating.volatility || 1) + 0.3),
    calibrationPriority: 'high'
  });
}

/* §64 · what matchmaking is allowed to read */
function matchmakingView(rating) {
  return { mu: rating.mu, sigma: rating.sigma, volatility: rating.volatility, status: rating.status,
    playerBand: rating.band, ceilingRisk: rating.ceilingRisk,
    uncertaintyRisk: r2(Math.min(1, rating.sigma / 0.9)),
    calibrationValue: r2(Math.min(1, rating.sigma / SIGMA_MAX)),
    conservativeScore: r2(rating.mu - 0.8 * rating.sigma) /* §34.4 · leaderboards only */ };
}

/* ---------------- onboarding session state ----------------
   The engine owns the questionnaire. This layer only holds the current
   assessment, walks the (sport, format) list, and hands answers back. */
const OB_SPORTS=['Padel','Tennis','Squash','Badminton'];
function obFresh(){return {step:'welcome',sports:[],idx:0,as:{},res:{},q:null,log:[],info:null};}
function obKeys(){const out=[];(S.ob.sports||[]).forEach(sp=>(SPORT_FORMATS[sp]||[]).forEach(f=>out.push(sp+'|'+f)));return out;}
function obCur(){const k=obKeys();return k[S.ob.idx]||k[0];}
function obSportOf(k){return (k||'').split('|')[0];}
function obFormatOf(k){return (k||'').split('|')[1];}
/* the other format of the same sport, once it has a rating of its own */
function obFormatLink(k){
  const sp=obSportOf(k),fm=obFormatOf(k);
  const other=(SPORT_FORMATS[sp]||[]).filter(f=>f!==fm)[0];
  if(!other) return null;
  const r=S.ob.res[sp+'|'+other];
  return r?formatLinkEvidence(other,fm,r.mu,r.sigma):null;
}
function obAssessment(k){
  if(S.ob.as[k]) return S.ob.as[k];
  const a=createAssessment({playerId:'me',sport:obSportOf(k),format:obFormatOf(k),
    formatLink:obFormatLink(k),now:Date.now(),clock:()=>Date.now()});
  S.ob.as[k]=a; return a;
}
/* advance to the next question, or to the result when the engine stops */
function obAdvance(k){
  const a=obAssessment(k);
  const q=nextQuestion(a);
  S.ob.q=q;
  if(!q){S.ob.res[k]=finalize(a);S.ob.step='result';}
  return q;
}
function obAnswer(k,optionId){
  const a=obAssessment(k);
  if(!S.ob.q) return;
  recordAnswer(a,S.ob.q.id,optionId);
  obAdvance(k);
}
function obBack(k){
  const a=obAssessment(k);
  if(!a.responses.length) return false;
  const last=a.responses.pop();
  delete a.answered[last.questionId];
  a.routing.pop();
  /* recompute the flags the popped answer had set */
  a.beginner=false;a.hasHistory=false;a.needsVolume=false;a.needsLayoff=false;a.layoff=null;
  a.crossSportEvidence=null;
  a.tieBreakerAsked=false;a.contradiction=null;a.contradictionResolved=null;
  const replay=a.responses.slice(); a.responses=[]; a.answered={};
  replay.forEach(r=>recordAnswer(a,r.questionId,r.optionId));
  obAdvance(k);
  return true;
}
/* replay a scenario through the real engine: no scenario types a result in,
   every number on screen is produced by the same code path a live player hits */
function obReplay(sports,policy,opt){
  opt=opt||{};
  S.ob=obFresh(); S.ob.sports=sports.slice(); S.ob.idx=0;
  const keys=obKeys();
  const upTo=opt.goTo!=null?opt.goTo:(opt.done||opt.data?keys.length-1:0);
  for(let i=0;i<=upTo;i++){
    S.ob.idx=i;
    const k=keys[i], a=obAssessment(k);
    let q,guard=0;
    while((q=nextQuestion(a))&&guard++<20){
      S.ob.q=q;
      if(opt.stopAtQuestion&&q.difficulty==='adv'){S.ob.step='q';S.tab='now';reset('onboard');return;}
      recordAnswer(a,q.id,policy(q));
    }
    S.ob.res[k]=finalize(a);
  }
  S.ob.idx=upTo; S.ob.q=null;
  S.ob.step=opt.data?'data':opt.done?'done':'result';
  S.tab='now'; reset('onboard');
}

/* ---------- 2 · deadlines and the ladder read the policy ---------- */
deadlines=function(m){
  const P=pol(m.club);
  const commit=Math.min(m.start-P.window*HOUR, m.start-12*HOUR);
  const solo=SPORTS[m.sport].players===2;
  return {commit, rescue:m.start-(solo?6:4)*HOUR, check:m.start-2*HOUR,
          joinCut:m.start-P.joinCut*60e3, play:m.start, solo};

/* Whether a court is being held past the ladder is the CLUB's decision, taken
   with the club's own fill model, and this app does not recompute it. It reads
   two published facts: that the club extended the hold, and the probability it
   did so on. A player app that ran its own model would eventually show a court
   held that the club had released, which is the worst failure in the system. */
function clubExtended(m){ return !!m.clubExtended && pol(m.club).probHold; }
function clubFill(m){ return m.clubFill!=null?m.clubFill:null; }
const _courtHold=courtHold;
courtHold=function(m){
  const h=_courtHold(m), P=pol(m.club);
  if(m.kind==='private'||m.courtLocked||m.committedAt!=null) return h;
  /* the club's maximum hold age: a speculative hold that has sat on a peak
     court for two days is a different thing from one taken this morning */
  if(h.kind==='soft' && P.maxHoldAge && (S.now-m.created)/HOUR>P.maxHoldAge && filled(m)<m.n-1)
    return {kind:'none', why:'stale', need:m.n-1, label:'Released', age:P.maxHoldAge,
            note:'a soft hold older than '+P.maxHoldAge+' h goes back on sale'};
  /* demand-aware holding may only ever EXTEND. It is never allowed to release
     a court earlier than the ladder promised. */
  if(h.kind==='none' && (h.why==='nearLapsed'||h.why==='farLapsed') && clubExtended(m))
    return {kind:'soft', why:'extended', need:m.n, until:0, label:'Held',
            p:clubFill(m), note:'held past the ladder because the club expects this match to fill'};
  return h;
};
