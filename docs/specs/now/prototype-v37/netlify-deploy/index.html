<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="Interactive prototype of the Rakieta player app. Pick a scenario, move the clock, and watch the booking and cancellation rules fire."/>
<meta name="theme-color" content="#08222B"/>
<meta property="og:type" content="website"/>

<meta property="og:description" content="Book a court, join a match, cancel one. Every rule is live — move the clock and watch what changes."/>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23071C24'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23E8482B'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --paper:#F4F2ED; --paper2:#EDEAE3; --surface:#FFFFFF; --ink:#101B20; --night:#0A3441; --night2:#12495B;
  --muted:#6E7F85; --line:#E5E1D8; --line2:#F0EDE6;
  --coral:#E8482B; --coral-soft:#FDEBE6; --coral-ink:#B8351C;
  --mint:#0C8F6B; --mint-soft:#E2F3EC; --amber:#9A6A0B; --amber-soft:#FBF0DA;
  --red:#B4392C; --red-soft:#FBEAE7; --volt:#D9F24B;
  /* information, drawn from the deep teal already in the palette rather than a new blue */
  --info:#12495B; --info-soft:#EAF1F4; --info-line:#C7DBE3;
  --pad:#E8482B; --ten:#0C8F6B; --squ:#12495B; --bad:#9A6A0B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08222B;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:290px 1fr;height:100%}
#rail{background:#071C24;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
#railhead{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#railhead .brand{display:flex;align-items:center;gap:9px;color:#fff}
#railhead .dot{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center}
#railhead .dot i{width:9px;height:9px;border-radius:5px;background:var(--coral);display:block}
#railhead b{font-size:15px;letter-spacing:-.02em}
#railhead p{font-size:11px;color:rgba(255,255,255,.45);margin-top:7px;line-height:1.45}
#railbody{flex:1;overflow-y:auto;padding:12px 12px 24px}
#railbody::-webkit-scrollbar{width:6px}
#railbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.rgrp{margin-bottom:16px}
.rgrp h5{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt);
  padding:0 8px;margin-bottom:7px;font-weight:700}
.ritem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;
  color:rgba(255,255,255,.78);font-size:12.5px;font-weight:500;line-height:1.3;transition:.12s}
.ritem:hover{background:rgba(255,255,255,.08);color:#fff}
.ritem.on{background:var(--coral);color:#fff;font-weight:600}
.ritem s{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.1);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  text-decoration:none;font-family:'IBM Plex Mono',monospace}
.ritem.on s{background:rgba(255,255,255,.22)}
.ritem em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.4);display:block;margin-top:1px}
.ritem.on em{color:rgba(255,255,255,.7)}

/* ---------- stage ---------- */
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  overflow:hidden;padding:18px 20px 0}
#stagehead{position:absolute;top:16px;left:24px;right:24px;display:flex;align-items:center;gap:12px}
#scname{color:#fff;font-size:13px;font-weight:700;letter-spacing:-.01em}
#scdesc{color:rgba(255,255,255,.5);font-size:11.5px}
#phone{width:392px;height:788px;background:var(--paper);border-radius:34px;position:relative;
  border:1px solid #24505E;box-shadow:0 40px 90px -40px rgba(0,0,0,.8);display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0;margin-top:8px}
#statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:10.5px;font-weight:600;flex-shrink:0;background:transparent}
#statusbar .r{display:flex;gap:5px;align-items:center;color:var(--ink)}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 15px 14px;scroll-behavior:smooth}
#scroll::-webkit-scrollbar{width:0}
#cta{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:10px 15px;display:none}
#cta.on{display:block}
#tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:#fff;padding:7px 0 12px;flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.5px;
  color:var(--muted);font-weight:600}
.tab.on{color:var(--coral)}
.tab i{width:16px;height:16px;border-radius:5px;background:currentColor;opacity:.85;display:block}
.tab.fab i{width:28px;height:28px;border-radius:10px;background:var(--coral);opacity:1;margin-bottom:-4px}

/* ---------- time bar ---------- */
#timebar{width:100%;max-width:980px;margin-top:14px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px 14px;flex-shrink:0}
#timebar .th{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
#timebar .th b{color:#fff;font-size:12px;font-weight:700}
#timebar .th span{color:rgba(255,255,255,.5);font-size:11px}
#timebar .th .phase{margin-left:auto;padding:2px 9px;border-radius:6px;font-size:10px;font-weight:700;
  background:var(--coral);color:#fff}
#track{position:relative;height:34px}
#track .rail{position:absolute;left:0;right:0;top:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
#track .fill{position:absolute;left:0;top:6px;height:5px;border-radius:3px;background:var(--coral)}
#track .stop{position:absolute;top:0;transform:translateX(-50%);text-align:center;cursor:pointer;z-index:3;padding:0 4px}
#track .stop i{width:11px;height:11px;border-radius:6px;background:#0B2C38;border:2px solid rgba(255,255,255,.4);
  display:block;margin:2px auto 0}
#track .stop.done i{background:var(--coral);border-color:var(--coral)}
#track .stop u{display:block;font-size:9.5px;color:rgba(255,255,255,.55);margin-top:4px;
  text-decoration:none;white-space:nowrap;font-weight:600}
#track input{position:absolute;left:0;right:0;top:2px;height:14px;opacity:0;cursor:pointer;margin:0;width:100%;z-index:1}

/* ---------- phone primitives ---------- */
.pbar{display:flex;align-items:center;gap:10px;padding:12px 15px 9px;flex-shrink:0}
.pbar .back{font-size:20px;color:var(--muted);line-height:1;padding:0 2px}
.pbar .t{flex:1;min-width:0}
.eyebrow{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* a form label has to be findable at a glance, which the muted eyebrow was not */
.flab{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--night);margin-bottom:7px}
.h1{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.h2{font-size:15px;font-weight:700;letter-spacing:-.025em}
.tiny{font-size:11px;line-height:1.45;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.card-n{background:var(--night);color:#fff;border-radius:15px;padding:14px;margin-bottom:9px}
.card-n .tiny{color:rgba(255,255,255,.68)}
.card-n .eyebrow{color:rgba(255,255,255,.52)}
.card.tap,.card-n.tap{cursor:pointer;transition:.12s}
.card.tap:hover{border-color:var(--coral);transform:translateY(-1px)}
.card-n.tap:hover{transform:translateY(-1px)}
.hair{border-top:1px solid var(--line2);margin-top:9px;padding-top:8px}
.card-n .hair{border-color:rgba(255,255,255,.15)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:9.5px;
  font-weight:700;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--mint-soft);color:var(--mint)}
.tag.hot{background:var(--coral-soft);color:var(--coral-ink)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.tag.w{background:rgba(255,255,255,.17);color:#fff}
.tag i{width:6px;height:6px;border-radius:3px;display:block;flex-shrink:0}
.tag{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);font-size:10.5px;background:#fff;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:2px;display:block}
.chip.sm{height:25px;padding:0 8px;font-size:10px;gap:4px}
.chip.sm i{width:5px;height:5px}
.row{display:flex;gap:5px;flex-wrap:wrap}
.sqrow{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.sqrow::-webkit-scrollbar{display:none}
.sqrow>*{flex:0 0 auto}
/* a rail of full match cards. Same scroll pattern as the day squares, so
   render() already preserves its position across re-renders. The card width
   leaves the next one peeking, which is the whole affordance. */
.mrail{margin:0 0 9px}
.mrail>*{width:268px}
.mrail .card{margin-bottom:0;height:100%;display:flex;flex-direction:column}
.mrail .card>.hair:last-child{margin-top:auto}
.hr{flex:0 0 auto;min-width:auto;border-radius:9px;padding:5px 10px;text-align:center;border:1px solid}
.hsq{border-radius:9px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #BFE0D2;background:var(--mint-soft);white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:var(--ink)}
.dsq{border-radius:10px;padding:6px 9px;text-align:center;border:1px solid;white-space:nowrap}
.tsq{border-radius:8px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700}
.tsq.free{background:var(--mint-soft);border-color:#BFE0D2;color:var(--ink)}
.tsq.off{background:var(--line2);border-color:transparent;color:var(--muted)}
.tsq.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tsq.end{background:#fff;border-color:var(--ink);color:var(--ink)}
.hr.free{background:var(--mint-soft);border-color:#BFE0D2;color:var(--ink)}
.hr.taken{background:var(--line2);border-color:transparent;color:var(--muted)}
.hr.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.hr[disabled]{cursor:default}
.hstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -15px 10px;padding:1px 15px 5px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{height:0}
.hstrip>*{scroll-snap-align:center;scroll-snap-stop:always;flex:0 0 100%;margin-bottom:0!important}
.dots{display:flex;gap:5px;justify-content:center;margin:-2px 0 11px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--line);display:block}
.dots i.on{background:var(--coral);width:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;
  border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.12s;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn.p{background:var(--coral);color:#fff}
.btn.n{background:var(--night);color:#fff}
.btn.s{background:#fff;border:1px solid var(--line)}
.btn.w{background:rgba(255,255,255,.17);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.rl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:11.5px}
.rl+.rl{border-top:1px solid var(--line2)}
.rl b{font-weight:600}
.meter{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--night);border-radius:3px}
.fit{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:7px;
  background:var(--night);color:#fff;font-size:11px;font-weight:700}
.fit.hi{background:var(--coral)}
.balbar{display:flex;height:24px;border-radius:8px;overflow:hidden;background:var(--line2)}
.balbar i{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
  color:#fff;font-style:italic}
.avat{width:27px;height:27px;border-radius:9px;background:var(--night);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0}
.avat.d{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.avat.me{background:var(--coral)}
.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hold .avat{position:relative}
.hold:active .avat{transform:scale(.93)}
.avat{transition:transform .12s}
.holding .avat{box-shadow:0 0 0 3px var(--coral-soft)}
.bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.seg{display:flex;background:var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:7px 4px;font-size:10.5px;font-weight:700;color:var(--muted);
  border-radius:8px;cursor:pointer}
.seg span.on{background:#fff;color:var(--ink)}
.note{padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--night);
  border-radius:10px;background:#fff;margin-bottom:9px}
.note b{display:block;font-size:11.5px;margin-bottom:3px}
.note.mint{border-left-color:var(--mint);background:var(--mint-soft);border-color:#CFE7DD}
.note.coral{border-left-color:var(--coral);background:var(--coral-soft);border-color:#F3CFC5}
.note.amber{border-left-color:var(--amber);background:var(--amber-soft);border-color:#EFDCB8}
.note.info{border-left-color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.note.info b{color:var(--info);display:flex;align-items:center;gap:6px}
.note.info b::before{content:'i';flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  background:var(--info);color:#fff;font-family:Georgia,'Times New Roman',serif;font-style:italic;
  font-size:10px;font-weight:700;line-height:14px;text-align:center}
.sect{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:14px 0 7px}
.sect:first-child{margin-top:2px}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty b{display:block;font-size:13px;color:var(--ink);margin-bottom:5px}

/* sheets */
#sheetwrap{position:absolute;inset:0;z-index:20;display:none}
#sheetwrap.on{display:block}
#scrim{position:absolute;inset:0;background:rgba(10,52,65,.45);animation:fade .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;
  border-radius:22px 22px 0 0;box-shadow:0 -20px 40px -22px rgba(10,32,40,.6);
  display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
#sheethead{padding:10px 15px 4px;flex-shrink:0}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 10px}
#xsheet{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:14px;background:var(--line2);
  color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;z-index:3}
#xsheet:hover{background:var(--line);color:var(--ink)}
#sheethead{position:relative}
#sheetbody{overflow-y:auto;padding:0 15px 16px}
#sheetbody::-webkit-scrollbar{width:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
#toast{position:absolute;left:15px;right:15px;bottom:78px;z-index:40;pointer-events:none}
.tst{background:var(--night);color:#fff;border-radius:12px;padding:11px 14px;font-size:12px;
  font-weight:600;box-shadow:0 12px 28px -12px rgba(0,0,0,.6);animation:up .24s;margin-top:7px}
.tst.ok{background:var(--mint)}
.tst.bad{background:var(--red)}

#scroll>*{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:900px){#phone{height:700px}}
@media (max-height:800px){#phone{height:620px}#timebar{padding:9px 14px 11px}}

/* ==================================================================
   PHONE AND TABLET
   Below 900px the scenario rail becomes a drawer and the phone frame
   is dropped entirely: on a real phone the app should be the app,
   not a picture of a phone.
   ================================================================== */
#mtop{display:none}
#railscrim{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #mtop{display:flex;align-items:center;gap:11px;height:46px;padding:0 12px;flex-shrink:0;
    background:#071C24;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:30}
  #mtop button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #mtop button span{display:block;width:15px;height:1.6px;background:#fff;border-radius:2px;position:relative}
  #mtop button span::before,#mtop button span::after{content:'';position:absolute;left:0;width:15px;
    height:1.6px;background:#fff;border-radius:2px}
  #mtop button span::before{top:-5px}
  #mtop button span::after{top:5px}
  #mtopname{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-.01em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mtopbrand{color:rgba(255,255,255,.45);font-size:11px;flex-shrink:0}

  #rail{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:60;
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 70px rgba(0,0,0,.55)}
  body.railopen #rail{transform:none}
  #railscrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(4,18,24,.55);
    opacity:0;pointer-events:none;transition:opacity .26s}
  body.railopen #railscrim{opacity:1;pointer-events:auto}

  #stage{padding:0;justify-content:flex-start;overflow:visible}
  #stagehead{display:none}
  #statusbar{display:none}
  #phone{width:100%;height:calc(100vh - 46px - 56px);height:calc(100dvh - 46px - 56px);
    max-height:none;border:0;border-radius:0;margin:0;box-shadow:none;flex-shrink:1}
  #timebar{position:fixed;left:0;right:0;bottom:0;margin:0;max-width:none;z-index:40;
    border-radius:0;border-left:0;border-right:0;border-bottom:0;padding:8px 14px 10px;
    background:#0B2B36}
  #timebar .th{margin-bottom:6px}
}
@media (max-width:900px) and (max-height:800px){
  #phone{height:calc(100vh - 46px - 56px);height:calc(100dvh - 46px - 56px)}
}

/* the information mark, and the popover anchored to it */
.iwrap{position:relative;display:inline-flex;align-items:center}
.ibtn{width:16px;height:16px;border:0;background:none;padding:0;cursor:pointer;flex-shrink:0;
  color:rgba(255,255,255,.55);display:inline-flex;align-items:center;justify-content:center;line-height:0;
  border-radius:9px;transition:color .12s ease,background .12s ease}
.ibtn:hover{color:rgba(255,255,255,.85)}
.ibtn.on{color:var(--night);background:var(--volt)}
.ipop{position:absolute;top:25px;left:0;z-index:60;width:250px;background:#fff;color:var(--ink);
  border:1px solid var(--line);border-radius:13px;padding:11px 12px 12px;

/* ==================================================================
   REAL-DEVICE FIX
   The base rules above assume a desktop viewer looking at a small
   phone MOCKUP beside a scenario sidebar: a fixed 392x788 box, a
   290px grid column reserved for the (now-hidden) rail, a 46px fake
   top bar, and height math that subtracts space for a simulated
   clock bar that no longer exists in this build. Hiding elements
   with display:none does not free the grid track or the space those
   calculations reserved for them — so on an actual phone the app
   was rendering squeezed into whatever was left over, not the full
   screen.

   This build has no sidebar to sit beside any more, so there is no
   remaining reason to keep any of that conditional — every rule
   below applies unconditionally, at every viewport size, rather than
   only under a max-width breakpoint that depended on the exact

/* the behaviour record — machine-derived events only, good and bad */
const REC={

/* Player Score is bimodal because a no-show carries an explicit -18 on top of the
   weighted parts: players with a clean record land 78-96, players with a recent no-show

const SCORE_MIN=70;   /* the browsing filter  */
const GATE_MIN=70;    /* the host's join gate \u2014 the same line, so there is only one to learn */
function attRate(id){const r=REC[id];return (r&&r.att[1])?r.att[0]/r.att[1]:null;}

/* A club is a venue, not a sport. Almost every racket venue in Kraków sells two or

const CLUBS = {
  ps:{n:'Zabłocie Sport',  dist:14, km:'4,2', rebooking:true, joinCut:30, court:'Court 2 · Mondo',  window:24,
      sports:['Padel','Squash'],     card:{Padel:0, Squash:'full'}},

  ko:{n:'Krakowianka',     dist:18, km:'6,1', rebooking:false, joinCut:30, court:'Court 5 · hard',   window:24, pm:0.86,
      sports:['Tennis'],             card:{Tennis:15}},
  cen:{n:'Centrum Ruchu',  dist:7,  km:'2,0', rebooking:false, joinCut:20, court:'Court 1 · glass',  window:12, pm:1.10,
      sports:['Squash','Badminton','Padel'], card:{Squash:'full', Badminton:'full', Padel:0}},
  wis:{n:'Wisła Park',     dist:19, km:'6,9', rebooking:true, joinCut:30, court:'Court 1 · clay',   window:24, pm:0.92,
      sports:['Tennis','Padel'],     card:{Tennis:15, Padel:0}},
  pod:{n:'Podgórze Hall',  dist:15, km:'4,9', rebooking:false, joinCut:30, court:'Hall 1 · parquet', window:24, pm:1.05,
      sports:['Badminton','Tennis'], card:{Badminton:'full', Tennis:15}}
};

/* ==================================================================
   AVAILABILITY
   ------------------------------------------------------------------
   A club publishes two facts per court per day and nothing else:
     · the window it is open
     · the intervals already booked
   Everything a player sees is derived from those two. This is the
   whole reason the model is robust:
     - a club selling 60/90/120 would otherwise have to publish three
       overlapping slot grids, which drift out of sync the moment one
       booking lands;
     - a walk-in taken at the desk is the same shape as a booking made
       here, so reconciliation is trivial;
     - half-hour starts are OUR presentation choice, not something the
       club has to encode. Changing to fifteen is one constant;
     - we can never offer a start we cannot complete, because a start
       is offered only if the whole window is free.
   The last point is why duration is chosen before the calendar: the
   set of possible start times is a function of how long you want.
   ================================================================== */
const OPEN=[7*60,22*60];                    /* every club, 07:00–22:00 */
const PEAK=17*60;                           /* evening rate starts     */
const RATE={
  Padel:    {off:{60:96, 90:128,120:160}, pk:{60:112,90:152,120:184}},
  Tennis:   {off:{60:60, 90:90},          pk:{60:70, 90:105}},
  Squash:   {off:{30:20, 60:28, 90:40},   pk:{30:24, 60:32, 90:44}},
  Badminton:{off:{60:52, 90:74},          pk:{60:60, 90:84}}
};
const COURTS=[
  {id:'ct1', club:'ps', sport:'Padel',    name:'Court 1', surf:'Mondo',      indoor:1},
  {id:'ct2', club:'ps', sport:'Padel',    name:'Court 2', surf:'Mondo',      indoor:1},
  {id:'ct3', club:'ps', sport:'Padel',    name:'Court 3', surf:'Wall',       indoor:0, pm:0.90},
  {id:'ct4', club:'ps', sport:'Squash',   name:'Court A', surf:'Glass back', indoor:1},
  {id:'ct5', club:'pc', sport:'Padel',    name:'Court 1', surf:'Panoramic',  indoor:1},
  {id:'ct6', club:'pc', sport:'Padel',    name:'Court 3', surf:'Panoramic',  indoor:0, pm:0.90},
  {id:'ct7', club:'pc', sport:'Badminton',name:'Hall 1',  surf:'Parquet',    indoor:1},
  {id:'ct8', club:'pc', sport:'Badminton',name:'Hall 2',  surf:'Parquet',    indoor:1},
  {id:'ct9', club:'k33',sport:'Tennis',   name:'Court 2', surf:'Clay',       indoor:0},
  {id:'ct10',club:'k33',sport:'Tennis',   name:'Court 3', surf:'Clay',       indoor:0},
  {id:'ct11',club:'k33',sport:'Tennis',   name:'Indoor 1',surf:'Hard',       indoor:1, pm:1.33},
  {id:'ct12',club:'k33',sport:'Padel',    name:'Court 1', surf:'Wall',       indoor:0},
  {id:'ct13',club:'as', sport:'Squash',   name:'Court 3', surf:'Glass back', indoor:1},
  {id:'ct14',club:'as', sport:'Squash',   name:'Court 4', surf:'Standard',   indoor:1},
  {id:'ct15',club:'as', sport:'Squash',   name:'Court 5', surf:'Glass back', indoor:1},
  {id:'ct16',club:'as', sport:'Badminton',name:'Hall B',  surf:'Parquet',    indoor:1},
  {id:'ct17',club:'mos',sport:'Badminton',name:'Hall B',  surf:'Parquet',    indoor:1},
  {id:'ct18',club:'mos',sport:'Badminton',name:'Hall C',  surf:'Mat',        indoor:1},
  {id:'ct19',club:'mos',sport:'Squash',   name:'Court 1', surf:'Standard',   indoor:1},
  {id:'ct20',club:'ko', sport:'Tennis',   name:'Court 5', surf:'Hard',       indoor:0},
  {id:'ct21',club:'ko', sport:'Tennis',   name:'Court 6', surf:'Hard',       indoor:0},
  {id:'ct22',club:'cen',sport:'Squash',   name:'Court 1', surf:'Glass back', indoor:1},
  {id:'ct23',club:'cen',sport:'Squash',   name:'Court 2', surf:'Glass back', indoor:1},
  {id:'ct24',club:'cen',sport:'Badminton',name:'Hall A',  surf:'Parquet',    indoor:1},
  {id:'ct25',club:'cen',sport:'Padel',    name:'Court 1', surf:'Mondo',      indoor:1},
  {id:'ct26',club:'wis',sport:'Tennis',   name:'Court 1', surf:'Clay',       indoor:0},
  {id:'ct27',club:'wis',sport:'Tennis',   name:'Court 2', surf:'Clay',       indoor:0},
  {id:'ct28',club:'wis',sport:'Padel',    name:'Court 1', surf:'Panoramic',  indoor:0, pm:0.90},
  {id:'ct29',club:'pod',sport:'Badminton',name:'Hall 1',  surf:'Parquet',    indoor:1},
  {id:'ct30',club:'pod',sport:'Badminton',name:'Hall 2',  surf:'Mat',        indoor:1},
  {id:'ct31',club:'pod',sport:'Tennis',   name:'Indoor A',surf:'Hard',       indoor:1, pm:1.33}
];
/* deterministic stand-in for what a club's own system would publish */
function h32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function lcg(a){return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
const _bk={};
function bookings(cid,d){
  const key=cid+'|'+d; if(_bk[key]) return _bk[key];
  const r=lcg(h32(key)); const out=[]; let t=OPEN[0];
  while(t<OPEN[1]-30){
    const busy = t>=PEAK?0.70 : t>=12*60?0.40 : 0.26;
    if(r()<busy){const blk=[60,90,120][Math.floor(r()*3)];
      out.push([t,Math.min(t+blk,OPEN[1])]); t+=blk;}
    else t+=30;
  }
  return _bk[key]=out;
}
function courtFree(cid,d,start,dur){
  if(start<OPEN[0]||start+dur>OPEN[1]) return false;
  return bookings(cid,d).every(iv=>start+dur<=iv[0]||start>=iv[1]);
}
function courtPriceOf(court,dur,start){
  const t=RATE[court.sport][start>=PEAK?'pk':'off'];
  const base=t[dur]!=null?t[dur]:t[Object.keys(t)[0]];
  return Math.round(base*(CLUBS[court.club].pm||1)*(court.pm||1));
}
/* the club's price for an hour is the cheapest court of that sport still free */

function shareOf(sport,price){return Math.round(price/SPORTS[sport].players*100)/100;}
function cardOffFor(club,sport,share){
  const v=CLUBS[club].card[sport];
  if(v==null||v===0) return 0;
  return v==='full'?share:Math.min(share,v);
}
function payableOf(court,dur,start){
  const sh=shareOf(court.sport,courtPriceOf(court,dur,start));
  return Math.max(0,sh-cardOffFor(court.club,court.sport,sh));
}
function cardStateOf(court,dur,start){
  const sh=shareOf(court.sport,courtPriceOf(court,dur,start));
  const off=cardOffFor(court.club,court.sport,sh);
  return off<=0?'none':(sh-off<=0?'full':'part');
}
/* every half-hour start at which SOME court of this sport is free for the whole block */
function freeStarts(club,sport,dur,d,cat){
  const cs=COURTS.filter(c=>c.club===club&&c.sport===sport&&(!cat||c.surf===cat));
  const out=[];
  for(let t=OPEN[0];t+dur<=OPEN[1];t+=30)
    if(cs.some(c=>courtFree(c.id,d,t,dur))) out.push(t);
  return out;
}
function courtsAt(club,sport,dur,d,t,cat){
  return COURTS.filter(c=>c.club===club&&c.sport===sport&&(!cat||c.surf===cat)&&courtFree(c.id,d,t,dur));
}
/* the categories a club sells for a sport — an Open Match buys one of these, not a court */
function categoriesFor(club,sport){
  const out=[]; COURTS.forEach(c=>{if(c.club===club&&c.sport===sport&&out.indexOf(c.surf)<0)out.push(c.surf);});
  return out;
}
/* every court in one category shares a price, which is what makes the seat price guaranteeable */
function catPrice(club,sport,cat,dur,start){
  const c=COURTS.filter(x=>x.club===club&&x.sport===sport&&x.surf===cat)[0]
        ||COURTS.filter(x=>x.club===club&&x.sport===sport)[0];
  return c?courtPriceOf(c,dur,start):0;
}
function podOfMin(min){return min<12*60?'morning':min<PEAK?'afternoon':'evening';}
/* a day offset and a minute-of-day become a real moment */
function slotStart(d,min){
  const b=new Date(S.now);
  return new Date(b.getFullYear(),b.getMonth(),b.getDate()+d,Math.floor(min/60),min%60).getTime();
}
function nowMin(){const n=new Date(S.now);return n.getHours()*60+n.getMinutes();}
/* Which day the Courts list is describing.
   'Any day' means today when today still has something, and the next day that does
   when it does not — otherwise opening the app at nine in the evening returns nothing
   and the honest reading of 'any' would be the least useful one.                  */
function dayHasSomething(d){
  return Object.keys(CLUBS).some(id=>clubPasses(id)&&clubStarts(id,d).length);
}
function listDay(){
  if(S.cDay==='today') return 0;
  if(S.cDay==='tom') return 1;
  if(S.cDay==='pick'&&S.cPickDate){
    const a=new Date(S.now); a.setHours(0,0,0,0);
    const b=new Date(S.cPickDate); b.setHours(0,0,0,0);
    return Math.max(0,Math.round((b-a)/DAY));
  }
  for(let d=0;d<14;d++) if(dayHasSomething(d)) return d;
  return 0;
}
function dayLabel(d){
  if(d===0) return 'today';
  if(d===1) return 'tomorrow';
  const b=new Date(S.now); b.setHours(0,0,0,0);
  const t=b.getTime()+d*DAY;
  return dow(t)+' '+new Date(t).getDate();
}
function activeCourtFilters(){
  let n=0;
  if(S.cTod!=='any')n++; if(S.cPrice<60)n++; if(S.cTravel<20)n++; if(S.cCourt!=='any')n++;
  return n;
}
/* the hours shown on a club card: cheapest option at each start, filters applied */
function clubStarts(club,d){
  const sports=CLUBS[club].sports.filter(sp=>S.sport==='all'||sp===S.sport);
  const best={};
  sports.forEach(sp=>{
    const dur=SPORTS[sp].dur[0];
    freeStarts(club,sp,dur,d).forEach(t=>{
      if(d===0&&t<=nowMin()+30) return;
      if(S.cTod!=='any'&&podOfMin(t)!==S.cTod) return;
      /* the club's price at this hour is its cheapest court still free */
      const cheap=courtsAt(club,sp,dur,d,t).reduce((a,c)=>
        (a&&payableOf(a,dur,t)<=payableOf(c,dur,t))?a:c, null);
      if(!cheap) return;
      const pay=payableOf(cheap,dur,t);
      if(pay>S.cPrice) return;
      if(S.cCardOnly&&cardStateOf(cheap,dur,t)==='none') return;
      if(!best[t]||pay<best[t].pay) best[t]={t:t,pay:pay,sport:sp,dur:dur,
        price:courtPriceOf(cheap,dur,t),card:cardStateOf(cheap,dur,t)};
    });
  });
  return Object.keys(best).map(k=>best[k]).sort((a,b)=>a.t-b.t);
}
function clubPasses(club){
  const C=CLUBS[club];
  if(S.sport!=='all'&&C.sports.indexOf(S.sport)<0) return false;
  if(C.dist>S.cTravel) return false;
  if(S.cCourt!=='any'){
    const want=S.cCourt==='indoor'?1:0;
    const has=COURTS.some(c=>c.club===club&&(S.sport==='all'||c.sport===S.sport)&&!!c.indoor===!!want);
    if(!has) return false;
  }

}
function courtPool(){
  const d=listDay(), out=[];
  Object.keys(CLUBS).forEach(id=>{
    if(!clubPasses(id)) return;
    const starts=clubStarts(id,d);
    if(starts.length) out.push({club:id,d:d,starts:starts,
      from:Math.min.apply(null,starts.map(x=>x.pay)),
      cheapest:starts.reduce((a,b)=>b.pay<a.pay?b:a)});
  });
  const key={soon:g=>g.starts[0].t,cheap:g=>g.from,near:g=>CLUBS[g.club].dist}[S.cSort||'soon'];
  return out.sort((a,b)=>key(a)-key(b)||a.starts[0].t-b.starts[0].t);
}

/* ---------------- time helpers ---------------- */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYSL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

function when(t,now){

function dur(ms){

  if(h>=24) return Math.floor(h/24)+'d '+(h%24)+'h';

function zl(v){return (v||0).toFixed(2).replace('.',',')+' zł';}
function lvl(v){return v==null?'—':v.toFixed(2).replace('.',',').replace('-','\u2212');}

/* ---------------- match deadlines & phase ---------------- */
function deadlines(m){
  const club=CLUBS[m.club];
  const clubDl = m.start - club.window*HOUR;
  const commit = Math.min(clubDl, m.start - 12*HOUR);
  const solo = SPORTS[m.sport].players===2;
  return {commit,
          rescue: m.start-(solo?6:4)*HOUR,   /* targeted 50/50 invitations open */
          check:  m.start-2*HOUR,            /* T-2h: two different meanings, see below */
          joinCut:m.start-(club.joinCut||30)*60e3,  /* the club's own online joining cutoff */
          play:   m.start, solo};
}
/* ---------------- court certainty ----------------
   1-2 players: visible, no court held.  3 players (or a full singles): a compatible
   court is reserved and a private booking can no longer consume it.               */
/* ==================================================================
   COURT HOLD LADDER
   ------------------------------------------------------------------
   A court is not held because a match exists. It is held in proportion
   to how sure we are that the match will happen \u2014 and that bar rises
   as play approaches, because a court is worth more to the club the
   less time it has left to sell it.

       full            held unconditionally, and it is a hard booking
       one short       held while more than 4 hours remain
       two paid        held while more than 12 hours remain
       fewer           not held; the club keeps selling it

   The ladder runs in one direction only in the sense that matters: a
   match that has ever COMMITTED never releases its court, whatever
   happens to the seat count afterwards. Everything below commitment is
   reversible, and deliberately so \u2014 a court released at 3 of 4 can be
   reserved again the moment a fourth player pays.
   ================================================================== */
const HOLD_FAR=12, HOLD_NEAR=4;              /* hours before play */

function courtHold(m){
  const n=m.n, f=filled(m), left=(m.start-S.now)/HOUR;
  if(m.kind==='private')     return {kind:'hard', why:'private', label:'Booked'};
  if(m.courtLocked)          return {kind:'hard', why:'club',    label:'Committed by the club'};
  if(m.committedAt!=null)    return {kind:'hard', why:'committed',label:'Reserved'};
  if(f>=n)                   return {kind:'hard', why:'full',    label:'Reserved'};
  if(n>2){
    if(f>=n-1) return left>HOLD_NEAR
      ? {kind:'soft', why:'near', need:n-1, until:HOLD_NEAR, releaseAt:m.start-HOLD_NEAR*HOUR,
         label:'Held', note:'held until '+HOLD_NEAR+'h before play'}
      : {kind:'none', why:'nearLapsed', need:n, label:'Released',
         note:'inside '+HOLD_NEAR+'h, a court is only held for a complete match'};
    if(f>=2) return left>HOLD_FAR
      ? {kind:'soft', why:'far', need:2, until:HOLD_FAR, releaseAt:m.start-HOLD_FAR*HOUR,
         label:'Held', note:'held until '+HOLD_FAR+'h before play'}
      : {kind:'none', why:'farLapsed', need:n-1, label:'Released',
         note:'inside '+HOLD_FAR+'h, two paid seats are no longer enough'};
  }
  return {kind:'none', why:'thin', need:n>2?2:n, label:'Not held'};
}
/* kept as the question most of the app actually asks */
function isProtected(m){ return courtHold(m).kind!=='none'; }
function isHardHold(m){ return courtHold(m).kind==='hard'; }
function protectThreshold(m){ return Math.min(3,m.n); }

/* ---- the club calendar, with Rakieta's own matches on it ----
   bookings() invents the club's other business without knowing that open
   matches sit on the same courts. Left alone the two contradict: every
   padel court at Zab\u0142ocie reads as privately booked at 18:30 on the very
   evening the demo runs a match there. So each open match is ANCHORED to
   one court in its category, a generated booking never sits on top of an
   anchor, and a court a match is actually holding is unavailable to
   everybody else. */
function matchDay(m){
  const a=new Date(S.now), b=new Date(m.start);
  return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())
                    -new Date(a.getFullYear(),a.getMonth(),a.getDate()))/DAY);
}
function matchMin(m){const b=new Date(m.start);return b.getHours()*60+b.getMinutes();}
function anchorOf(m){const cs=categoryCourts(m);return cs.length?cs[0].id:null;}
function overlapsMatch(x,d,start,dur){
  if(x.clubCancelled||x.forced) return false;
  if(matchDay(x)!==d) return false;
  const s=matchMin(x);
  return start<s+x.dur && s<start+dur;
}
/* is this court available to THIS match at its own slot? */
function courtOpenFor(m,cid){
  const d=matchDay(m), st=matchMin(m), du=m.dur;
  const held=Object.keys(S.matches).map(k=>S.matches[k]).some(x=>
    x!==m && x.courtId===cid && overlapsMatch(x,d,st,du));
  if(held) return false;
  if(m.courtId===cid) return true;
  const anchored=Object.keys(S.matches).map(k=>S.matches[k]).some(x=>
    anchorOf(x)===cid && overlapsMatch(x,d,st,du));
  if(anchored) return true;                       /* the demo world reserved it for open play */
  return courtFree(cid,d,st,du);
}
/* the courts this match could still be put on, right now */
function openCourtsFor(m){ return categoryCourts(m).filter(c=>courtOpenFor(m,c.id)); }
function pickCourt(m){ const cs=openCourtsFor(m); return cs.length?cs[0].id:null; }
/* ---------------- commitment ----------------
   The clock alone never commits anybody. Money commits when the deadline has passed
   AND every seat is paid. A match that fills after the deadline commits on the spot. */
function committedNow(m){
  if(m.kind==='private') return S.now>=deadlines(m).commit;
  if(m.committedAt!=null) return true;
  return S.now>=deadlines(m).commit && isFull(m);
}
/* the seat count that has ever been reached, so a late leaver does not un-commit it */
function everFull(m){ return m.committedAt!=null || isFull(m); }
function filled(m){return m.seats.filter(s=>s.p&&s.paid).length;}
function isFull(m){return m.seats.every(s=>s.p&&s.paid);}
function mySeat(m){return m.seats.find(s=>s.p==='me');}
function phase(m){
  const d=deadlines(m);
  if(m.clubCancelled) return 'cancelled';
  if(S.now>=d.play) return 'played';
  if(!committedNow(m)) return 'free';        /* nothing is at stake yet */
  if(S.now>=d.rescue) return 'rescue';
  return 'search';
}
/* money settles at commitment, and only for a funded match */
/* money reaches the club when the match commits, and a match commits only when the
   deadline has passed AND every seat is paid */
function settledNow(m){
  if(m.settledAmount!=null) return true;
  return committedNow(m);
}
function heldTotal(m){return m.seats.filter(s=>s.paid).length*m.share;}

/* ---------------- outcome-based refunds ----------------
   The refund is never decided by a clock. It is decided by how the seat is finally
   resolved, and it stays open while any search is still running.                  */
const REFUND={
  full:    {pc:100, label:'A player pays the full price'},
  rescue:  {pc:50,  label:'A 50/50 Rescue player pays'},
  guest:   {pc:0,   label:'A sponsored guest uses the seat'},
  nobody:  {pc:0,   label:'Nobody replaces you'},
  club:    {pc:100, label:'The club cancels the match'},
  weather: {pc:100, label:'Accepted weather cancellation'}
};
function refundTable(m){
  const rows=[['full',REFUND.full],['rescue',REFUND.rescue],['guest',REFUND.guest],['nobody',REFUND.nobody]];
  return rows.map(r=>[r[1].label, r[1].pc, Math.round(m.share*r[1].pc)/100]);
}
/* what leaving right now is worth, and what it could still become */
function leaveOutcome(m){
  const d=deadlines(m);
  if(m.clubCancelled) return {kind:'club', back:m.share, pc:100, label:'100% back'};
  if(!committedNow(m)) return {kind:'reversal', back:m.share, pc:100,
    label: isFull(m)?'reversed in full \u2014 the deadline has not passed'
                    :'reversed in full \u2014 the match is not complete'};
  if(S.now < d.rescue) return {kind:'full', back:m.share, pc:100, label:'if a player pays full price'};
  return {kind:'rescue', back:m.share/2, pc:50, label:'if a Rescue player pays'};
}
/* Rescue exists only for a seat that was confirmed and then vacated late (doc 7) */
function rescueEligible(m){ return rescueCore(m); }
/* how much of a split private court the owner is still standing behind */
function ownerGuarantee(m){
  if(m.kind!=='private') return 0;
  if(m.payModel!=='split') return 0;
  return Math.round((m.n-filled(m))*m.share*100)/100;
}
function rescueCore(m){
  const d=deadlines(m);
  return !!m.vacated                 /* a previously confirmed player left        */
      && everFull(m)                 /* the match had actually reached full       */
      && m.committedAt!=null         /* and it was committed when they left       */
      && !m.rescueTaken              /* no full-price replacement has joined      */
      && S.now>=d.rescue             /* the targeted phase has opened             */
      && S.now<d.joinCut;            /* and the club still accepts online joins   */
}

/* ---------------- engine ---------------- */
function lv(p,sport){const P=PLAYERS[p]||S.me; return (P.lv&&P.lv[sport])?P.lv[sport]:null;}
function teamStrength(a,b){
  if(b==null) return a;
  return 0.45*Math.max(a,b)+0.55*Math.min(a,b);
}
/* three ways to split four players; returns best */
function bestPairing(vals){
  if(vals.length<4) return {a:vals[0],b:vals[1],gap:Math.abs(vals[0]-vals[1]),opts:[]};
  const idx=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  const opts=idx.map(pr=>{
    const A=teamStrength(vals[pr[0][0]],vals[pr[0][1]]), B=teamStrength(vals[pr[1][0]],vals[pr[1][1]]);
    return {pair:pr,A:A,B:B,gap:Math.abs(A-B)};
  }).sort((x,y)=>x.gap-y.gap);
  return {a:opts[0].A,b:opts[0].B,gap:opts[0].gap,opts:opts};
}
/* ==================================================================
   LINE-UP
   A private court is played with people you chose, so the pairing is a
   decision rather than an output. These helpers score an arrangement
   the player picked, instead of the one the optimiser would pick.
   Seats 0 and 1 are your side; 2 and 3 are the other side.
   ================================================================== */
const FRIENDS=['kuba','ola','marek','ania','zofia','piotr','ewa','michal'];
function friendsFor(sport){return FRIENDS.filter(id=>lv(id,sport));}
const LINK='~link';
/* the level that would balance the match if the link place is claimed by that person */
function linkTarget(sport,ids){
  const i=ids.indexOf(LINK);
  if(i<0 || ids.filter(x=>x===LINK).length!==1 || ids.some(x=>!x)) return null;
  const known=ids.map(x=>x===LINK?null:(lv(x,sport)||[null])[0]);
  if(known.some((v,k)=>k!==i&&v==null)) return null;
  const solo=SPORTS[sport].players===2;
  let best=null;
  for(let v=1;v<=5.0001;v=Math.round((v+0.01)*100)/100){
    const t=known.slice(); t[i]=v;
    const A=solo?t[0]:teamStrength(t[0],t[1]);
    const B=solo?t[1]:teamStrength(t[2],t[3]);
    const g=Math.abs(A-B);
    if(!best||g<best.g-1e-9) best={g:g,v:v};
  }
  return best?best.v:null;
}
function arrangedForecast(sport,ids){
  const solo=SPORTS[sport].players===2;
  if(ids.some(x=>!x)) return null;                       /* an empty place: nothing to compare */
  const links=ids.filter(x=>x===LINK).length;
  if(links>1) return null;                               /* two unknowns has no single answer */
  let prov=false, tgt=null;
  if(links===1){ tgt=linkTarget(sport,ids); if(tgt==null) return null; prov=true; }
  const L=ids.map(i=>i===LINK?[tgt,0.30,40,0]:lv(i,sport)); if(L.some(x=>!x)) return null;
  const A=solo?L[0][0]:teamStrength(L[0][0],L[1][0]);
  const B=solo?L[1][0]:teamStrength(L[2][0],L[3][0]);
  const sp=Math.sqrt(L.reduce((a,x)=>a+x[1]*x[1],0));
  const gap=Math.abs(A-B);
  const pct=Math.max(35,Math.min(96,Math.round(100-gap*145-sp*32)));
  const fav=Math.min(86,50+gap*72.5);
  return {A:A,B:B,gap:gap,pct:pct,conf:sp<0.28?'high':sp<0.42?'medium':'low',
          youShare:Math.round(B>A?100-fav:fav), provisional:prov, target:tgt};
}
/* the arrangement the optimiser would choose, as an ordering of the same four people */
function bestArrangement(sport,ids){
  if(SPORTS[sport].players===2||ids.some(x=>!x)||ids.indexOf(LINK)>=0) return ids.slice();
  const L=ids.map(i=>(lv(i,sport)||[0])[0]);
  const orders=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  let best=null;
  orders.forEach(o=>{
    const A=teamStrength(L[o[0]],L[o[1]]), B=teamStrength(L[o[2]],L[o[3]]);
    const g=Math.abs(A-B);
    if(!best||g<best.g) best={g:g,o:o};
  });
  return best.o.map(i=>ids[i]);
}
/* the roster the forecast runs on: everyone seated, plus you if you are the prospective joiner */
function rosterFor(m){
  const ps=m.seats.filter(s=>s.p).map(s=>s.p);
  if(!mySeat(m) && ps.length<m.n) ps.push('me');
  return ps;
}
function canForecast(m){return rosterFor(m).length>=m.n;}
function forecast(m){
  if(!canForecast(m)) return null;               /* not enough people to be a match yet */
  const ps=rosterFor(m);
  const ids=ps.slice();
  const vals=ps.map(p=>{const l=lv(p,m.sport); return l?l[0]:null;}).filter(v=>v!=null);
  const sig=ps.map(p=>{const l=lv(p,m.sport); return l?l[1]:.25;});
  if(vals.length<2) return null;
  const bp=bestPairing(vals);
  const sp=Math.sqrt(sig.reduce((a,s)=>a+s*s,0));
  const pct=Math.max(35,Math.min(96,Math.round(100-bp.gap*145-sp*32)));
  /* who ends up on which side, with you always on side A */
  let sideA, sideB;
  if(vals.length>=4 && bp.opts.length){
    const pr=bp.opts[0].pair;
    sideA=pr[0].map(i=>ids[i]); sideB=pr[1].map(i=>ids[i]);
    if(!sideA.includes('me') && sideB.includes('me')){
      const t=sideA;sideA=sideB;sideB=t;
    }
  } else { sideA=[ids[0]]; sideB=[ids[1]]; if(ids[1]==='me'){sideA=[ids[1]];sideB=[ids[0]];} }
  const sA=teamStrength(...sideA.map(i=>{const l=lv(i,m.sport);return l?l[0]:null;}));
  const sB=teamStrength(...sideB.map(i=>{const l=lv(i,m.sport);return l?l[0]:null;}));
  const conf = sp<0.28?'high':sp<0.42?'medium':'low';
  /* How the bar is split.
     It has to be the SAME calculation as the percentage beside it, or the card
     contradicts itself: the balance formula docks `gap x 145` for the gap, so half
     of that, `gap x 72,5`, is exactly how far the favourite sits from the middle.
     The identity holds by construction:
         pct = 100 - 2 x (favourite% - 50) - spread x 32
     The rating engine keeps its own steeper constant, because "what is a win worth"
     is a different question from "how one-sided will this feel". */
  const fav = Math.min(86, 50 + bp.gap*72.5);
  const youShare = Math.round(sB>sA ? 100-fav : fav);
  const counts=ids.map(i=>{const l=lv(i,m.sport);return l?l[3]:0;});
  return {youShare:youShare,A:sA,B:sB,gap:Math.abs(sA-sB),pct:pct,opts:bp.opts,
          unsure:sp>0.42,n:vals.length,sideA:sideA,sideB:sideB,spread:sp,conf:conf,
          minCounted:Math.min(...counts)};
}
/* target level for the open seat: the value that minimises the gap */
const projected=forecast;
/* A single target level only exists when adding one player completes the roster.
   With two or more seats open the problem is under-determined, so we return null
   and callers fall back to targetBand(). */
function seatTarget(m){
  const seated=m.seats.filter(s=>s.p).map(s=>{const l=lv(s.p,m.sport);return l?l[0]:null;}).filter(v=>v!=null);
  if(seated.length!==m.n-1) return null;
  if(SPORTS[m.sport].players===2) return seated[0];
  let best=null,bg=99;
  for(let v=1.0;v<=5.0;v+=0.01){
    const f=bestPairing(seated.concat([v]));
    if(f.gap<bg-1e-9){bg=f.gap;best=v;}
  }
  return best!=null?Math.round(best*100)/100:null;
}
/* the band a still-forming match is aimed at, from whoever is already in */
function targetBand(m){
  const seated=m.seats.filter(s=>s.p).map(s=>{const l=lv(s.p,m.sport);return l?l[0]:null;}).filter(v=>v!=null);
  if(!seated.length) return null;
  const avg=seated.reduce((a,b)=>a+b,0)/seated.length;
  return [Math.round((avg-0.2)*100)/100, Math.round((avg+0.2)*100)/100];
}
function matchFit(m){
  const myL=lv('me',m.sport);
  if(!myL) return {score:null, terms:[], reasons:[]};
  const tgt=seatTarget(m)||(targetBand(m)?(targetBand(m)[0]+targetBand(m)[1])/2:myL[0]);
  const club=CLUBS[m.club];
  const others=m.seats.filter(s=>s.p&&s.p!=='me').map(s=>PLAYERS[s.p]).filter(Boolean);
  const scores=others.map(p=>p.score);
  const overlap=Math.max(0,1-Math.abs(myL[0]-tgt)/0.55);
  const proj=projected(m);
  const bal=proj?proj.pct/100:0.7;
  const rel=scores.length?(0.5*Math.min(...scores)+0.5*(scores.reduce((a,b)=>a+b,0)/scores.length))/100:0.8;
  const travel=Math.max(0,1-Math.max(0,club.dist-20)/18);
  const inten=m.counts?1:0.72;
  const price=Math.max(0,Math.min(1,1-(payable(m)-30)/30));
  const pref=0.9;
  const terms=[
    ['Skill overlap',30,overlap, (function(){
       if(seatTarget(m)!=null) return 'The open seat needs about '+lvl(seatTarget(m))+' · you are '+lvl(myL[0]);
       if(isFull(m)){
         const ls=m.seats.filter(x=>x.p).map(x=>(lv(x.p,m.sport)||[null])[0]).filter(v=>v!=null);
         const lo=Math.min(...ls), hi=Math.max(...ls);
         if(hi-lo<=0.18) return 'Levels overlap almost exactly · '+lvl(lo)+' to '+lvl(hi);
         if(myL[0]>=hi) return 'You are the strongest here by '+lvl(myL[0]-ls.filter(v=>v<hi).reduce((a,b)=>Math.max(a,b),0));
         if(myL[0]<=lo) return 'You are the lowest here, by '+lvl(ls.filter(v=>v>lo).reduce((a,b)=>Math.min(a,b),9)-myL[0]);
         return 'Your '+lvl(myL[0])+' sits inside the group\u2019s '+lvl(lo)+'–'+lvl(hi);
       }
       return 'This match is aimed at '+(targetBand(m)?lvl(targetBand(m)[0])+'–'+lvl(targetBand(m)[1]):'your band')+' · you are '+lvl(myL[0]);
     })()],
    ['Predicted balance',20,bal,proj?('Forecast '+proj.pct+'% with you in it'):'Not enough players in yet to forecast'],
    ['Group reliability',15,rel,scores.length?('Lowest Player Score here is '+Math.min(...scores)):'No one else yet'],
    ['Time and travel',15,travel,club.dist+' minutes away'],
    ['Match type',8,inten,m.counts?'Counted, as you prefer':'Friendly — you usually play counted'],
    ['Price vs your ceiling',7,price,'Your share is '+zl(payable(m))+', ceiling 45 zł'],
    ['Preferences and side',5,pref,'Left side open · you play left']
  ];
  let sc=terms.reduce((a,t)=>a+t[1]*t[2],0);
  const mods=[];
  if(m.badge==='Promotion'){sc+=8;mods.push(['+8','qualifies for your ladder']);}
  const REGULARS=['kuba','ola'];
  const known=others.filter(p=>REGULARS.includes(p.id)).length;
  if(known===0&&others.length){sc+=5;mods.push(['+5','opponents you have not played']);}
  else if(others.length>=3&&known===others.length){sc-=8;mods.push(['\u22128','the same four again']);}
  sc=Math.max(20,Math.min(99,Math.round(sc)));
  const rank=terms.slice().sort((a,b)=>(b[1]*b[2])-(a[1]*a[2]));
  const reasons=rank.slice(0,3).map(t=>t[3]);
  const warn=rank[rank.length-1][2]<0.55?rank[rank.length-1][3]:null;
  return {score:sc,terms:terms,mods:mods,reasons:reasons,warn:warn,target:tgt};
}
/* what a counted result would do to your level */
function atStake(m,f){
  if(!m.counts||!f) return null;
  const myL=lv('me',m.sport); if(!myL) return null;
  const exp=1/(1+Math.pow(10,(f.B-f.A)/0.6));
  const K=0.30*(1-myL[2]/100)+0.08;
  return {win:Math.round(K*(1-exp)*100)/100, lose:Math.round(-K*exp*100)/100, fav:exp>0.5};
}
/* ---------------- the balance block ----------------
   The bar is the predicted split of the match, not the gap. The side more likely to
   win is the side drawn longer, which is the only direction a player would ever guess.
   The percentage beside it is a different question — how EVEN the match is — so it is
   given the size that question deserves rather than being a footnote on the bar. */
function balWord(p){return p>=85?'Very even':p>=70?'Fairly even':p>=55?'One side favoured':'Lopsided';}
function balTone(p){return p>=70?'var(--mint)':p>=55?'var(--amber)':'var(--red)';}
function balanceBlock(m,f){
  const solo=SPORTS[m.sport].players===2;
  const you=f.youShare, w=Math.max(14,Math.min(86,you));
  const even=Math.abs(you-50)<=2;
  const favUs=you>50;
  const favName=solo?(favUs?'You are':sideNames(f.sideB)+' is')
                    :(favUs?'Your side is':sideNames(f.sideB)+' are');
  const sentence = even ? 'Neither side is favoured.' : favName+' slightly ahead.';
  return `<div class="balbar" style="margin-top:9px">
      <i style="width:${w}%;background:var(--night)">${w>=22?(solo?'You':'Your side'):''}</i>
      <i style="flex:1;background:var(--night2);opacity:.72">${100-w>=22?'Them':''}</i></div>
    <div class="hair" style="margin-top:9px;padding-top:9px;display:flex;align-items:center;gap:12px">
      <span class="num" style="font-size:28px;line-height:1;color:${balTone(f.pct)}">${f.pct}%</span>
      <span style="flex:1;min-width:0"><b style="font-size:12px">${balWord(f.pct)}</b>
        <span class="tiny" style="display:block;margin-top:1px">${sentence}</span></span></div>`;
}
/* names only — the sentence under the bar does not need the levels repeated */
function sideNames(ids){
  return ids.map(i=>i==='me'?'You':(PLAYERS[i]?PLAYERS[i].n.split(' ')[0]:'the open seat')).join(' + ');
}
function sideLine(ids,sport){
  return ids.map(i=>{const P=i==='me'?{n:'You'}:PLAYERS[i]; const l=lv(i,sport);
    return (P?(i==='me'?'You':P.n.split(' ')[0]):'Open seat')+' '+lvl(l?l[0]:null);}).join(' + ');
}

/* what the card takes off, and what you actually pay */
function cardOff(m){
  const v=CLUBS[m.club].card[m.sport];
  if(v==null) return 0;
  if(v==='full') return m.share;
  return Math.min(m.share, v);
}
function payable(m){return Math.max(0, m.share - cardOff(m));}
/* ==================================================================
   Find filters
   ================================================================== */
function sameDay(a,b){const x=new Date(a),y=new Date(b);
  return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function partOfDay(t){const h=new Date(t).getHours();
  return h<12?'morning':h<17?'afternoon':'evening';}
function activeFilters(){
  let n=0;
  if(S.timeOfDay!=='any')n++; if(S.durs.length)n++; if(S.price<45)n++; if(S.travel<20)n++;
  if(S.court!=='any')n++; if(S.fmtF!=='any')n++; if(S.intensity!=='any')n++; if(S.minScore)n++;
  return n;
}
function passes(m){
  if(S.sport!=='all' && m.sport!==S.sport) return false;
  if(S.day==='today' && !sameDay(m.start,S.now)) return false;
  if(S.day==='tom' && !sameDay(m.start,S.now+DAY)) return false;
  if(S.day==='pick' && S.pickDate && !sameDay(m.start,S.pickDate)) return false;
  if(S.timeOfDay!=='any' && partOfDay(m.start)!==S.timeOfDay) return false;
  if(S.durs.length && !S.durs.includes(m.dur)) return false;
  if(payable(m)>S.price) return false;
  if(CLUBS[m.club].dist>S.travel) return false;
  if(S.court!=='any'){
    const indoor=/indoor|glass|parquet|Mondo/i.test(CLUBS[m.club].court);
    if(S.court==='indoor'&&!indoor) return false;
    if(S.court==='outdoor'&&indoor) return false;
  }
  if(S.fmtF!=='any' && m.fmt!==S.fmtF) return false;
  if(S.intensity==='counted' && !m.counts) return false;
  if(S.intensity==='friendly' && m.counts) return false;
  if(S.cardOnly && cardOff(m)<=0) return false;
  /* Reliability is filtered on attendance itself, not on the composite Player Score.
     The composite folds in opponent variety and result confirmation, so its live range
     sits between about 87 and 99 for everyone who is not already excluded — a threshold
     there cannot discriminate. Attendance runs the full 70–100. */
  if(S.minScore){
    const sc=m.seats.filter(x=>x.p).map(x=>(PLAYERS[x.p]||{score:100}).score);
    if(sc.length && Math.min(...sc)<SCORE_MIN) return false;
  }
  return true;
}
function findPool(){
  return Object.values(S.matches).filter(m=>!m.forced&&!mySeat(m)&&m.start>S.now&&!m.clubCancelled&&passes(m));
}

/* ==================================================================
   Components
   ================================================================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function glyph(sport,seats,w,dark){
  const h=w*(sport==='Squash'?.62:.56), pad=w*.05;
  const fill=dark?'rgba(255,255,255,.1)':'#EEF2F1', ln=dark?'rgba(255,255,255,.3)':'#D8DFDD',
        on=dark?'#fff':'#0A3441';
  let pos;
  if(sport==='Squash') pos=[[w*.38,h*.62],[w*.62,h*.42]];
  else if(seats.length===2) pos=[[w*.22,h*.5],[w*.78,h*.5]];
  else pos=[[w*.21,h*.3],[w*.21,h*.72],[w*.79,h*.3],[w*.79,h*.72]];
  const net = sport==='Squash'
    ? `<line x1="${pad}" y1="${h*.55}" x2="${w-pad}" y2="${h*.55}" stroke="${ln}" stroke-width="1.2"/>`
    : `<line x1="${w/2}" y1="${pad}" x2="${w/2}" y2="${h-pad}" stroke="${ln}" stroke-width="1.4"/>`+
      `<line x1="${w*.3}" y1="${pad}" x2="${w*.3}" y2="${h-pad}" stroke="${ln}" stroke-width=".8"/>`+
      `<line x1="${w*.7}" y1="${pad}" x2="${w*.7}" y2="${h-pad}" stroke="${ln}" stroke-width=".8"/>`;
  const dots=pos.map((p,i)=>{const s=seats[i];
    if(s==='me') return `<circle cx="${p[0]}" cy="${p[1]}" r="${w*.082}" fill="#E8482B"/>`;
    if(s==='g')  return `<circle cx="${p[0]}" cy="${p[1]}" r="${w*.075}" fill="none" stroke="${on}" stroke-width="1.6"/>`;
    if(s) return `<circle cx="${p[0]}" cy="${p[1]}" r="${w*.075}" fill="${on}"/>`;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${w*.075}" fill="none" stroke="#E8482B" stroke-width="1.4" stroke-dasharray="2.5 2.5"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="${pad}" y="${pad}" width="${w-pad*2}" height="${h-pad*2}" rx="4" fill="${fill}" stroke="${ln}"/>${net}${dots}</svg>`;
}
function ring(v,size,stroke,color,track,inner){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,v))/100);
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${inner}</div></div>`;
}
/* The level bar. Four things at once, which is why it earns the space: the
   four named bands across the whole 1,00-5,00 scale, the span of the
   player's own likely range, the coral mark at their level, and the band
   they landed in.

   The bands and the range live on SEPARATE rows. They were stacked, and a
   grey bar sitting on top of four coloured segments hid exactly the thing
   the segments were there to show. Now the band track is the reference
   scale, and the range hangs underneath it as a bracket with end caps, so
   you can read "my range spills out of Established into Developing" in one
   glance instead of decoding an overlap. */
const LEVEL_BANDS=[{k:'new',n:'New',lo:1.0,hi:1.55,c:'var(--muted)',t:'#9AA8AD',d:'#7E8C92'},
                   {k:'developing',n:'Developing',lo:1.55,hi:2.65,c:'var(--info)',t:'#7FB3CC',d:'#4E8FAE'},
                   {k:'established',n:'Established',lo:2.65,hi:3.85,c:'var(--mint)',t:'#6FC5A8',d:'#3FA184'},
                   {k:'advanced',n:'Advanced',lo:3.85,hi:5.0,c:'var(--coral)',t:'#F0A08A',d:'#D9714F'}];
function bandBar(l,dark,opts){
  if(!l) return '';
  opts=opts||{};
  const lo=1.0,hi=5.0,w=hi-lo;
  const pc=v=>Math.max(0,Math.min(100,(v-lo)/w*100));
  const mu=l[0], sg=l[1]||0;
  const c=pc(mu), b1=pc(mu-sg), b2=pc(mu+sg), bw=Math.max(1.5,b2-b1);
  const here=LEVEL_BANDS.filter(x=>mu>=x.lo&&mu<x.hi)[0]||LEVEL_BANDS[3];
  const rangeC=dark?'rgba(255,255,255,.72)':'#5C6B70';
  const TR=6, RY=TR+7;                                  /* track height, range row y */

  /* the band track: each band in its own colour, the one you are in at full
     strength, the others held back so the eye lands in the right place */
  const segs=LEVEL_BANDS.map((x,i)=>{
    const on=x.k===here.k;
    const col=dark?(on?x.t:x.d):(on?x.t:x.t);
    return `<div style="position:absolute;top:0;left:${pc(x.lo)}%;width:${pc(x.hi)-pc(x.lo)}%;height:${TR}px;
      background:${col};opacity:${on?1:(dark?.42:.38)};
      ${i?'border-left:1px solid '+(dark?'rgba(11,31,42,.55)':'#fff'):''}"></div>`;}).join('');

  /* the likely range, on its own row, as a bracket */
  const range=`<div style="position:absolute;top:${RY}px;left:${b1}%;width:${bw}%;height:8px">
    <div style="position:absolute;top:3px;left:0;right:0;height:2px;border-radius:1px;background:${rangeC}"></div>
    <div style="position:absolute;top:0;left:0;width:2px;height:8px;border-radius:1px;background:${rangeC}"></div>
    <div style="position:absolute;top:0;right:0;width:2px;height:8px;border-radius:1px;background:${rangeC}"></div></div>`;

  const labels=opts.labels?LEVEL_BANDS.map(x=>{const on=x.k===here.k;
    return `<div style="position:absolute;top:${RY+11}px;left:${(pc(x.lo)+pc(x.hi))/2}%;transform:translateX(-50%);
      font-size:8px;letter-spacing:.05em;text-transform:uppercase;font-weight:${on?800:600};white-space:nowrap;
      color:${on?(dark?'#fff':'var(--ink)'):(dark?'rgba(255,255,255,.42)':'var(--muted)')}">${x.n}</div>`;}).join(''):'';

  /* the legend exists because the bracket and the printed "likely range" are
     the same object, and nothing on screen said so */
  const legend=opts.legend?`<div style="display:flex;gap:13px;margin-top:5px">
    <span style="display:flex;align-items:center;gap:5px">
      <i style="width:3px;height:11px;border-radius:2px;background:var(--coral);display:block"></i>
      <span class="tiny" style="color:${dark?'rgba(255,255,255,.72)':'var(--muted)'}">your level</span></span>
    <span style="display:flex;align-items:center;gap:5px">
      <i style="width:15px;height:8px;position:relative;display:block">
        <i style="position:absolute;top:3px;left:0;right:0;height:2px;background:${rangeC};display:block"></i>
        <i style="position:absolute;top:0;left:0;width:2px;height:8px;background:${rangeC};display:block"></i>
        <i style="position:absolute;top:0;right:0;width:2px;height:8px;background:${rangeC};display:block"></i></i>
      <span class="tiny" style="color:${dark?'rgba(255,255,255,.72)':'var(--muted)'}">your likely range</span></span></div>`:'';
  const h=opts.labels?RY+22:RY+10;
  return `<div style="margin-top:${opts.tall?12:9}px"><div style="position:relative;height:${h}px">
   <div style="position:absolute;top:0;left:0;right:0;height:${TR}px;border-radius:3px;overflow:hidden;
     background:${dark?'rgba(255,255,255,.10)':'var(--line2)'}">${segs}</div>
   <div style="position:absolute;top:-3px;left:${c}%;width:3px;height:${TR+6}px;border-radius:2px;
     background:var(--coral);margin-left:-1.5px;box-shadow:0 0 0 2px ${dark?'var(--night)':'#fff'}"></div>
   ${range}${labels}</div>${legend}</div>`;
}
function scoreTag(v){return `<span class="tag ${v>=90?'ok':v>=70?'':'bad'}">${v}</span>`;}
function formDots(f,dark){

/* ==================================================================
   Your position on the clock
   A piecewise scale: the three zones get fixed widths so the last
   four hours are readable next to three days of forming.
   ================================================================== */
const TL_A=34, TL_B=26, TL_C=22;   /* free · full-price · rescue · past the checkpoint
   the last zone carries its own label now, so it needs width the old split did not leave */
function tlPos(t,m){
  const d=deadlines(m), c=m.created;
  if(t<=c) return 0;
  if(t<=d.commit) return TL_A*(t-c)/(d.commit-c);
  if(t<=d.rescue) return TL_A+TL_B*(t-d.commit)/(d.rescue-d.commit);
  if(t<=d.check)  return TL_A+TL_B+TL_C*(t-d.rescue)/(d.check-d.rescue);
  if(t<=d.play)   return TL_A+TL_B+TL_C+(100-TL_A-TL_B-TL_C)*(t-d.check)/(d.play-d.check);
  return 100;
}
/* The zone is about commitment, not about the clock: an incomplete match sits in
   zone 0 however late it is, because nothing has been committed.               */
function tlZone(m){
  const d=deadlines(m);
  if(S.now>=d.play) return 4;
  if(!committedNow(m)) return 0;
  if(S.now>=d.check) return 3;
  if(S.now>=d.rescue) return 2;
  return 1;
}
function tlZones(m){
  const reb=CLUBS[m.club].rebooking;
  return [
   ['Free to leave','Everything back, in minutes. Nothing commits until the deadline has passed AND the match is complete','var(--mint)'],
   ['Full-price search','Everything back when a player pays the normal price','var(--coral)'],
   ['50/50 Rescue','Half back when a Rescue player takes it. Invitations are targeted, never a public sale','var(--amber)'],
   ['Final certainty checkpoint', reb
      ? CLUBS[m.club].n+' offers protected rebooking: the match is cancelled, the three who stayed are credited at the club, and you forfeit your share'
      : CLUBS[m.club].n+' is a standard club: the match stays alive, Rescue runs on to '+hm(deadlines(m).joinCut)+', and the group may bring a guest or play a player short','var(--red)']
  ];
}
function timeline(m,full){
  const d=deadlines(m), z=tlZone(m);
  const cur=Math.max(0,Math.min(100,tlPos(S.now,m)));
  const lab=cur<14?{l:0,t:'none',a:'left'}:cur>86?{l:100,t:'translateX(-100%)',a:'right'}:{l:cur,t:'translateX(-50%)',a:'center'};
  const marks=[[0,'opened',dow(m.created)+' '+hm(m.created),'left',''],
               [TL_A,'commitment',dow(d.commit)+' '+hm(d.commit),'mid',''],
               [TL_A+TL_B,'rescue',hm(d.rescue),'mid',''],
               [TL_A+TL_B+TL_C,'checkpoint',hm(d.check),'mid','var(--red)'],
               [100,'play',hm(d.play),'right','var(--mint)']];
  const seg=(l,w,c,dim)=>`<div style="position:absolute;left:${l}%;width:${w}%;top:0;height:8px;background:${c};opacity:${dim?.26:1};${l===0?'border-radius:4px 0 0 4px;':''}${l+w>=100?'border-radius:0 4px 4px 0;':''}"></div>`;
  const reb=CLUBS[m.club].rebooking;
  const now=[
    isFull(m)
      ? `Leaving now returns your ${zl(m.share)} in minutes — the deadline has not passed, so nothing is committed yet.`
      : `Leaving now returns your ${zl(m.share)} in minutes — an incomplete match commits nobody, whatever the clock says.`,
    `Your ${zl(m.share)} stays on your seat. It comes back in full the moment somebody pays ${zl(m.share)} for it.`,
    `Rescue invitations are out. ${zl(m.share/2)} comes back if a standby player takes the seat at half price.`,
    reb ? `The checkpoint passed at ${hm(d.check)}. The match was cancelled, the others were credited at the club, and your share paid for that.`
        : `The checkpoint passed at ${hm(d.check)}. The match is still on — Rescue runs to ${hm(d.joinCut)}, so ${zl(m.share/2)} is still possible.`,
    `This match has been played.`][z];
  return `<div class="${full?'':'card tap'}" ${full?'':`data-go="position" data-id="${m.id}"`} style="${full?'':'padding:12px'}">
    ${full?'':`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <span class="eyebrow">If you can't make it</span><span style="color:var(--muted);font-size:13px">›</span></div>`}
    <div style="position:relative;height:52px;margin-top:8px">
      <div style="position:absolute;left:${lab.l}%;top:0;transform:${lab.t};white-space:nowrap">
        <span class="mono" style="font-size:9px;font-weight:700;background:var(--ink);color:#fff;padding:3px 7px;border-radius:5px;display:inline-block">NOW · ${hm(S.now)}</span></div>
      <div style="position:absolute;left:0;right:0;top:22px;height:8px;border-radius:4px;background:var(--line2);overflow:hidden">
        ${seg(0,TL_A,'var(--mint)',z!==0)}${seg(TL_A,TL_B,'var(--coral)',z!==1)}${seg(TL_A+TL_B,TL_C,'var(--amber)',z!==2)}${seg(TL_A+TL_B+TL_C,100-TL_A-TL_B-TL_C,'var(--red)',z!==3)}
      </div>
      <div style="position:absolute;left:${TL_A+TL_B+TL_C}%;top:19px;height:14px;width:2px;background:var(--red);border-radius:1px;transform:translateX(-1px)"></div>
      <div style="position:absolute;left:${cur}%;top:18px;height:16px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-1px)"></div>
      <div style="position:absolute;left:${cur}%;top:15px;width:9px;height:9px;border-radius:5px;background:var(--ink);border:2px solid #fff;transform:translateX(-4.5px)"></div>
      <div style="position:absolute;left:0;right:0;top:36px;height:16px">
        ${marks.map(x=>{const tf=x[3]==='left'?'none':x[3]==='right'?'translateX(-100%)':'translateX(-50%)';
          const ta=x[3]==='left'?'left':x[3]==='right'?'right':'center';
          return `<div style="position:absolute;left:${x[0]}%;transform:${tf};text-align:${ta}">
            <div style="font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:${x[4]||'var(--muted)'};font-weight:700;line-height:1.2">${x[1]}</div>
            <div class="mono" style="font-size:9px;color:${x[4]||'var(--muted)'};line-height:1.2">${x[2]}</div></div>`;}).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:9px;
      background:${['var(--mint-soft)','var(--coral-soft)','var(--amber-soft)','var(--red-soft)','var(--line2)'][z]};margin-top:16px">
      <span style="width:8px;height:8px;border-radius:4px;flex-shrink:0;margin-top:3px;
        background:${['var(--mint)','var(--coral)','var(--amber)','var(--red)','var(--muted)'][z]};display:block"></span>
      <span style="font-size:11.5px;line-height:1.4;color:var(--ink);flex:1">${now}</span></div>
    ${full?`<div style="margin-top:12px">
      ${tlZones(m).map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;${i?'border-top:1px solid var(--line2)':''};opacity:${i===z?1:.48}">

        <span style="flex:1"><span style="font-size:11.5px;font-weight:700;display:block">${x[0]}${i===1?' · from '+hm(d.commit):i===2?' · from '+hm(d.rescue):i===3?' · from '+hm(d.check):''}${i===z?' <span class="tag hot">you are here</span>':''}</span>
        <span class="tiny">${x[1]}</span></span></div>`).join('')}
      <div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)">
        <span style="width:4px;height:26px;border-radius:2px;background:var(--muted);flex-shrink:0;display:block"></span>
        <span style="flex:1"><span style="font-size:11.5px;font-weight:700;display:block">Our cancellation fee, in every zone</span>

    const open=pool.filter(m=>filled(m)<m.n).map(m=>({m:m,f:matchFit(m)}));
    const full=pool.filter(m=>isFull(m)).map(m=>({m:m,f:matchFit(m)}))
      .filter(x=>x.f.score!=null&&x.f.score>=80).sort((a,b)=>b.f.score-a.f.score).slice(0,3);
    const even=open.filter(x=>x.f.score!=null&&x.f.score>=80).sort((a,b)=>b.f.score-a.f.score);
    const stretch=open.filter(x=>x.f.score!=null&&x.f.score<80).sort((a,b)=>b.f.score-a.f.score);
    if(even.length){h+=`<div class="sect">Even matches</div>`;even.forEach(x=>h+=matchCard(x.m));}
    if(full.length){
      h+=`<div class="sect">Full — worth waiting for</div>
        <div class="tiny" style="margin-bottom:8px">These fit you as well as anything above, and seats do come free. Joining a waitlist costs nothing and commits to nothing.</div>`;
      full.forEach(x=>h+=matchCard(x.m));
    }
    if(stretch.length){
      h+=`<div class="sect">Above your band</div>
        <div class="tiny" style="margin-bottom:8px">Since these matches are above your level, joining is a request — the host decides, and nothing is charged until they accept.</div>`;
      stretch.forEach(x=>h+=matchCard(x.m));
    }
    if(!pool.length) h+=`<div class="card"><div class="empty"><b>Nothing matches that</b>Widen the day or clear a filter — or create a match yourself and let the engine fill it.
      <div class="row" style="justify-content:center;margin-top:11px"><button class="btn s" style="height:30px;font-size:11px" data-act="resetf">Clear filters</button></div></div></div>`;
  } else {
    h+=V.courts();
  }
  return h;
};

        <span class="tag hot" data-act="invite" data-id="${m.id}">Invite</span></div>`).join('')}
    <div class="tiny hair">Press and hold anyone to open their record — level, form, and how they have behaved. The number on the right is the Player Score, one figure across all four sports.</div></div>`;
  /* money */
  const off=cardOff(m), pay=payable(m), out=leaveOutcome(m);
  /* the private owner's own block */
  if(iOwn){
    const guar=ownerGuarantee(m), open=m.openSeats||0;
    h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">You own this booking</div>

      <div class="tiny hair">Joining costs nothing and commits nothing. You are only charged if you take a seat.</div></div>`;

  return h;

    <span style="width:34px;height:20px;border-radius:99px;background:var(--mint);position:relative;display:block">
      <span style="position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff"></span></span></div>`;
  h+=`<div class="card">
    <div class="rl"><span>Your share of the court</span><b class="mono">${zl(m.share)}</b></div>
