/* ==================================================================
   PART V37 — WHAT THE INTENT POOL NEEDS FROM THIS APP
   ------------------------------------------------------------------
   The club console's intent engine reads ten fields. v36 collected
   eight of them and had no way to edit any: "Add" pushed a hardcoded
   declaration and that was that. Three things were genuinely missing:

     · preferred distance — the engine tiers on it, primary and
       secondary, and never excludes on it
     · the explicit opt-in — which is the privacy boundary, not a
       preference. Without it a player is counted anonymously in
       general demand and can never be named or contacted.
     · a completion state — because the reason to ask for any of this
       is that a fuller profile produces better proposals, and the
       player should be told exactly that rather than nagged.

   And one thing was wrong: none of it was reachable except by
   digging into the You tab, so almost nobody would ever have filled
   it in. Onboarding now asks once, briefly, and skippably.
   ================================================================== */

/* ---------- 1 · the contract, mirrored from the engine ---------- */
const IFIELDS=[
  {k:'sport', n:'Sport',                 req:1, w:'Which game. Without it nothing can be matched at all.'},
  {k:'lv',    n:'Level band',            req:1, w:'Taken from your rating. Nobody types this, including you.'},
  {k:'opt',   n:'Proposals switched on', req:1, w:'Without it you are counted, never named. No club can be given your name or contacted about you.'},
  {k:'days',  n:'Days',                  req:0, w:'Left blank, any day is possible \u2014 weaker signal, but never a reason to leave you out.'},
  {k:'hours', n:'Hours',                 req:0, w:'Left blank, any hour the club is open.'},
  {k:'freq',  n:'Games a week',          req:0, w:'How much you actually want. Left blank, we assume one.'},
  {k:'ceil',  n:'Most per seat',         req:0, w:'Left blank, you are eligible at any price the club sets.'},
  {k:'within',n:'How far ahead',         req:0, w:'How far in advance you will commit. Left blank, we assume a fortnight.'},
  {k:'km',    n:'How far you will go',   req:0, w:'A strong preference, never a wall \u2014 something further out is offered second, not hidden.'},
  {k:'kind',  n:'Competitive or social', req:0, w:'A weight on who you are put with, not a filter.'}
];
function iHave(i){
  return {sport:!!i.sport, lv:!!i.lv, opt:S.optIn===true||S.optIn===false,
    days:!!(i.days&&i.days.length), hours:i.from!=null&&i.to!=null,
    freq:i.freq!=null, ceil:i.ceil!=null, within:i.within!=null,
    km:i.km!=null, kind:!!i.kind};
}
function iComplete(i){
  const h=iHave(i), n=IFIELDS.filter(f=>h[f.k]).length;
  return {pct:Math.round(n/IFIELDS.length*100), n:n, have:h,
          missing:IFIELDS.filter(f=>!h[f.k])};
}
function profilePct(){
  if(!S.intent||!S.intent.length) return S.optIn?10:0;
  return Math.round(S.intent.reduce((a,i)=>a+iComplete(i).pct,0)/S.intent.length);
}

  }
  let h=_vonboard();
  /* the last rating screen hands off here instead of straight into the app */
  h=h.replace('data-act="obfinish">Start finding matches',
              'data-act="obgo" data-v="proposals">Continue');
  return h;
};
const _obFresh=obFresh;
obFresh=function(){ const o=_obFresh(); o.optIn=null; return o; };
ACT.obopt=(el)=>{ S.ob.optIn=el.dataset.v==='1'; render(); };
const _obfinish=ACT.obfinish;
ACT.obfinish=()=>{
  const chose=S.ob?S.ob.optIn:null;
  _obfinish();
  S.optIn=chose===true;                 /* null (skipped) is not consent */
  if(chose===true) toast('Proposals on \u2014 you can change this any time','ok');
};

  const groups=[
   ['Playing',[['passport','Skill Passport','Levels, bands, confidence and your ladder'],

     ['queue','Queues','Contested hours, and how each club allocates them']]],
   ['At your clubs',[['member','Membership','Tiers, entitlements and what each is worth'],
     ['prog','Programmes','Coaching at your level'],
     ['openplay','Open Play','Sessions where everybody plays everybody'],
     ['comps','Competitions','Leagues, ladders and americanos'],
     ['groups','Groups','The club’s own community'],
     ['club','Zabłocie Sport','Profile, rules, cancellation and documents']]],
   ['Money and account',[['wallet','Money','Balance, wallet, refunds and every reference'],
     ['card','Sports card','QR check-in and what it is worth per sport'],
     ['settings','Settings','Defaults, channels and auto-find'],
     ['privacy','Safety and privacy','Blocking, notes, visibility and your data']]]];
  const n=reqOpen().length;
  if(n) h+=`<div class="card tap" data-go="requests" style="border-color:var(--coral);display:flex;align-items:center;gap:10px">
    <span style="width:4px;align-self:stretch;border-radius:2px;background:var(--coral);display:block;min-height:34px"></span>

  h+=groups.map(g=>`<div class="sect">${g[0]}</div><div class="card" style="padding:2px 12px">${g[1].map((r,i)=>
