/* ==================================================================
   CANCELLATION FLOW  (model document, section 15)
   1 status  ·  2 options  ·  3 confirmation  ·  4 live status
   ================================================================== */
V.cancel=function(){
  const m=S.matches[cur().id], d=deadlines(m), out=leaveOutcome(m);
  const free=!committedNow(m);
  let h=head("I can't make it",`${when(m.start)} \u00b7 ${CLUBS[m.club].n}`,true);

  /* ---- screen 1 · where this match stands ---- */
  h+=`<div class="card" style="padding:11px">
    <div class="eyebrow" style="margin-bottom:5px">Where this match stands</div>
    <div class="rl"><span>Match</span><b>${when(m.start)} \u00b7 ${hm(m.start)}</b></div>
    <div class="rl"><span>Your seat</span><b class="mono">${zl(payable(m))}</b></div>
    <div class="rl"><span>Commitment deadline</span><b class="mono">${dow(d.commit)} ${hm(d.commit)}
      <span class="tag ${S.now<d.commit?'ok':''}">${S.now<d.commit?'not passed':'passed'}</span></b></div>
    <div class="rl"><span>Match complete</span><b>${isFull(m)?'yes \u00b7 '+m.n+' of '+m.n:'no \u00b7 '+filled(m)+' of '+m.n}</b></div>
    <div class="rl"><span>Phase</span><b style="color:${free?'var(--mint)':S.now>=d.rescue?'var(--amber)':'var(--coral)'}">${
      free?'free cancellation':S.now>=d.check?'past the checkpoint':S.now>=d.rescue?'50/50 Rescue':'full-price search'}</b></div></div>`;

  if(free){
    h+=`<div class="note mint"><b>${isFull(m)?'The deadline has not passed yet':'This match is not complete'}</b>
      <span class="tiny">${isFull(m)
        ? 'Every seat is paid, but nothing settles to the club until '+hm(d.commit)+'. Leaving now is a reversal, not a refund.'
        : 'Money commits only when the deadline has passed AND every seat is paid. An incomplete match commits nobody, however late it is.'}</span></div>`;
    h+=`<div class="card">
      <div class="rl"><span>You paid</span><b class="mono">${zl(payable(m))}</b></div>
      <div class="rl"><span>Back to you</span><b class="mono" style="color:var(--mint)">${zl(payable(m))} \u00b7 100%</b></div>
      <div class="rl"><span>Our cancellation fee</span><b class="mono" style="color:var(--mint)">0,00 zł</b></div>
      <div class="rl"><span>Your Player Score</span><b style="color:var(--mint)">untouched</b></div>
      <div class="tiny hair">Your cancellation will be processed and your complete seat payment returned. Wallet money is
        returned immediately; a card refund is sent as soon as we process it and can take a few business days to appear
        on your statement \u2014 that part is your bank\u2019s, not ours.</div></div>`;
    h+=`<button class="btn p full" style="height:40px;margin-bottom:9px" data-act="doleave" data-id="${m.id}">Cancel my position \u00b7 ${zl(payable(m))} back</button>`;
    h+=`<div class="card tap" data-act="transfer" data-id="${m.id}"><div class="h2">Transfer my seat instead</div>
      <div class="tiny" style="margin-top:3px">Hand it to somebody you know at full price, or give it to them.</div></div>`;
    h+=`<button class="btn s full" style="margin-bottom:9px" data-act="back">Keep my seat</button>`;
    h+=`<div class="note"><b>You are leaving your seat, not the match</b><span class="tiny">No player can cancel an open
      match for everybody \u2014 not the person who created it either. Only four things end a match: it never completed,
      the certainty checkpoint at a club with rebooking, the club itself, or our own operational error.</span></div>`;
    return h;
  }

  /* ---- screen 2 · the refund is decided by the outcome, not by the clock ---- */
  h+=`<div class="note coral"><b>We will search for a replacement</b><span class="tiny">Your refund depends on how your
    seat is filled. The match was complete when the deadline passed at ${hm(d.commit)}, so ${zl(m.price)} settled to the
    club and your ${zl(payable(m))} stays on the seat until somebody takes it.</span></div>`;
  const rows=[
    ['A player pays the full '+zl(payable(m)),'100%',zl(payable(m)),'var(--mint)',
      S.now<d.rescue?'searching now':'still possible'],
    ['A 50/50 Rescue player pays '+zl(payable(m)/2),'50%',zl(m.share/2),'var(--amber)',
      S.now>=d.rescue?'invitations out':'opens '+hm(d.rescue)],
    ['You sponsor a guest onto the seat','0%','0,00 zł','var(--muted)','any time'],
    ['Nobody replaces you','0%','0,00 zł','var(--red)','if it reaches '+hm(d.joinCut)],
    ['The club or the weather cancels','100%',zl(payable(m)),'var(--mint)','overrides everything']
  ];
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:5px">Every possible outcome, and what it returns</div>
    ${rows.map(r=>`<div class="rl"><span style="font-size:11px">${r[0]}<br>
      <span class="tiny" style="color:${/now|out/.test(r[4])?'var(--coral)':'var(--muted)'}">${r[4]}</span></span>
      <b class="mono" style="color:${r[3]};text-align:right">${r[1]}<br><span class="tiny">${r[2]}</span></b></div>`).join('')}
    <div class="rl"><span style="font-size:11px">Our cancellation fee</span><b class="mono" style="color:var(--mint)">0,00 zł</b></div></div>`;
  h+=`<div class="note"><b>Nothing is decided at the checkpoint</b><span class="tiny">The refund is not fixed to zero at
    ${hm(d.check)}. If a Rescue player joins after it but before ${hm(d.joinCut)}, you still get 50% back.</span></div>`;
  h+=`<button class="btn p full" style="height:40px;margin-bottom:9px" data-act="doleave" data-id="${m.id}">Search for a replacement</button>`;
  h+=`<div class="card tap" data-act="transfer" data-id="${m.id}"><div class="h2">Transfer my seat</div>
    <div class="tiny" style="margin-top:3px">A person you name always pays the full price, or is given the seat outright.</div></div>`;
  h+=`<button class="btn s full" style="margin-bottom:9px" data-act="back">Keep my seat</button>`;
  h+=`<div class="note"><b>You are leaving your seat, not the match</b><span class="tiny">No player can cancel an open
    match for everybody \u2014 not the person who created it either. Only four things end a match: it never completed,
    the certainty checkpoint at a club with rebooking, the club itself, or our own operational error.</span></div>`;
  return h;
};

V.transfer=function(){
  const m=S.matches[cur().id];
  let h=head('Transfer my seat',`${when(m.start)} \u00b7 ${CLUBS[m.club].n}`,true);
  h+=`<div class="card tap" style="border:2px solid var(--coral)" data-act="dotransfer" data-id="${m.id}" data-mode="full">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div class="h2">They pay the full price</div><span class="mono num" style="font-size:15px">${zl(m.share)}</span></div>
    <div class="rl"><span>Back to you</span><b class="mono" style="color:var(--mint)">${zl(m.share)} \u00b7 100%</b></div>
    <div class="tiny" style="margin-top:6px">They become the official participant: the chat, the check-in, the level change and the result all belong to them.</div></div>`;
  h+=`<div class="card tap" data-act="dotransfer" data-id="${m.id}" data-mode="gift">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div class="h2">You sponsor them</div><span class="mono num" style="font-size:15px">0,00 zł</span></div>
    <div class="rl"><span>Back to you</span><b class="mono">0,00 zł \u00b7 0%</b></div>
    <div class="tiny" style="margin-top:6px">The seat is already funded, so a guest can simply use it. One-minute sign-up, the club and match rules accepted, and the match goes ahead.</div></div>`;
  return h;
};

/* ---- screen 4 · live replacement status ---- */
V.search=function(){
  const m=S.matches[cur().id], d=deadlines(m);
  const inRescue=S.now>=d.rescue, past=S.now>=d.check;
  let h=head('Finding your replacement',`${when(m.start)} \u00b7 ${CLUBS[m.club].n}`,true);
  h+=`<div class="card-n">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="eyebrow">${inRescue?'50/50 Rescue active':'Full-price search active'}</div>
        <div class="num" style="font-size:26px;margin-top:3px;color:${inRescue?'var(--amber)':'var(--volt)'}">${inRescue?'50%':'100%'}</div>
        <div class="tiny" style="margin-top:2px">current possible refund \u00b7 ${zl(inRescue?m.share/2:m.share)}</div></div>
      ${ring(inRescue?50:100,44,4,inRescue?'var(--amber)':'var(--volt)','rgba(255,255,255,.18)','')}</div>
    <div class="hair"><div class="tiny" style="color:rgba(255,255,255,.92)">
      ${inRescue?'Targeted invitations are out to standby players in waves. It is not advertised as a public sale.'
                :'The seat is on the marketplace at the normal '+zl(payable(m))+'. Nothing is discounted yet.'}</div></div></div>`;
  const stages=[
    ['Seat reopened at full price',hm(m.vacatedAt||d.commit),'done'],
    ['18 compatible players notified',hm((m.vacatedAt||d.commit)+2*60e3),'done'],
    ['50/50 Rescue invitations \u00b7 wave 1',hm(d.rescue),inRescue?'done':'next'],
    ['Wave 2 \u00b7 nearby reliable standby',hm(d.rescue+20*60e3),inRescue&&S.now>=d.rescue+20*60e3?'done':'next'],
    ['Wave 3 \u00b7 wider level and distance',hm(d.rescue+40*60e3),'next'],
    ['Final certainty checkpoint',hm(d.check),past?'done':'next'],
    ['Club joining cutoff \u00b7 the search ends',hm(d.joinCut),'next']
  ];
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:6px">What happens, and when</div>
    ${stages.map(x=>`<div class="rl"><span style="font-size:11px;color:${x[2]==='done'?'var(--ink)':'var(--muted)'}">
      ${x[2]==='done'?'\u2713 ':'\u25cb '}${x[0]}</span><b class="mono tiny">${x[1]}</b></div>`).join('')}</div>`;
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:5px">Who is invited, in order</div>
    ${[['1','Standby players who asked for this exact match'],
       ['2','Players with last-minute availability switched on'],
       ['3','Players who asked for the seat before'],
       ['4','Players who viewed or followed the match'],
       ['5','Compatible players who use this club often'],
       ['6','Nearby reliable players inside the level range'],
       ['7','Players marked available at this hour']].map(r=>
      `<div class="rl"><span style="font-size:11px"><b class="mono">${r[0]}</b> \u00b7 ${r[1]}</span></div>`).join('')}
    <div class="tiny hair">Ten minutes to accept, five to pay, then the offer moves to the next candidate. Nobody can sit on it.</div></div>`;
  h+=`<div class="note"><b>What actually triggers your refund</b><span class="tiny">Both things, in this order: a
    replacement payment succeeds, <i>and</i> the seat transfers to them. Somebody opening the payment screen does not
    count, and nothing is released on a payment that fails or times out.</span></div>`;
  h+=`<div class="note"><b>If more than one player leaves</b><span class="tiny">Each seat is handled on its own. Two
    departures mean two searches and two independent outcomes \u2014 one can be refunded in full while the other is not.
    The players who stayed never inherit either seat.</span></div>`;
  h+=`<div class="note"><b>You are not being asked to do anything</b><span class="tiny">This screen exists so you can watch it happen. Nobody has to chase anybody, and the other three were told their price does not change.</span></div>`;
  return h;
};

V.resolved=function(){
  const m=S.matches[cur().id], t=cur();
  if(t.mode==='reversal'){
    let h=head('Reversed, not refunded',`${when(m.start)} · ${CLUBS[m.club].n}`,true);
    h+=`<div class="card-n"><div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="eyebrow">Already back</div>
        <div class="num" style="font-size:28px;margin-top:3px;color:var(--volt)">${zl(m.share)}</div>
        <div class="tiny" style="margin-top:3px">Reversed at ${hm(S.now)} · four minutes</div></div>
      ${ring(100,46,4,'var(--volt)','rgba(255,255,255,.18)','<span class="mono num" style="font-size:10px">done</span>')}</div>
      <div class="hair"><div class="tiny" style="color:rgba(255,255,255,.92)">No guaranteed date needed. There was nothing to wait for.</div></div></div>`;
    h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Why it was this fast</div>
      <div class="tiny">Your ${zl(m.share)} had not reached the club yet — it settles at the commitment deadline, not when you pay. So the charge was cancelled rather than refunded, and there was no bank cycle to sit through.</div></div>`;
    h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Ledger</div>
      <div class="rl"><span>Payment reversed <span class="tiny">REV-2291</span></span><b class="mono" style="color:var(--mint)">+${zl(m.share)}</b></div>
      <div class="rl"><span>BLIK payment · was held <span class="tiny">PAY-9C02-T7</span></span><b class="mono">−${zl(m.share)}</b></div>
      <div class="rl"><span>Our cancellation fee</span><b class="mono" style="color:var(--mint)">0,00 zł</b></div></div>`;
    h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">What the others saw</div>
      <div class="tiny">Their card went back to <b>Court reserved — replacement pending</b>, with their own price restated as unchanged. Nobody was asked to vote and nothing was cancelled.</div></div>`;
    h+=`<div class="note info"><b>After ${dow(deadlines(m).commit)} ${hm(deadlines(m).commit)} this screen cannot exist</b><span class="tiny">The money is the club's by then, and only another player brings it back.</span></div>`;
    h+=`<button class="btn n full" data-act="home">Back to Now</button>`;
    return h;
  }
  const half=t.mode==='rescue';
  const back=half?m.share/2:(t.mode==='gift'?0:m.share);
  let h=head(half?'Rescue Seat taken':'Seat taken',`${when(m.start)} · ${CLUBS[m.club].n}`,true);
  h+=`<div class="note mint"><b>${t.who} took the seat</b><span class="tiny">${zl(back)} refunded to your BLIK${back?' · guaranteed by '+dowl(S.now+DAY)+' 12:00':''}. The match is confirmed again and the other players were never asked for anything.</span></div>`;
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Where your ${zl(m.share)} went</div>
    <div class="rl"><span>You paid</span><b class="mono">${zl(m.share)}</b></div>
    <div class="rl"><span>Refunded to you</span><b class="mono" style="color:var(--mint)">${back?'+'+zl(back):zl(0)}</b></div>
    <div class="rl"><span>Stayed on your seat</span><b class="mono">${zl(m.share-back)}</b></div>
    <div class="rl"><span>${t.who} paid</span><b class="mono">${zl(half?m.share/2:(t.mode==='gift'?0:m.share))}</b></div>
    <div class="rl"><span>Club receives, unchanged</span><b class="mono">${zl(m.price)}</b></div></div>`;
  const impact = t.mode==='gift'?'small':half?'moderate':'very small';
  h+=`<div class="card"><div class="tiny">Player Score effect: <b>${impact}</b> — ${half?'a discount was needed to fill it.':t.mode==='gift'?'you solved it yourself.':'you reported it early enough for a full-price replacement.'}</div></div>`;
  h+=`<button class="btn n full" data-act="home">Back to Now</button>`;
  return h;
};

/* ---- the final certainty checkpoint · two policies, one screen ---- */
V.nofill=function(){
  const m=S.matches[cur().id], d=deadlines(m), reb=CLUBS[m.club].rebooking;
  let h=head(reb?'This match was cancelled':'The checkpoint has passed',
             `${when(m.start)} \u00b7 ${CLUBS[m.club].n}`,true);
  h+=`<div class="note ${reb?'coral':''}"><b>${hm(d.check)} \u00b7 the seat was still empty</b><span class="tiny">
    We searched from the moment it opened: at the full ${zl(payable(m))} first, then with targeted 50/50 invitations
    from ${hm(d.rescue)}. Nobody took it, so the final certainty checkpoint was reached.</span></div>`;

function qr(){
  let s='',seed=7;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){
    seed=(seed*1103515245+12345)%2147483648;
    const corner=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    const on=corner?((x%6===0||y%6===0)||(x>1&&x<5&&y>1&&y<5)||(x>15&&x<19&&y>1&&y<5)||(x>1&&x<5&&y>15&&y<19)):(seed%100<46);
    if(on) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0A3441"/>`;
  }
  return s;
}

/* ---------------- creating a match ----------------
   The order of the questions is not cosmetic. Sport decides which courts exist,
   duration decides which start times exist, and only then can a calendar be drawn
   that never offers an hour the club cannot actually complete.                 */
const GENDER={me:'m',kuba:'m',ola:'f',zofia:'f',marek:'m',ania:'f',piotr:'m',michal:'m',ewa:'f'};
const WHO=[['anyone','Anyone'],['men','Men'],['women','Women'],['mixed','Mixed']];
function whoRule(who,sport){
  const dbl=SPORTS[sport].players===4;
  return {anyone:'Open to everybody who fits the level.',
          men:'Only men can take a seat.',
          women:'Only women can take a seat.',
          mixed:dbl?'One man and one woman on each side. The engine pairs to satisfy it.'
                   :'One man and one woman.'}[who];
}
/* ---------------- the level range ----------------
   An open match is one the host will play in, so the range has to stay around them.
   Each edge moves within 0,35 of their own level — the width at which the deck's own
   thresholds call a match one-sided — and never closer than 0,10, or nobody fits.
   The default is the host's own band, clamped into those limits.               */
const LV_REACH=0.35, LV_MIN_HALF=0.10, LV_STEP=0.05;
function r05(v){return Math.round(Math.round(v/LV_STEP)*LV_STEP*100)/100;}
function crLimits(sport){
  const L=lv('me',sport)||[2.7,0.2];
  const my=L[0], band=L[1];
  return {my:my, band:band,
          minLo:r05(my-LV_REACH), minHi:r05(my-LV_MIN_HALF),
          maxLo:r05(my+LV_MIN_HALF), maxHi:r05(my+LV_REACH)};
}
function crDefaultRange(sport){
  const q=crLimits(sport);
  return {lvMin:Math.round(Math.min(q.minHi,Math.max(q.minLo,r05(q.my-q.band)))*100)/100,
          lvMax:Math.round(Math.max(q.maxLo,Math.min(q.maxHi,r05(q.my+q.band)))*100)/100};
}
function crStart(club,d,t,mode){
  const C=CLUBS[club];
  const sport=C.sports.filter(sp=>S.sport==='all'||sp===S.sport)[0]||C.sports[0];
  const rng=crDefaultRange(sport);
  S.cr={mode:mode||(S.cr&&S.cr.mode)||'open',
        club:club,sport:sport,dur:SPORTS[sport].dur[0],cat:categoriesFor(club,sport)[0],
        who:'anyone',type:'comp',gate:true,outside:true,payModel:'all',
        lvMin:rng.lvMin, lvMax:rng.lvMax, accepted:false, acceptWarn:false,
        day:d,start:t,court:null};
  crFix();
}
/* ==================================================================
   OVERLAP AWARENESS
   ------------------------------------------------------------------
   Nothing stops four people creating four open matches for the same
   club, sport and hour. Each one is legitimate; together they are the
   worst outcome available. Four matches at one paid seat each will all
   fail, where one match at four seats would have played \u2014 and if they
   do start filling they hold four separate courts on the hold ladder,
   which is the club\u2019s scarcest evening inventory spent on the same
   sixteen people twice over.

   The cost of duplication is DEMAND FRAGMENTATION first and court
   blocking second. So this never blocks a creation: it makes the
   already-open match the easier thing to tap.
   ================================================================== */
const SIM_WINDOW=120;   /* minutes either side of the proposed start   */
const SIM_TIGHT=45;     /* inside this, it is effectively the same slot */
const SIM_FLOOR=50;     /* below this Match Fit it is not an alternative */
const MAX_RAIL=6;       /* cards on the rail before handing off to Find        */

/* a draft is not a match, but the court engine only reads four fields */
function crDraft(c){
  return {start:slotStart(c.day,c.start), dur:c.dur, courtId:null,
          club:c.club, sport:c.sport, category:c.cat, n:SPORTS[c.sport].players,
          seats:[], kind:'open'};
}

/* open matches this creation would be competing with, best first */
function similarOpen(c){
  if(!c || c.mode==='private' || c.start==null || c.day==null) return [];
  const out=[];
  Object.keys(S.matches).forEach(k=>{
    const m=S.matches[k];
    if(m.kind!=='open'||m.forced||m.clubCancelled||m.inventoryLost) return;
    if(mySeat(m)) return;                       /* already in it            */
    if(m.sport!==c.sport) return;
    if(matchDay(m)!==c.day) return;
    if(seatsLeft(m)<1) return;                  /* nothing to join          */
    if(S.now>=deadlines(m).joinCut) return;     /* the club has closed it   */
    const dt=Math.abs(matchMin(m)-c.start);
    if(dt>SIM_WINDOW) return;
    const sameClub=m.club===c.club;
    if(!sameClub && CLUBS[m.club].dist>S.cTravel) return;
    const f=matchFit(m), fit=f?f.score:0;
    if(fit<SIM_FLOOR) return;                   /* not a real alternative   */
    out.push({m:m, dt:dt, sameClub:sameClub, fit:fit, tight:dt<=SIM_TIGHT&&sameClub});
  });
  /* the same slot at the same club first, then how good it is for this player */
  return out.sort((a,b)=> (b.tight-a.tight) || (b.sameClub-a.sameClub) || (b.fit-a.fit) || (a.dt-b.dt));
}

/* how contested this exact slot is, in courts rather than matches */
function crowding(c){
  if(!c || c.start==null) return null;
  const draft=crDraft(c);
  const all=COURTS.filter(x=>x.club===c.club && x.sport===c.sport &&
                             (c.mode==='private'||!c.cat||x.surf===c.cat));
  const free=all.filter(x=>courtOpenFor(draft,x.id)).length;
  const wanting=Object.keys(S.matches).map(k=>S.matches[k]).filter(m=>
    m.kind==='open'&&!m.forced&&!m.clubCancelled&&!m.inventoryLost&&
    m.club===c.club&&m.sport===c.sport&&matchDay(m)===c.day&&
    Math.abs(matchMin(m)-c.start)<=SIM_TIGHT&&seatsLeft(m)>0).length;
  return {courts:all.length, free:free, wanting:wanting,
          /* one more match than there are free courts is the point at which
             creating another one starts costing somebody their evening */
          tight: wanting>0 && free<=wanting};
}

/* ---- the whole picture, not just a list ----
   One overlapping match is a suggestion. Seven is a different situation, and
   showing seven cards would be worse than showing none. So the engine groups
   them, counts the seats rather than the matches, and produces a verdict the
   screen can change shape around. */
function otherDayOptions(c){
  if(!c || c.start==null) return [];
  const out=[];
  [0,1,2,3,4,5,6].forEach(d=>{
    if(d===c.day) return;
    const probe=Object.assign({},c,{day:d});
    const sim=similarOpen(probe).filter(x=>x.sameClub && Math.abs(matchMin(x.m)-c.start)<=90);
    if(!sim.length) return;
    const cw=crowding(probe);
    out.push({day:d, n:sim.length, seats:sim.reduce((a,x)=>a+seatsLeft(x.m),0),
              best:sim[0], free:cw?cw.free:0, tight:cw?cw.tight:false,
              /* how far demand exceeds supply on that day; lower is calmer */
              pressure:cw?(cw.wanting-cw.free):0});
  });
  /* a different day is only worth offering if it is genuinely calmer than this
     one. Sending somebody from one contested morning to another is noise. */
  const here=crowding(c), mine=here?(here.wanting-here.free):0;
  return out.filter(x=>x.pressure<mine).sort((a,b)=>(a.pressure-b.pressure)||(b.best.fit-a.best.fit)).slice(0,2);
}

function overlapPicture(c){
  const all=similarOpen(c);
  const crowd=crowding(c);
  if(!all.length) return {n:0, verdict:'none', all:all, crowd:crowd, tight:[], near:[], away:[],
                          seats:0, other:[], saturated:false};
  const tight=all.filter(x=>x.tight);
  const near=all.filter(x=>!x.tight && x.sameClub);
  const away=all.filter(x=>!x.sameClub);
  const seats=all.reduce((a,x)=>a+seatsLeft(x.m),0);
  /* saturated is stronger than tight: more matches want this hour than there are
     courts, by enough that somebody is certainly going to lose one */
  const saturated=!!(crowd && crowd.wanting>crowd.free && crowd.wanting>=2);
  return {n:all.length, all:all, tight:tight, near:near, away:away, seats:seats,
          crowd:crowd, other:otherDayOptions(c), saturated:saturated,
          verdict: all.length===1?'one' : all.length<=3?'few' : 'busy'};
}

/* how many similar matches sit on each day, for the calendar squares */
function crSimilarByDay(){
  const c=S.cr, out={};
  if(!c||c.mode==='private') return out;
  [0,1,2,3,4,5,6].forEach(d=>{
    const probe=Object.assign({},c,{day:d,start:c.start!=null?c.start:PEAK});
    out[d]=similarOpen(probe).filter(x=>x.sameClub).length;
  });
  return out;
}

function crStarts(d){
  const c=S.cr;
  let st=freeStarts(c.club,c.sport,c.dur,d,c.mode==='private'?null:c.cat);
  if(d===0) st=st.filter(t=>t>nowMin()+30);
  return st;
}
function crFix(){
  const c=S.cr; if(!c||!c.club) return;
  if(CLUBS[c.club].sports.indexOf(c.sport)<0) c.sport=CLUBS[c.club].sports[0];
  if(SPORTS[c.sport].dur.indexOf(c.dur)<0) c.dur=SPORTS[c.sport].dur[0];
  const cats=categoriesFor(c.club,c.sport);
  if(cats.indexOf(c.cat)<0) c.cat=cats[0];
  /* a change of sport is a change of level, so the range follows it */
  if(c.lvSport!==c.sport){const r=crDefaultRange(c.sport);c.lvMin=r.lvMin;c.lvMax=r.lvMax;c.lvSport=c.sport;}
  let starts=crStarts(c.day);
  if(!starts.length) for(let dd=0;dd<14;dd++){
    const st=crStarts(dd); if(st.length){c.day=dd;starts=st;break;}
  }
  if(starts.indexOf(c.start)<0){
    if(c.start==null) c.start = starts.length?starts[0]:null;
    else {
      /* a change of sport or length should move you as little as possible */
      const later=starts.filter(t=>t>=c.start);
      c.start = starts.length ? (later.length?later[0]:starts[starts.length-1]) : null;
    }
  }
  const cs=c.start!=null?courtsAt(c.club,c.sport,c.dur,c.day,c.start,c.mode==='private'?null:c.cat):[];
  if(!cs.some(x=>x.id===c.court)) c.court=cs.length?cs[0].id:null;
}
/* The squares the booking covers. A 60-minute match starting at 10:00 covers
   10:00, 10:30 and 11:00 — two half-hour blocks and the mark it finishes on. The
   closing mark is drawn hollow, because it is a boundary rather than time you own:
   the next player may legitimately start there.                                  */
function crSpan(){
  const c=S.cr; if(c.start==null) return [];
  const out=[]; for(let t=c.start;t<=c.start+c.dur;t+=30) out.push(t);
  return out;
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:15px;font-weight:700;letter-spacing:-.02em">${C.n}</div>
        <div class="tiny" style="margin-top:2px">${C.km} km \u00b7 ${C.dist} min \u00b7 free cancellation until ${C.window}h before</div></div>
      <span class="tag ${priv?'':'hot'}">${priv?'Private':'Open'}</span></div></div>`;

  h+=`<div style="margin-bottom:11px"><div class="flab">Sport</div>
    <div class="row">${C.sports.map(x=>`<button class="chip ${x===c.sport?'on':''}" data-act="crsport" data-v="${x}"><i style="background:${SPORTS[x].c}"></i>${x}</button>`).join('')}</div></div>`;

  h+=`<div style="margin-bottom:11px"><div class="flab">How long</div>
    <div class="seg">${SPORTS[c.sport].dur.map(x=>
      `<span class="${x===c.dur?'on':''}" data-act="crdur" data-v="${x}">${x} min</span>`).join('')}</div></div>`;

  /* ---------- an Open Match buys a CATEGORY, a Private Court buys a COURT ---------- */
  if(!priv){
    const cats=categoriesFor(c.club,c.sport);
    h+=`<div style="margin-bottom:11px"><div class="flab">Court category</div>
      <div class="row">${cats.map(x=>`<button class="chip ${x===c.cat?'on':''}" data-act="crcat" data-v="${x}">${x}</button>`).join('')}</div>
      <div class="tiny" style="margin-top:5px">A compatible court is assigned automatically as the match fills. You never
        pick a court number, and the seat price cannot change when the court is chosen.</div></div>`;
  }

  h+=`<div style="margin-bottom:11px"><div class="flab">Who can join</div>
    <div class="seg">${WHO.map(x=>
      `<span class="${x[0]===c.who?'on':''}" data-act="crwho" data-v="${x[0]}">${x[1]}</span>`).join('')}</div>
    <div class="tiny" style="margin-top:5px">${whoRule(c.who,c.sport)}</div></div>`;

  h+=`<div style="margin-bottom:11px"><div class="flab">Match type</div>
    <div class="seg">${[['comp','Competitive'],['fun','Just for fun']].map(x=>
      `<span class="${c.type===x[0]?'on':''}" data-act="crtype" data-v="${x[0]}">${x[1]}</span>`).join('')}</div>
    <div class="tiny" style="margin-top:5px">${c.type==='fun'
      ?'The score is still recorded and Player Score still moves. Nobody\u2019s level changes.'
      :'A confirmed result moves everybody\u2019s level in '+c.sport.toLowerCase()+'.'}</div></div>`;

  if(!priv){
    const q=crLimits(c.sport), def=crDefaultRange(c.sport);
    const changed=Math.abs(c.lvMin-def.lvMin)>1e-9||Math.abs(c.lvMax-def.lvMax)>1e-9;
    const step=(dir,val,dis)=>`<button class="btn s" style="width:28px;height:28px;padding:0;font-size:14px;
      ${dis?'opacity:.35':''}" data-act="crlv" data-v="${dir}">${val}</button>`;
    h+=`<div class="card" style="margin-bottom:11px;padding:11px">
      <div class="flab">Level range</div>
      <div style="display:flex;align-items:center;gap:7px">
        <div style="display:flex;align-items:center;gap:5px">
          ${step('min-','\u2212',c.lvMin<=q.minLo+1e-9)}
          <span class="mono num" style="font-size:16px;width:42px;text-align:center">${lvl(c.lvMin)}</span>
          ${step('min+','+',c.lvMin>=q.minHi-1e-9)}</div>
        <span style="flex:1;height:3px;border-radius:2px;background:var(--night);opacity:.22"></span>
        <div style="display:flex;align-items:center;gap:5px">
          ${step('max-','\u2212',c.lvMax<=q.maxLo+1e-9)}
          <span class="mono num" style="font-size:16px;width:42px;text-align:center">${lvl(c.lvMax)}</span>
          ${step('max+','+',c.lvMax>=q.maxHi-1e-9)}</div></div>
      <div class="tiny" style="margin-top:7px">Your level is <b class="mono" style="color:var(--ink)">${lvl(q.my)}</b>
        and your band is ${lvl(q.my-q.band)}\u2013${lvl(q.my+q.band)}, so the range opens there, rounded to the nearest
        step. Each edge can move to ${lvl(q.minLo)} and ${lvl(q.maxHi)} \u2014 no further, because you have to belong in
        your own match.
        ${changed?'<button style="text-decoration:underline;color:var(--coral);font-weight:600" data-act="crlvreset">Back to my band</button>':''}</div>
      <div class="rl" style="border-top:1px solid var(--line2);margin-top:9px;padding-top:9px;align-items:flex-start">
        <span style="flex:1;padding-right:10px"><b style="font-size:11.5px">Players outside the range may ask</b>
          <span class="tiny" style="display:block;margin-top:2px">They cannot take a seat directly \u2014 they send a request and you decide.</span></span>
        <button data-act="croutside" style="width:40px;height:23px;border-radius:99px;background:${c.outside?'var(--mint)':'var(--line)'};position:relative;display:block;flex-shrink:0">
          <span style="position:absolute;top:2.5px;${c.outside?'right':'left'}:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;display:block"></span></button></div>
      <div class="rl" style="border-top:1px solid var(--line2);padding-top:9px;align-items:flex-start">
        <span style="flex:1;padding-right:10px"><b style="font-size:11.5px">Only Player Score ${GATE_MIN}+</b>
          <span class="tiny" style="display:block;margin-top:2px">Players below ${GATE_MIN} still see the match \u2014 they just cannot take a seat.</span></span>
        <button data-act="crscore" style="width:40px;height:23px;border-radius:99px;background:${c.gate?'var(--mint)':'var(--line)'};position:relative;display:block;flex-shrink:0">
          <span style="position:absolute;top:2.5px;${c.gate?'right':'left'}:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;display:block"></span></button></div></div>`;
  }

  /* ---------- the calendar ---------- */
  const span=crSpan(), spanEnd=c.start!=null?c.start+c.dur:null;
  /* which days already have open matches like this one \u2014 shown on the square
     itself, so the player sees it before choosing rather than after */
  const simDay=crSimilarByDay();
  h+=`<div class="card" style="padding:11px;margin-bottom:11px">
    <div class="eyebrow" style="margin-bottom:7px">When</div>
    <div class="sqrow" style="margin-bottom:11px">${[0,1,2,3,4,5,6].map(dd=>{
      const ts=base.getTime()+dd*DAY, cnt=crStarts(dd).length, on=dd===c.day, sim=simDay[dd]||0;
      return `<button class="dsq" style="position:relative;background:${on?'var(--ink)':cnt?'var(--mint-soft)':'var(--line2)'};
        border-color:${on?'var(--ink)':cnt?'#BFE0D2':'transparent'};color:${on?'#fff':cnt?'var(--ink)':'var(--muted)'}"
        ${cnt?`data-act="crday" data-v="${dd}"`:'disabled'}>
        <div style="font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.72">${dd===0?'Today':dow(ts)}</div>
        <div class="mono" style="font-size:13px;font-weight:700">${new Date(ts).getDate()}</div>
        <div style="font-size:8px;opacity:.72">${cnt?cnt:'\u2014'}</div>
        ${sim?`<i style="position:absolute;top:3px;right:3px;min-width:13px;height:13px;border-radius:7px;
          background:var(--coral);color:#fff;font-size:8px;font-weight:800;line-height:13px;text-align:center;
          font-style:normal;padding:0 2px">${sim}</i>`:''}</button>`;}).join('')}</div>
    ${Object.keys(simDay).some(k=>simDay[k])?`<div class="tiny" style="margin:-6px 0 9px;display:flex;align-items:center;gap:5px">
      <i style="width:9px;height:9px;border-radius:5px;background:var(--coral);display:block"></i>
      open matches already looking for players on that day</div>`:''}
    ${[['morning','Morning'],['afternoon','Afternoon'],['evening','Evening']].map(g=>{
      const slots=[];
      for(let t=OPEN[0];t<=OPEN[1];t+=30) if(podOfMin(t)===g[0]) slots.push(t);
      if(!slots.length) return '';
      return `<div class="eyebrow" style="margin:0 0 5px">${g[1]}</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px">${slots.map(t=>{
          const inSpan=span.indexOf(t)>=0, isEnd=t===spanEnd, ok=starts.indexOf(t)>=0;
          const cls=inSpan?(isEnd?'end':'on'):ok?'free':'off';
          return `<button class="tsq ${cls}" ${ok?`data-act="crtime" data-v="${t}"`:'disabled'}>${hhmm(t)}</button>`;
        }).join('')}</div>`;
    }).join('')}
    ${c.start!=null?`<div class="rl" style="padding-top:8px;border-top:1px solid var(--line2)">
      <span class="mono" style="font-size:12.5px;font-weight:700">${hhmm(c.start)} \u2192 ${hhmm(spanEnd)}</span>
      <span class="tiny">${c.dur} min \u00b7 ${span.length} squares \u00b7 ${cs.length} court${cs.length===1?'':'s'} free</span></div>`:''}
    <div class="tiny" style="margin-top:7px">Green is a start that fits ${c.dur} minutes${priv?'':' in a '+c.cat+' court'}.
      Grey is booked, or too close to the next booking to fit. The hollow square is where you finish.</div></div>`;

  /* ---------- private: the exact court, and who pays ---------- */
  if(priv){
    h+=`<div class="card" style="padding:11px;margin-bottom:11px">
      <div class="eyebrow" style="margin-bottom:6px">Choose your court \u00b7 ${c.day===0?'today':dowl(base.getTime()+c.day*DAY)} at ${c.start!=null?hhmm(c.start):'\u2014'}</div>
      ${cs.length?cs.map(x=>`<button class="rl" style="width:100%;text-align:left;align-items:center;${x.id===c.court?'':'opacity:.62'}"
          data-act="crcourt" data-v="${x.id}">
          <span style="display:flex;align-items:center;gap:8px;flex:1">
            <span style="width:15px;height:15px;border-radius:50%;border:2px solid ${x.id===c.court?'var(--coral)':'var(--line)'};
              display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${x.id===c.court?'<span style="width:7px;height:7px;border-radius:50%;background:var(--coral);display:block"></span>':''}</span>
            <span><b style="font-size:11.5px">${x.name}</b>
              <span class="tiny" style="display:block">${x.surf} \u00b7 ${x.indoor?'Indoor':'Outdoor'}</span></span></span>
          <span class="mono tiny">${zl(courtPriceOf(x,c.dur,c.start))}</span></button>`).join('')
        :`<div class="tiny">Nothing free at that hour. Pick another.</div>`}
      <div class="tiny hair">This is the court you are booking. It is reserved the moment you pay.</div></div>`;
    h+=`<div style="margin-bottom:11px"><div class="flab">How it is paid</div>
      <div class="seg">${[['all','I pay everything'],['split','Split the court']].map(x=>
        `<span class="${c.payModel===x[0]?'on':''}" data-act="crpay" data-v="${x[0]}">${x[1]}</span>`).join('')}</div>
      <div class="tiny" style="margin-top:5px">${c.payModel==='split'
        ? 'The price is divided by '+SPORTS[c.sport].players+'. Players pay their own share, and you guarantee any share that is still unpaid at the deadline.'
        : 'You pay the whole court now. Invitees are added without paying anything.'}</div></div>`;
    h+=`<div class="note info"><b>You are the booking owner</b><span class="tiny">${c.payModel==='split'
      ? 'You pay '+zl(share)+' now. The rest, '+zl(price-share)+', is <b>held on your card, not charged</b> \u2014 each share '+
        'a player pays releases part of it, and anything unpaid two hours before the match is charged to you.'
      : 'You pay the whole court now. Invitees are added without paying anything.'}</span></div>`;
    if(c.payModel==='split'){
      const L=S.lineup, filled=L&&L.sport===c.sport?L.seats.filter(Boolean).length:1;
      const nPl=SPORTS[c.sport].players, done=filled===nPl;
      h+=`<div class="card tap" data-act="lineup" style="${done
        ? 'background:var(--mint-soft);border-color:#BFE0D2'
        : c.warned?'background:var(--coral-soft);border-color:#F3CFC5':''}">
        <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="h2">Choose who is playing</div>
        <span class="tag ${done?'ok':c.warned?'bad':''}">${done?filled+' / '+nPl+' added':c.warned?'nobody added':'optional'}</span></div>
        <div class="tiny" style="margin-top:3px">${done
          ? 'Everybody is on the court and their invitations go out when you book. Tap to change the sides.'
          : filled>1 ? filled+' of '+nPl+' places filled. Tap to finish the line-up.'
          : 'Add friends, arrange the sides, and see how even the match would be before you book.'}</div></div>`;
      if(c.warned&&!done)
        h+=`<div class="note coral"><b>You have not chosen who is playing</b><span class="tiny">You can book it like this
          \u2014 the court is yours either way \u2014 but nobody is invited, so every unpaid share stays on your card.
          Tap Book again to go ahead.</span></div>`;
    }
    h+=`<div class="card" style="margin-bottom:11px"><div class="eyebrow" style="margin-bottom:3px">Money</div>
      <div class="rl"><span>Court for ${c.dur} min</span><b class="mono">${zl(price)}</b></div>
      <div class="rl"><span>${c.payModel==='split'?'Your share now':'You pay now'}</span>
        <b class="mono">${zl(c.payModel==='split'?share:price)}</b></div>
      ${c.payModel==='split'?`<div class="rl"><span>You guarantee</span><b class="mono" style="color:var(--coral)">${zl(price-share)} until paid</b></div>`:''}
      <div class="rl"><span>Booking fee</span><b class="mono" style="color:var(--mint)">0,00 zł</b></div></div>`;
    h+=`<button class="btn p full" style="height:40px" data-act="docreate" ${sel?'':'disabled'}>Book the court \u00b7 pay ${zl(c.payModel==='split'?share:price)}</button>`;
    return h;
  }

  /* ---------- already open · the moment of maximum information ----------
     This sits after the slot is chosen and before the price is shown. Earlier
     and there is nothing to compare against; later and the player has already
     read their own match into existence. Nothing here blocks anything: the
     create button stays, it just stops being the only obvious thing to tap. */
  /* ---------- already open · the moment of maximum information ----------
     This sits directly under the calendar, after the slot is chosen and before
     the price. Earlier there is nothing to compare against; later the player has
     already read their own match into existence.

     The matches themselves render as REAL Find cards. Inventing a second way to
     draw a match for this one screen would mean the player learns the pattern
     twice, and the bespoke version was strictly poorer \u2014 no state tag, no seat
     glyph, no balance, no badge. The only thing a Find card does not know is
     what matters here, so it is added underneath: the category, and the level
     the open seat wants against this player\u2019s own. */
  const OP=overlapPicture(c), sim=OP.all, crowd=OP.crowd;
  if(sim.length){
    const busy=OP.verdict==='busy';
    const full=sim.slice(0,MAX_RAIL);
    const dayName=c.day===0?'today':dowl(base.getTime()+c.day*DAY);
    const pod=podOfMin(c.start);
    const tone=OP.saturated?'coral':busy?'amber':sim[0].tight?'coral':'info';
    const head = busy
      ? `${dayName.charAt(0).toUpperCase()+dayName.slice(1)} ${pod} at ${CLUBS[c.club].n} is busy`
      : sim.length===1 ? 'One match already wants this slot'
      : sim.length+' matches already want this slot';
    const sub = busy
      ? `<b>${sim.length} open matches</b> within two hours of your slot, <b>${OP.seats} seats</b> still to fill between
         them, and ${crowd&&crowd.free?crowd.free+' '+(c.cat||'')+' court'+(crowd.free===1?'':'s'):'no '+(c.cat||'compatible')+' court'}
         free. There are already ${OP.seats} ways to play here before adding another match.`
      : `Joining one of these is more likely to actually happen than starting again at 1 of ${SPORTS[c.sport].players}
         \u2014 and it leaves the club a court for somebody else.`;
    /* what a Find card cannot say, and this screen needs */
    const foot=x=>{const m=x.m, t=seatTarget(m), b=targetBand(m), my=(lv('me',m.sport)||[null])[0];
      const lvline = t!=null ? 'The open seat needs about '+lvl(t)+' \u00b7 you are '+lvl(my)
                   : b ? 'Aimed at '+lvl(b[0])+'\u2013'+lvl(b[1])+' \u00b7 you are '+lvl(my) : '';
      return (m.category?m.category+(lvline?' \u00b7 ':''):'')+lvline;};
    h+=`<div class="note ${tone==='info'?'info':tone}" style="max-width:none;margin-bottom:9px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <b style="flex:1">${head}</b>
        <span class="tag ${OP.saturated||sim[0].tight?'hot':''}">${
          busy?sim.length+' open':sim[0].tight?'same hour':'nearby'}</span></div>
      <span class="tiny">${sub}</span></div>`;
    /* The same card the player already knows, in the same order Find uses, on a
       horizontal rail. Vertically these would push the price and the create
       button far below the fold, which is why an earlier version capped the
       busy case at two and collapsed the tail into rows. Sideways there is no
       height cost, so every alternative can be a full card and the compact
       fallback is gone. */
    h+=`<div class="sqrow mrail">${full.map(x=>matchCard(x.m,{foot:foot(x)})).join('')}</div>`;
    if(crowd&&crowd.tight) h+=`<div class="note amber" style="max-width:none">
      <b>${CLUBS[c.club].n} has ${crowd.free?crowd.free+' '+(c.cat||'')+' court'+(crowd.free===1?'':'s'):'no '+(c.cat||'compatible')+' court'}
        free at this hour, and ${crowd.wanting} match${crowd.wanting===1?'':'es'} already wanting ${crowd.wanting===1?'it':'them'}</b>
      <span class="tiny">${OP.saturated
        ? 'At least '+(crowd.wanting-crowd.free)+' of them will not get a court. Whoever is still short closest to play is the one that loses it.'
        : 'You can still create yours \u2014 but if they all fill, one of you will not get a court, and whoever is still short closest to play is the one that loses it.'}</span></div>`;
    if(OP.other.length) h+=`<div class="card" style="padding:11px;margin-bottom:9px">
      <div class="eyebrow" style="margin-bottom:6px">Quieter at the same time</div>
      ${OP.other.map(o=>`<button class="rl" style="width:100%;text-align:left;align-items:center;background:none;padding:5px 0"
        data-act="crday" data-v="${o.day}">
        <span style="flex:1;font-size:11.5px"><b>${o.day===0?'Today':dowl(base.getTime()+o.day*DAY)}</b>
          <span class="tiny" style="display:block">${o.n} match${o.n===1?'':'es'} \u00b7 ${o.seats} seat${o.seats===1?'':'s'} open \u00b7
            ${o.free} court${o.free===1?'':'s'} free</span></span>
        <span class="tiny">${o.best.fit} fit \u203a</span></button>`).join('')}
      <div class="tiny hair">Moving a day is usually easier than finding a fourth player.</div></div>`;
    if(sim.length>full.length) h+=`<button class="btn s full" style="height:32px;margin-bottom:11px"
      data-act="crseeall">See all ${sim.length} in Find</button>`;
  } else if(crowd && crowd.free===0){
    h+=`<div class="note amber"><b>No court free at this hour</b><span class="tiny">Every ${c.cat||'compatible'} court at
      ${CLUBS[c.club].n} is taken for ${hhmm(c.start)}. You can still create the match \u2014 it will look for a court as it
      fills \u2014 but if nothing frees up before play it is cancelled and everybody is refunded in full.</span></div>`;
  }

  /* ---------- open: payment and the rules, all four of them ---------- */
  h+=`<div class="card" style="margin-bottom:11px"><div class="eyebrow" style="margin-bottom:3px">You pay one seat</div>
    <div class="rl"><span>Court for ${c.dur} min</span><b class="mono">${zl(price)}</b></div>
    <div class="rl"><span>Your share \u00b7 1 of ${SPORTS[c.sport].players}</span><b class="mono">${zl(share)}</b></div>
    ${off>0?`<div class="rl"><span>Your sports card</span><b class="mono" style="color:var(--mint)">\u2212${zl(off)}</b></div>`:''}
    <div class="rl"><span>Booking fee</span><b class="mono" style="color:var(--mint)">0,00 zł</b></div>
    <div class="tiny hair">Guaranteed. Whichever ${c.cat} court is assigned, this is the price.</div></div>`;
  const dl=st0?Math.min(st0-C.window*HOUR, st0-12*HOUR):0;
  h+=`<div class="card" style="margin-bottom:11px"><div class="eyebrow" style="margin-bottom:5px">The five rules of an open match</div>
    ${[['You are not the owner','Whoever creates it is simply the first participant. Nobody is responsible for empty seats.'],
       ['The court is protected at three','With one or two players the match is visible but no court is held. The third payment reserves one.'],
       ['Commitment needs both','Money settles only when the deadline has passed AND every seat is paid. Either alone commits nobody.'],
       ['Incomplete cancels at T\u22122h','Still short two hours before play? Everybody is refunded in full and the court goes back.'],
       ['Cancelling is free until '+(st0?dowl(dl)+' '+hm(dl):'the deadline'),
        'Leave before then and your '+zl(pay)+' comes back in full. After it, if the match is confirmed, what you get '+
        'back depends on whether somebody takes your seat: 100% at full price, 50% through Rescue, nothing if nobody does.']]
      .map(r=>`<div class="rl" style="align-items:flex-start"><span style="flex:1">
        <b style="font-size:11.5px">${r[0]}</b><span class="tiny" style="display:block;margin-top:1px">${r[1]}</span></span></div>`).join('')}</div>`;
  /* the rules are the terms of what is being bought, so they are accepted rather than assumed */
  h+=`<div class="card ${c.accepted?'':'tap'}" data-act="craccept" style="margin-bottom:11px;padding:11px;
    ${c.accepted?'background:var(--mint-soft);border-color:#BFE0D2':c.acceptWarn?'background:var(--coral-soft);border-color:#F3CFC5':''}">
    <div style="display:flex;gap:10px;align-items:center">
      <span style="width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;
        justify-content:center;border:2px solid ${c.accepted?'var(--mint)':c.acceptWarn?'var(--coral)':'var(--line)'};
        background:${c.accepted?'var(--mint)':'#fff'}">
        ${c.accepted?'<span style="color:#fff;font-size:12px;line-height:1">\u2713</span>':''}</span>
      <span style="flex:1;font-size:11.5px;font-weight:600;${c.acceptWarn&&!c.accepted?'color:var(--coral-ink)':''}">
        I have read the five rules and accept them</span></div>
    ${c.acceptWarn&&!c.accepted?`<div class="tiny" style="margin-top:7px;color:var(--coral-ink)">
      You cannot create a match without accepting the rules \u2014 they are what everybody who joins is agreeing to.</div>`:''}</div>`;
  /* When a genuinely close alternative exists, creating is demoted rather than
     removed. The player can still do exactly what they came to do \u2014 it is just
     no longer the only obvious button on the screen. */
  const strong = sim.length && sim[0].fit>=65 && (sim[0].tight || OP.verdict==='busy');
  if(strong){
    const x=sim[0];
    h+=`<button class="btn p full" style="height:42px" data-go="match" data-id="${x.m.id}"
      >Open ${hhmm(matchMin(x.m))} at ${CLUBS[x.m.club].n} \u00b7 ${zl(payable(x.m))}</button>
      <div class="tiny" style="text-align:center;margin:6px 0 9px">${filled(x.m)} of ${x.m.n} already paid \u00b7
        ${x.fit} fit for you</div>`;
  }
  h+=`<button class="btn ${c.accepted&&!strong?'p':'s'} full" style="height:40px;${c.accepted?'':'opacity:.55'}"
    data-act="docreate" ${c.start!=null?'':'disabled'}>Create ${strong?'mine anyway':'match'} \u00b7 pay ${zl(pay)}</button>`;
  if(strong) h+=`<div class="tiny" style="text-align:center;margin-top:6px">${OP.verdict==='busy'
    ? 'Creating yours is fine. It just means '+(sim.length+1)+' matches are now looking for players in the same two hours, and '+
      (OP.seats+SPORTS[c.sport].players-1)+' seats have to fill instead of '+OP.seats+'.'
    : 'Creating yours is fine. Two matches at the same hour just means both of you need four people instead of one of you needing two.'}</div>`;
  return h;
};

/* ---- a big, tappable court ---- */
function bigCourt(sport,seats,lifted){
  const solo=SPORTS[sport].players===2, W=286;
  const H=Math.round(W*(sport==='Squash'?.62:.56));
  let pos;
  if(sport==='Squash') pos=[[38,62],[62,42]];
  else if(solo) pos=[[22,50],[78,50]];
  else pos=[[21,29],[21,71],[79,29],[79,71]];
  const net = sport==='Squash'
    ? `<line x1="5%" y1="55%" x2="95%" y2="55%" stroke="#D8DFDD" stroke-width="1.4"/>`
    : `<line x1="50%" y1="6%" x2="50%" y2="94%" stroke="#C8D3D0" stroke-width="2"/>`+
      `<line x1="30%" y1="6%" x2="30%" y2="94%" stroke="#E0E7E5" stroke-width="1"/>`+
      `<line x1="70%" y1="6%" x2="70%" y2="94%" stroke="#E0E7E5" stroke-width="1"/>`;
  const tgt=linkTarget(sport,seats);
  const dots=pos.map((p,i)=>{
    const id=seats[i], isLink=id===LINK;
    const P=(id&&!isLink)?PLAYERS[id]:null, L=(id&&!isLink)?lv(id,sport):null;
    const on=lifted===i, mine=id==='me';
    const bg=isLink?'#8C9C98':id?(mine?'var(--coral)':'var(--ink)'):'rgba(255,255,255,.85)';
    const inner = isLink
      ? `<span style="font-size:13px;color:#fff">&#128279;</span>
         <span class="mono" style="font-size:8px;color:rgba(255,255,255,.8)">${tgt!=null?lvl(tgt):'link'}</span>`
      : id
      ? `<span style="font-size:11.5px;font-weight:700;color:#fff;letter-spacing:-.02em">${P?P.s:'?'}</span>
         <span class="mono" style="font-size:8.5px;color:rgba(255,255,255,.78)">${L?lvl(L[0]):''}</span>`
      : `<span style="font-size:17px;color:#9AAAA6;font-weight:300">+</span>`;
    /* a small cross so one person can be taken off without touching anybody else */
    const x = (id&&!mine) ? `<span data-act="ludrop" data-v="${i}" style="position:absolute;top:-3px;right:-3px;
        width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);
        box-shadow:0 1px 4px rgba(12,52,65,.18);display:flex;align-items:center;justify-content:center;
        font-size:11px;color:var(--muted);line-height:1;z-index:2">&times;</span>` : '';
    return `<div style="position:absolute;left:${p[0]}%;top:${p[1]}%;transform:translate(-50%,-50%);width:60px;height:60px">
      <div data-act="luseat" data-v="${i}" style="width:60px;height:60px;border-radius:50%;background:${bg};
        border:${on?'3px solid var(--volt)':id?'2px solid #fff':'2px dashed #B9C6C2'};
        box-shadow:${on?'0 0 0 4px rgba(210,255,60,.35)':'0 2px 8px rgba(12,52,65,.13)'};
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px">${inner}</div>${x}</div>`;
  }).join('');
  return `<div style="position:relative;width:${W}px;height:${H}px;margin:0 auto">
    <svg width="${W}" height="${H}" style="position:absolute;inset:0">
      <rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" fill="#EEF2F1" stroke="#D8DFDD"/>${net}</svg>
    ${dots}</div>`;
}
V.lineup=function(){
  const c=S.cr||{}, sport=c.sport||'Padel', n=SPORTS[sport].players;
  if(!S.lineup||S.lineup.sport!==sport){
    S.lineup={sport:sport,seats:['me'].concat(new Array(n-1).fill(null)),lifted:null};
  }
  const L=S.lineup, seated=L.seats.filter(Boolean).length;
  const f=arrangedForecast(sport,L.seats);
  const bestIds=bestArrangement(sport,L.seats);
  const bf=arrangedForecast(sport,bestIds);
  const isBest=!bf||!f||bf.pct===f.pct;
  const pool=friendsFor(sport).filter(id=>L.seats.indexOf(id)<0);
  let h=head('Who is playing',`${sport} · ${CLUBS[c.club||'ps'].n}`,true);

  /* an invitation to act reads better as a subtitle than as a boxed notice \u2014 the court
     is the protagonist on this screen and a card at the top competes with it */
  h+=`<div style="margin:-2px 0 13px">
    <div style="font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.25">You decide who partners whom</div>
    <div class="tiny" style="margin-top:3px">Swap anyone and the forecast moves with you \u2014 even it out, or make it a
      hard evening.</div></div>`;
  h+=`<div class="row" style="margin-bottom:11px">
    <input placeholder="Search your friends" style="flex:1;height:34px;border-radius:10px;border:1px solid var(--line);
      padding:0 11px;font-size:12px;font-family:inherit;background:#fff" data-act="noop">
    <button class="btn s" style="width:auto;padding:0 12px;height:34px;font-size:11px" data-act="lulink">Invite by link</button></div>`;

  h+=`<div class="sqrow" style="margin-bottom:13px">${pool.map(id=>{
    const P=PLAYERS[id], l=lv(id,sport);
    return `<button data-act="lupick" data-v="${id}" style="flex:0 0 auto;width:78px;padding:9px 6px;border-radius:12px;
      border:1px solid var(--line);background:#fff;text-align:center">
      <span class="avat" style="width:30px;height:30px;font-size:10px;margin:0 auto 5px">${P.s}</span>
      <span style="display:block;font-size:10.5px;font-weight:700;letter-spacing:-.01em">${P.n.split(' ')[0]}</span>
      <span class="tiny" style="display:block;font-size:9px">${P.n}</span>
      <span class="mono" style="display:block;font-size:10px;font-weight:700;color:var(--coral);margin-top:2px">${lvl(l[0])}</span>
    </button>`;}).join('')||'<div class="tiny">Everybody who plays '+sport.toLowerCase()+' is already on the court.</div>'}</div>`;

  h+=bigCourt(sport,L.seats,L.lifted);
  const links=L.seats.filter(x=>x===LINK).length;
  h+=`<div class="tiny" style="text-align:center;margin:9px 0 13px">${
    L.lifted!=null ? '<b style="color:var(--ink)">Now tap another place to swap them.</b>'
    : seated<n ? 'Tap a friend to seat them. '+(n-seated)+' place'+(n-seated>1?'s':'')+' left.'
    : n===2 ? 'Tap \u00d7 to take somebody off.'
    : 'Tap a player to pick them up, then tap another to swap sides. \u00d7 takes somebody off.'}</div>`;

  /* the forecast, live */
  if(!f){
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <span class="eyebrow">Balance forecast</span><span class="tag">not set yet</span></div>
      <div class="tiny" style="margin-top:6px">${L.seats.filter(x=>x===LINK).length>1
        ? 'Two open links means two unknowns, and there is no single answer to compare. Seat one of them.'
        : 'Every place has to be filled before the sides can be compared. '+seated+' of '+n+' so far.'}</div></div>`;
  } else {
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <span class="eyebrow">Balance forecast</span>
      <span class="tag ${f.provisional?'':isBest?'ok':''}">${f.provisional?'provisional':isBest?'most even':'your arrangement'}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px">
        <div><div class="mono num" style="font-size:18px">${lvl(f.A)}</div><div class="tiny">${n===2?'you':'your side'}</div></div>
        <div style="text-align:center"><div class="tiny">gap</div>
          <div class="mono num" style="font-size:13px">${lvl(f.gap)}</div></div>
        <div style="text-align:right"><div class="mono num" style="font-size:18px">${lvl(f.B)}</div>
          <div class="tiny">${n===2?'them':'the others'}</div></div></div>
      <div class="balbar" style="margin-top:9px">
        <i style="width:${Math.max(14,Math.min(86,f.youShare))}%;background:var(--night)">${n===2?'You':'Your side'}</i>
        <i style="flex:1;background:var(--night2);opacity:.72">Them</i></div>
      <div class="hair" style="margin-top:9px;padding-top:9px;display:flex;align-items:center;gap:12px">
        <span class="num" style="font-size:28px;line-height:1;color:${balTone(f.pct)}">${f.pct}%</span>
        <span style="flex:1"><b style="font-size:12px">${balWord(f.pct)}</b>
          <span class="tiny" style="display:block;margin-top:1px">${
            f.provisional?'If somebody around '+lvl(f.target)+' claims the link. Whoever actually does decides the real number.'
            :isBest?'This is the closest game these '+n+' can produce.'
                  :'The most even arrangement would be '+bf.pct+'%.'}</span></span></div>
      ${f.provisional?`<div class="tiny hair" style="margin-top:9px;padding-top:9px">Move the link place to the other side
        and this target changes \u2014 which side you leave open is part of the decision.</div>`:''}
      ${!isBest&&n>2&&!f.provisional?`<button class="btn s full" style="height:30px;font-size:11px;margin-top:9px" data-act="lubest">
        Use the most even pairing</button>`:''}</div>`;

  }
  h+=`<div class="row" style="margin-top:11px">
    <button class="btn s" style="flex:1" data-act="luclear">Clear</button>
    <button class="btn p" style="flex:2" data-act="ludone">Done</button></div>`;
  return h;
};


/* ==================================================================
   ONBOARDING — the initial rating pipeline, one sport at a time
   ================================================================== */
function obShell(title,sub,pct,body,back){
  return `<div class="pbar">${back?`<button class="back" data-act="obback">\u2039</button>`:''}
    <div class="t"><div class="eyebrow">${sub}</div><div class="h1">${title}</div></div></div>
    ${pct!=null?`<div style="padding:0 15px 10px"><div class="bar"><i style="width:${pct}%;background:var(--coral)"></i></div></div>`:''}
    <div class="pbody">${body}</div>`;
}
V.onboard=function(){
  if(!S.ob) S.ob=obFresh();
  const st=S.ob.step;

  /* ---- 1 · account ---- */
  if(st==='welcome') return `<div class="pbody" style="padding-top:34px">
    <div style="text-align:center;margin-bottom:26px">
      <span style="width:52px;height:52px;border-radius:16px;background:var(--night);display:inline-flex;
        align-items:center;justify-content:center"><i style="width:19px;height:19px;border-radius:10px;background:var(--coral);display:block"></i></span>
      <div class="h1" style="font-size:24px;margin-top:13px">Rakieta</div>
      <div class="tiny" style="margin-top:5px">Padel, tennis, squash and badminton in Kraków</div></div>
    <div class="card"><div class="flab">Email</div>
      <div style="height:36px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 11px">
        <span class="tiny">tomek.k@example.com</span></div>
      <div class="flab" style="margin-top:11px">Password</div>
      <div style="height:36px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 11px">
        <span class="tiny">\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022</span></div></div>
    <button class="btn p full" style="height:42px;margin-bottom:9px" data-act="obgo" data-v="sports">Create my account</button>
    <button class="btn s full" data-act="obgo" data-v="sports">I already have one</button>
    <div class="note info" style="margin-top:13px"><b>What happens next</b><span class="tiny">We work out a starting
      level for each sport you pick. It takes about a minute per sport, and you can refine it later \u2014 nothing here
      is permanent.</span></div></div>`;

  /* ---- 2 · which sports ---- */
  if(st==='sports'){
    const on=S.ob.sports;
    return obShell('Which sports do you play?','Step 1 of 2',12,
      `<div class="tiny" style="margin-bottom:13px">Pick one or more. Each sport is rated on its own \u2014 a level is
        never borrowed from another.</div>
      ${OB_SPORTS.map(sp=>`<div class="card tap" data-act="obsport" data-v="${sp}"
        style="display:flex;align-items:center;gap:11px;${on.includes(sp)?'border:2px solid var(--coral)':''}">
        <span style="width:34px;height:34px;border-radius:11px;background:${SPORTS[sp].c};flex-shrink:0"></span>
        <span style="flex:1"><b style="font-size:13px">${sp}</b>
          <span class="tiny" style="display:block">${SPORTS[sp].players} players \u00b7 ${(SPORT_FORMATS[sp]||[]).join(' / ')}</span></span>
        <span style="width:22px;height:22px;border-radius:7px;border:2px solid ${on.includes(sp)?'var(--coral)':'var(--line)'};
          background:${on.includes(sp)?'var(--coral)':'#fff'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px">
          ${on.includes(sp)?'\u2713':''}</span></div>`).join('')}
      <button class="btn ${on.length?'p':'s'} full" style="height:40px;margin-top:6px;${on.length?'':'opacity:.5'}"
        data-act="obstart" ${on.length?'':'disabled'}>Continue${on.length?' \u00b7 '+on.length+' sport'+(on.length>1?'s':''):''}</button>`);
  }

  const key=obCur(), sp=obSportOf(key), fmt=obFormatOf(key);
  const keys=obKeys(), n=keys.length, i=S.ob.idx;
  const twoFmt=(SPORT_FORMATS[sp]||[]).length>1;
  const label=sp+(twoFmt?' \u00b7 '+fmt.toLowerCase():'');
  const a=obAssessment(key);
  const base=14+Math.round((i/Math.max(1,n))*72);
  const step='Rating '+(i+1)+' of '+n;

  /* ---- 3 · the adaptive questionnaire ----
     There are no hard-coded screens per question any more. The engine
     hands back a question object; this renders whatever it is asked to
     render, and stops when the engine stops. */
  if(st==='q'){
    if(!S.ob.q) obAdvance(key);
    if(S.ob.step!=='q') return V.onboard();
    const q=S.ob.q, live=estimate(a), asked=a.responses.length;
    const inner=Math.round(base+ (72/Math.max(1,n)) * Math.min(1,(asked)/7));
    const cat=({activity:'Recent play',context:'Competitive context',execution:'Match execution',
                tactical:'Tactical execution',transfer:'Other racket sports'})[q.category]||q.category;
    const tierTag=q.difficulty?`<span class="tag ${q.difficulty==='adv'?'hot':''}">${
      ({basic:'basic',mid:'standard',adv:'discriminating'})[q.difficulty]}</span>`:'';
    const meter=asked?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:11px">
      <span class="tiny" style="flex:1">Question ${asked+1}</span>
      ${tierTag}<span class="tag">${lvl(live.mu)} so far</span></div>`:'';

    /* the tie-breaker is announced, because a silent extra question after
       a contradiction would feel like an interrogation (\u00a719.5) */
    const tie=(a.tieBreakerAsked&&q.category==='execution'&&a.contradictionResolved===null)
      ? `<div class="note info"><b>One more, to settle a disagreement</b><span class="tiny">Some of your answers point
         to different ranges. This question is pitched at the level your other answers suggest \u2014 whichever way you
         answer, it tells us which side to trust.</span></div>` : '';

    /* the cross-sport module is the one moment a player can be genuinely
       confused: they picked padel and the app suddenly asks about tennis.
       So it does not arrive as a question with a footnote \u2014 it arrives as
       a full-width explanation of why the two sports are connected, with
       both sport colours and the actual transfer figure on it. */
    return obShell(cat, label+' \u00b7 '+step, inner,
      meter+tie+
      (q.situation?`<div class="card" style="padding:0;overflow:hidden;border:1px solid var(--line)">
        <div style="padding:9px 13px 8px;background:var(--paper2);border-bottom:1px solid var(--line)">
          <div class="eyebrow" style="font-size:8px">Picture this</div>
          <div style="font-size:13.5px;font-weight:600;line-height:1.35;margin-top:2px">${q.situation}</div></div>
        <div style="padding:11px 13px 12px">
          <div style="font-size:15px;font-weight:650;line-height:1.35;letter-spacing:-.01em">${q.text}</div>
          ${(q.category==='execution'||q.category==='tactical')?`<div class="tiny" style="margin-top:6px">A normal
            match against players at your level \u2014 not your best day in training.</div>`:''}</div></div>`
      : `<div class="card"><div style="font-size:15px;font-weight:650;line-height:1.35;letter-spacing:-.01em">${q.text}</div></div>`)+
      q.answerScale.map((t,ix)=>`<div class="card tap" data-act="obpick" data-v="${ix}"
        ><b style="font-size:12.5px">${t}</b></div>`).join('')+
      (q.id==='act.regularity'?`<div class="tiny hair">If you have never played, we stop right here. There is nothing
        useful to learn by asking a first-timer how they handle a back-wall rebound.</div>`:''),1);
  }

  /* ---- 4 · the result ---- */
  if(st==='result'){
    const r=S.ob.res[key]||finalize(a);
    S.ob.res[key]=r;
    const bc=OB_BANDC[r.band]||'var(--muted)';
    const plan=calibrationPlan(r);
    /* three numbers on this card carry real meaning and none of them is
       self-explanatory, so each gets a tap target and a short, plain answer
       to "what does this mean for me". */
    const inf=(k2,side)=>obInfo(k2,r,side);
    return obShell('Your starting level',label+' \u00b7 '+step,base+64,
      `<div class="card-n"><div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="eyebrow" style="display:flex;align-items:center;gap:5px">Estimated level${twoFmt?' \u00b7 '+fmt:''} ${inf('level','l')}</div>
          <div class="num" style="font-size:40px;line-height:1;margin-top:4px">${lvl(r.mu)}</div>
          <div class="tiny" style="margin-top:5px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:5px">
            likely range <b class="mono" style="color:#fff">${lvl(r.likelyRange[0])} \u2013 ${lvl(r.likelyRange[1])}</b> ${inf('range','l')}</div></div>
        <div style="text-align:center">
          ${ring(r.confidence,58,5,'var(--volt)','rgba(255,255,255,.18)','<span class="mono num" style="font-size:12px">'+r.confidence+'%</span>')}
          <div class="eyebrow" style="margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px">Confidence ${inf('confidence','r')}</div></div></div>
        ${bandBar([r.mu,r.sigma],true,{labels:1,tall:1,legend:1})}
        <div class="hair" style="display:flex;gap:10px">
          <div style="flex:1"><div class="eyebrow" style="font-size:8px">Band</div>
            <div class="tiny" style="color:#fff;font-weight:600">${r.bandName}</div></div>
          <div style="width:1px;background:rgba(255,255,255,.15)"></div>
          <div style="flex:1"><div class="eyebrow" style="font-size:8px">Status</div>
            <div class="tiny" style="color:#fff;font-weight:600">${r.status}</div></div>
          <div style="width:1px;background:rgba(255,255,255,.15)"></div>
          <div style="flex:1"><div class="eyebrow" style="font-size:8px">Questions</div>
            <div class="tiny" style="color:#fff;font-weight:600">${r.questionsAsked} asked</div></div></div></div>
      <div class="card" style="border-left:3px solid ${bc}">
        <b style="font-size:12.5px">${r.bandName}</b>
        <div class="tiny" style="margin-top:2px">${r.bandMeaning}</div>
        <div class="tiny hair">This is the name for where you are on the bar today. As your range narrows it can
          settle into a different one — the bar shows how close you are to the next.</div></div>
      ${r.contradiction&&r.contradictionResolved===false?`<div class="note info"><b>We kept your range wider</b>
        <span class="tiny">Some of your answers point to different skill ranges, so we kept your starting range wider.
        Your first matches will help us calibrate it quickly.</span></div>`:''}
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">Main factors</div>
        ${r.factors.map(f=>`<div class="rl"><span style="font-size:11.5px">${f.label}</span>
          <b class="mono" style="font-size:${f.dir==='wider'?'10px':'14px'};color:${
            f.dir==='up'?'var(--mint)':f.dir==='down'?'var(--red)':f.dir==='wider'?'var(--amber)':'var(--muted)'}">${
            f.dir==='wider'?'wider range':OB_ARROW[f.dir]}</b></div>`).join('')}
        <div class="tiny hair">${r.confidenceReason.text}</div></div>
      <div class="note info"><b>Play ${plan.matches} matches to make this reliable</b><span class="tiny">We will look for
        ${plan.anchorsWanted} settled player${plan.anchorsWanted===1?'':'s'} near ${lvl(plan.anchor)} rather than three
        other new players. If nobody settled is free, the matches still count \u2014 they just take longer to narrow the
        range, and we will need to see ${plan.opponentsWanted} different opponents before calling it stable.</span></div>
      <button class="btn p full" style="height:40px" data-act="obnext">${i+1<n?'Next rating':'Finish'}</button>`
      ,1);
  }

  /* ---- 5 · everything, before entering the app ---- */
  if(st==='done'){
    const ks=obKeys().filter(x=>S.ob.res[x]);
    return obShell('You are set up','Your starting levels',100,
      `${ks.map(x=>{const r=S.ob.res[x],s2=obSportOf(x),f2=obFormatOf(x);
        return `<div class="card"><div style="display:flex;align-items:center;gap:10px">
          <span style="width:9px;height:9px;border-radius:3px;background:${SPORTS[s2].c};display:block"></span>
          <b style="flex:1;font-size:13px">${s2}${(SPORT_FORMATS[s2]||[]).length>1?' \u00b7 '+f2.toLowerCase():''}</b>
          <span class="tag" style="background:${OB_BANDC[r.band]};color:#fff;border:0">${r.bandName}</span>
          <span class="mono num" style="font-size:19px">${lvl(r.mu)}</span></div>
          ${bandBar([r.mu,r.sigma],false,{labels:1})}

          <div style="display:flex;gap:7px"><span class="mono tiny" style="width:16px">${rt.step}</span>

          <span class="mono tiny">${lvl(rt.currentMu)}\u00b1${lvl(rt.currentSigma)}</span></div></div>`).join('')}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:5px">Derived features</div>
        ${Object.keys(A.features).filter(x=>x!=='assessmentId').map(x=>
          `<div class="rl"><span>${x.replace(/([A-Z])/g,' $1').toLowerCase()}</span><b class="mono">${
            A.features[x]===true?'yes':A.features[x]===false?'no':A.features[x]===null?'\u2014':A.features[x]}</b></div>`).join('')}</div>

  }
  return '';
};

/* ==================================================================
   MATCH STATES
   The state tags, and every context each one appears in. The tag is the truth about the
   group; the Court line
   and the information lines carry the context that produced it.
   ================================================================== */
const ST_TONE={good:'var(--mint)',watch:'var(--coral)',time:'var(--amber)',
               ended:'var(--red)',idle:'rgba(255,255,255,.45)'};
const HOLD_H=2;   /* an invited seat is held for two hours — see holdUntil() */
const RESULT_MIN=30;   /* the score is captured on court: 30 minutes from the scheduled end */
const KEEP_H=24;       /* a finished match stays on Now for a day, then it is history */
function matchEnd(m){return m.start+m.dur*60e3;}
function resultWindow(m){return matchEnd(m)+RESULT_MIN*60e3;}
function holdUntil(from,start,commit){
  let t=from+HOLD_H*HOUR;
  if(start-from<4*HOUR) t=from+30*60e3;          /* short notice: 30 minutes */
  const h=new Date(t).getHours();
  if(h>=22||h<8){                                 /* never lapse overnight */
    const d=new Date(t); if(h>=22) d.setDate(d.getDate()+1);
    d.setHours(8,0,0,0); t=d.getTime();
  }
  return Math.min(t,commit);                      /* never past commitment */
}
