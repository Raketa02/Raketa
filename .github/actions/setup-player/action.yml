name: Set up the player app
description: >-
  pnpm, Node 22, frontend_player's install from its lockfile, and — for a job that
  runs Jest — Jest's transform cache restored from a cache keyed on the lockfile
  and the Babel and Jest config.

inputs:
  jest-cache:
    description: >-
      The name of this job's Jest cache, such as `shard-1` or `deck`. Empty for a
      job that runs no Jest suite.
    required: false
    default: ""

outputs:
  jest-cache-dir:
    description: The directory to hand Jest as --cacheDirectory. Empty without jest-cache.
    value: ${{ steps.jest.outputs.dir }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    # The pnpm store is cached by setup-node, keyed on the lockfile's hash.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend_player/pnpm-lock.yaml

    - name: Install
      shell: bash
      working-directory: frontend_player
      run: pnpm install --frozen-lockfile

    # Every CI run used to start with a cold transform cache, and Babel was the
    # cost: on one feature folder a warm cache took 71 s to 38 s (ADR-0181). It
    # lives outside the checkout, where neither eslint nor prettier walks.
    #
    # One cache per job rather than one shared: each shard transforms only what its
    # own suites import, and a shard's suites are the same from run to run, so each
    # restores exactly what it will need. The prefix is what can change a
    # transform — the lockfile, babel.config.js and jest.config.js — and never the
    # branch; Jest keys every entry inside by the content it transformed.
    #
    # The commit ends the key so the cache moves with the source. A cache hit is
    # never saved again, so a key of the prefix alone would freeze at its first
    # save, and every file changed since would miss until the lockfile moved.
    # Instead each commit restores the newest cache under its prefix and saves its
    # own — a few megabytes a job, compressed.
    - id: jest
      if: inputs.jest-cache != ''
      shell: bash
      run: echo "dir=$RUNNER_TEMP/jest-cache" >> "$GITHUB_OUTPUT"

    - name: Restore the Jest cache
      if: inputs.jest-cache != ''
      uses: actions/cache@v4
      with:
        path: ${{ steps.jest.outputs.dir }}
        key: jest-${{ runner.os }}-${{ inputs.jest-cache }}-${{ hashFiles('frontend_player/pnpm-lock.yaml', 'frontend_player/babel.config.js', 'frontend_player/jest.config.js') }}-${{ github.sha }}
        restore-keys: |
          jest-${{ runner.os }}-${{ inputs.jest-cache }}-${{ hashFiles('frontend_player/pnpm-lock.yaml', 'frontend_player/babel.config.js', 'frontend_player/jest.config.js') }}-
