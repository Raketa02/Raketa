name: Build and Deploy Code

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    environment:
      name: development  
    runs-on: ubuntu-latest
    name: Lint, Test, Build, Push

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://basebackend_user:base_backend_db_password@localhost:5432/postgres
      PYTHONUNBUFFERED: 1
      ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root

      - name: Check lock file is up-to-date
        run: poetry check --lock

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Run unit tests with coverage
        run: |
          poetry run pytest --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  docker:
    environment:
      name: development  
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/api/Dockerfile.dev
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/basebackend_api:latest
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

deploy:
  name: Deploy to EC2
  needs: docker
  runs-on: ubuntu-latest
  environment:
    name: production

  steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    # 1️⃣ Write .env.prod from secret
    - name: Write .env.prod file from GitHub secret
      shell: bash
      run: |
        echo "${{ secrets.ENV_PROD }}" | tr '\r' '\n' > .env.prod
        echo ".env.prod created with $(wc -l < .env.prod) lines"
        head -n 10 .env.prod

    # 2️⃣ Recreate .secrets directory and make key files world-readable for SCP
    - name: Recreate `.secrets/` directory with contents
      run: |
        mkdir -p .secrets
        echo "${{ secrets.CLIENT_CERT }}" > .secrets/client.crt
        echo "${{ secrets.CLIENT_KEY }}" > .secrets/client.key
        echo "${{ secrets.SERVER_CERT }}" > .secrets/server.crt
        echo "${{ secrets.SERVER_KEY }}" > .secrets/server.key
        echo "${{ secrets.ROOT_CERT }}" > .secrets/rootCA.crt
        echo "${{ secrets.POSTGRES_PASSWORD }}" > .secrets/postgres_password.txt
        echo "${{ secrets.ROOT_KEY }}" > .secrets/rootCA.key || echo "ROOTCA_KEY not set"
        chmod 644 .secrets/*.key || true

    # 3️⃣ Optional debug (disabled)
    # - name: Debug – List files before SCP
    #   run: |
    #     echo "Listing files in workspace before upload:"
    #     ls -lah
    #     echo "Listing .secrets directory:"
    #     ls -lah .secrets
    #     echo "Listing .env.prod:"
    #     cat .env.prod | head -n 20

    # 4️⃣ Upload files to EC2 (separate paths with commas)
    - name: Copy Docker Compose files and secrets to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "./docker-compose-prod.yml,./.env.prod,./.secrets/*"
        target: "~/basebackend"
        overwrite: true
        strip_components: 0

    # 5️⃣ SSH into EC2 and deploy with hardened key permissions
    - name: Connect and deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Changing into deployment directory"
          cd ~/basebackend

          echo "Securing private keys..."
          chmod 600 .secrets/*.key || true

          echo "Pulling images..."
          docker compose -f docker-compose-prod.yml pull

          echo "Starting containers..."
          docker compose -f docker-compose-prod.yml up -d

          echo "Deployment completed successfully!"