name: Build and Deploy Code

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    environment:
      name: development  
    runs-on: ubuntu-latest
    name: Lint, Test, Build, Push

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://basebackend_user:base_backend_db_password@localhost:5432/postgres
      PYTHONUNBUFFERED: 1
      ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root

      - name: Check lock file is up-to-date
        run: poetry check --lock

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Run unit tests with coverage
        run: |
          poetry run pytest --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  docker:
    environment:
      name: development  
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/api/Dockerfile.dev
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/basebackend_api:latest
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Write .env.prod file from GitHub secret
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Debug – List files before SCP
        run: |
          echo "Listing files in workspace before upload:"
          ls -lah
          echo "Listing .secrets directory:"
          ls -lah .secrets || echo ".secrets not found"
          echo "Listing .env.prod:"
          cat .env.prod || echo ".env.prod not found"

      - name: Copy Docker Compose files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
            docker-compose-prod.yml
            .env.prod
            .secrets/**
          target: "/home/ubuntu/basebackend"

      - name: Connect and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Changing into deployment directory"
            cd /home/ubuntu/basebackend
            echo "Pulling images..."
            docker compose -f docker-compose-prod.yml pull
            echo "Starting containers..."
            docker compose -f docker-compose-prod.yml up -d
            echo "Deployment completed."