name: Deploy backend to ECS  [DORMANT]

# ---------------------------------------------------------------------------
# DORMANT — AWS deployment is deliberately not in use.
#
# Development is entirely local: local Postgres + local Docker
# (backend/docker-compose-local.yml). This pipeline is kept intact, and correct,
# so it can be switched back on without being rebuilt from memory.
#
# It is dormant in two independent ways, so neither alone can wake it by
# accident:
#   1. Trigger — manual only. It does not run on push. (Lint/test on every push
#      is ci.yml's job; this file exists purely to ship an image.)
#   2. The build-and-deploy job is gated on `vars.AWS_REGION` being set, so even
#      a manual run stops after the tests until AWS actually exists.
#
# To reactivate, once the AWS side is provisioned:
#   gh variable set AWS_REGION --body eu-north-1
#   gh variable set ECR_REPOSITORY     --body rakieta-api
#   gh variable set ECS_CLUSTER        --body rakieta-cluster
#   gh variable set ECS_SERVICE        --body rakieta-service
#   gh variable set ECS_CONTAINER_NAME --body api
#   gh secret   set AWS_OIDC_ROLE_ARN  --body arn:aws:iam::<acct>:role/<role>
# and restore the `push:` trigger below.
#
# Full provisioning guide: backend/docs/deployment/aws-ecs.md
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
  # Restore this block when deployment resumes:
  # push:
  #   branches: [main, release]
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/deploy-ecs.yml"

permissions:
  contents: read
  id-token: write   # required for OIDC -> AWS

jobs:
  # The backend through the merge gate's own commands: ruff, the import
  # boundaries and mypy, as ci.yml's static job runs them, then the whole suite
  # through `make test` — parallel and without coverage (ADR-0181 §3), where this
  # job used to run it serially with coverage, 48–60 minutes on this runner. The Postgres service and the environment are ci.yml's
  # backend-tests', so the one test that needs Postgres runs here too. One job,
  # static first: nothing here is waiting to be told about a typo, and it should
  # stop a deploy before the tests start rather than beside them.
  test:
    name: Backend — static checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rakieta
          POSTGRES_USER: rakieta_user
          POSTGRES_PASSWORD: rakieta_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rakieta_user -d rakieta"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Python, the one pinned Poetry and the cached virtualenv — the same setup
      # every backend job in ci.yml starts from, and the reason this file no
      # longer carries a Poetry pin of its own.
      - uses: ./.github/actions/setup-backend
      - name: Lint
        run: make lint
      - name: Import boundaries
        run: make lint-imports
      - name: Typecheck
        run: make typecheck
      - name: Test
        env:
          WRITER_DB_URL: postgresql+asyncpg://rakieta_user:rakieta_pwd@localhost:5432/rakieta
          EVENT_TEST_DATABASE_URL: postgresql+asyncpg://rakieta_user:rakieta_pwd@localhost:5432/rakieta
          DB_SSL_MODE: disable
          JWT_SECRET_KEY: ci-secret-do-not-use-in-prod
        run: make test

  build-and-deploy:
    name: Build, push to ECR, deploy to ECS
    needs: test
    # `vars.AWS_REGION` is the switch. Until the AWS side is wired up (OIDC role,
    # ECR repo, ECS cluster/service) this job skips instead of failing every push
    # with a credentials error. Setting the repo variables turns it on:
    #   gh variable set AWS_REGION --body eu-north-1
    #   gh variable set ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_CONTAINER_NAME
    #   gh secret   set AWS_OIDC_ROLE_ARN
    if: >-
      vars.AWS_REGION != '' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch')
    # NOTE: no `defaults.working-directory` here — the actions below take explicit
    # paths (`context: backend`, `task-definition: backend/deploy/...`).
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/api/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render new ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/deploy/ecs/taskdef.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.tag.outputs.image }}

      - name: Deploy task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
