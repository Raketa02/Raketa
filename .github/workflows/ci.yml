name: CI

# Each app is gated independently and only when it changed — a Next.js edit
# should not re-run the backend's Postgres suite. The guardrail hooks are
# checked on every run because they protect the whole repo.
#
# **Tiers, in parallel, behind one summary** (ADR-0181 §4). Inside each app the
# static checks, the tests, the generated-artifact checks and the "still fires"
# suites all start the moment `changes` answers, so a typo answers in a minute
# or two and never waits on the tests, and the tests never wait on it:
#
#   backend   static · tests · generated artifacts · meta (two jobs)
#   player    static · tests (three shards) · the deck · meta
#   always    the guardrail hooks · the ruleset release-report block
#
# `ci-ok` needs every one of them, and is the one status to read: red when any
# job failed or was cancelled, green when each succeeded or was skipped because
# its app did not change. A job added here and not to ci-ok's `needs` turns
# ci-ok red on the pull request that adds it (`make ci-ok`).
#
# Every test runs on every push that reaches an app (ADR-0181 §1): the filters
# below decide whether an app changed, never which of its tests matter. Coverage
# is not measured here — coverage.yml measures it nightly and on main (§3).
#
# **The runner is 2 vCPU / 8 GB** — a private repository's standard
# `ubuntu-latest` (§7), not the 16 GB a public one gets. Worker counts and heap
# limits below are sized from that, and the player's test jobs record the peak
# they reached (.github/scripts/memory-peak.sh) on the run's summary page.
on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  # `dorny/paths-filter` asks the API which files a *pull request* touched, rather
  # than diffing locally as it does for a push — so without this the detect job
  # fails with "Resource not accessible by integration" and every app job skips
  # behind it, which reads as a green run that tested nothing. It went unnoticed
  # until the first pull request, because pushes never take the API path.
  pull-requests: read

# A newer push to a pull request makes the run testing the older one worthless,
# so it is cancelled. Anything else — a push to main or release, a manual run —
# is never cancelled and never queued behind another run: its group is its own
# run id, which nothing else shares. (A shared group with cancel-in-progress off
# would still let GitHub drop a *pending* run for a newer one.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      # Whether this pull request is a **ruleset release**: the synthetic diff's
      # artifacts moved. Only those pull requests owe the recorded-corpus report
      # block — a gate that asks every pull request for a corpus window is a
      # gate everybody learns to paste nonsense into.
      ruleset: ${{ steps.filter.outputs.ruleset }}
      player: ${{ steps.filter.outputs.player }}
      player_ready: ${{ steps.bootstrapped.outputs.player }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The client watches its OWN OpenAPI document as well as its own
          # directory. Without that, a backend pull request that regenerates the
          # contract matches only `backend`, no client job runs, and the drift
          # check below is dormant in precisely the case it exists to catch.
          # `backend/**` already covers that document for the backend job.
          filters: |
            backend:
              - 'backend/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              # Every backend job starts from this action, so a change to it is
              # a change to how the backend is built.
              - '.github/actions/setup-backend/**'
              # The judged-pairings tables live in the specs and are generated
              # from the backend's engine. Without these the drift check is
              # dormant in precisely the pull request that hand-edits one.
              # Named file by file, not 'docs/specs/matchmaking/**': the whole
              # backend job is a Postgres suite, and a neighbouring spec's
              # typo should not run it.
              - 'docs/specs/matchmaking/judged-pairings.json'
              - 'docs/specs/matchmaking/the-judged-pairings.md'
              - 'docs/specs/matchmaking/ranking-weights.md'
              # The synthetic ruleset diff, for the same reason one line up:
              # without these a pull request that hand-edits a generated
              # artifact runs no backend job, and the gate is dormant in
              # precisely the case it exists to catch (docs/adr/0119).
              - 'docs/specs/matchmaking/ruleset-diff/population.thin.json'
              - 'docs/specs/matchmaking/ruleset-diff/answers.thin.json'
            ruleset:
              - 'docs/specs/matchmaking/ruleset-diff/**'
              - 'backend/app/modules/matchmaking/infrastructure/rulesets/**'
            player:
              - 'frontend_player/**'
              - 'backend/openapi.player.json'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-player/**'

      # The frontend ships as architecture + config and may not have been
      # installed yet, so there may be no lockfile to build from. Gate its job on
      # one existing rather than failing every run until someone bootstraps it
      # — a permanently-red CI teaches people to ignore CI.
      # The job switches itself on the moment its pnpm-lock.yaml is committed.
      - id: bootstrapped
        run: |
          for app in player; do
            case $app in
              player) dir=frontend_player ;;
            esac
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=$dir not bootstrapped::Skipping $dir CI — no pnpm-lock.yaml yet. Run 'pnpm install' in $dir and commit the lockfile to enable it."
            fi
          done

  # **The half of the ruleset gate that is a signature** (docs/adr/0119 §4). The
  # recorded-corpus diff needs a database restore and cannot run here, so what
  # is asserted is that the pull request wrote its corpus window and coverage
  # down — presence, and never truth. Its own job, because it is the one check
  # that reads the pull request rather than the tree, and it must not sit behind
  # the backend job's Postgres service to say so.
  release-report:
    name: Ruleset release — the recorded-corpus report block
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ruleset == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Written to a file rather than interpolated into a shell command: a pull
      # request body is somebody else's text, and pasting it into a command line
      # is how a description becomes a script.
      - name: Read the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
      - name: The report block is present
        run: bash .github/scripts/check-release-report-block.sh "$RUNNER_TEMP/pr-body.txt"

  guardrails:
    name: Guardrail hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ownership + bash guards still match
        run: bash .claude/hooks/test-hooks.sh

  # ==========================================================================
  # Backend — four tiers, five jobs, all started together. Each one checks out,
  # restores the virtualenv from a cache keyed on poetry.lock, and runs one tier.
  # ==========================================================================

  backend-static:
    name: Backend — static (ruff, import boundaries, mypy, Poetry pin)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Before the pin is used, not after: the point is to be told the pinned
      # Poetry cannot read the lock instead of watching it warn and carry on.
      # Runs from the workspace root because the pins it compares live outside
      # backend/ too — this job's working-directory is backend/.
      - name: Poetry pin drift
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-poetry-pin-drift.sh
      - uses: ./.github/actions/setup-backend
      - name: Lint
        run: make lint
      - name: Import boundaries
        run: make lint-imports
      # `make check` has run mypy since long before CI did, and CI did not — so
      # the typecheck was a local courtesy, and the strict override
      # pyproject.toml scopes to the kernel and the engines would have been
      # enforced nowhere. A gate the pipeline does not run is not a gate.
      - name: Typecheck
        run: make typecheck

  # The whole suite, in parallel on the runner's two cores (`make test` is
  # `-n auto --dist worksteal`), and without coverage (ADR-0181 §3). Postgres
  # runs here and only here, because one test uses it. Splitting the suite across
  # runners is #489; until then this is the job the run waits on.
  backend-tests:
    name: Backend — tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: raketa
          POSTGRES_USER: raketa_user
          POSTGRES_PASSWORD: raketa_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raketa_user -d raketa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Test
        env:
          WRITER_DB_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          EVENT_TEST_DATABASE_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          DB_SSL_MODE: disable
          JWT_SECRET_KEY: ci-secret-do-not-use-in-prod
        run: bash ../.github/scripts/memory-peak.sh "backend tests" make test

  # Every committed artifact the backend generates, regenerated and compared.
  # They read the tree and write nothing that outlives their own step, so they
  # need no database and share one job.
  backend-artifacts:
    name: Backend — generated artifacts (contract, judged pairings, ruleset diff, taskdef)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      # Every emitted OpenAPI document, re-emitted and diffed. The dev console's
      # contract has no client and no codegen, so `check-contract-drift.sh` has
      # no purchase on it and **freshness** is the analogue (#256): regenerate
      # the document and diff the JSON. It watches openapi.player.json too,
      # because one command writes both — and because a stale player document is
      # invisible to the drift check, which regenerates the client's types from
      # it and finds them in perfect agreement.
      - name: Contract freshness
        run: bash .github/scripts/check-contract-freshness.sh
      # The six judged pairings, re-derived against the live ruleset: the tables
      # in the specs must reproduce, and QUALITY_FLOOR must still sit inside
      # max(Fit | not shown) < floor <= min(Fit | shown).
      - name: Judged pairings
        run: bash .github/scripts/check-judged-pairings.sh
      # The ruleset diff: the synthetic corpus, regenerated under two different
      # PYTHONHASHSEEDs and compared against the committed answers. **Shipping a
      # ruleset is an offline diff and a deploy** (docs/adr/0119), so a ruleset
      # edited without regenerating its diff fails here — and the report the
      # step prints is the diff the pull request has to argue for. It doubles as
      # a whole-pipeline determinism assertion, which is why the seed varies.
      - name: Ruleset diff
        run: bash .github/scripts/check-ruleset-diff.sh
      # The deployment artifact, exercised against the application rather than
      # described. Only `local` runs, so nothing else in this pipeline ever
      # constructs the production configuration or reads the entrypoint's own
      # numbers — which is how backend/deploy/ecs/taskdef.json came to supply
      # eleven variables and demand fourteen (#341), and to carry a kill deadline
      # that was a dead heat with the drain it had to outlive (#345). It asserts
      # presence and deadlines, never the values behind the secret ARNs, reads
      # nothing from AWS, and needs no credentials.
      - name: Task definition agrees with the app
        run: bash .github/scripts/check-taskdef.sh

  # **The "still fires" suites, over two jobs.** Each drives a gate above against
  # a deliberately broken tree and asserts it goes red — the reason
  # test-hooks.sh and test-contract-drift.sh exist: a gate added to a tree that
  # already satisfied it has never been seen to fail. Every one of them edits the
  # checkout and restores it on exit, so inside a job they run one after another.
  #
  # The split is by measured time, not by meaning: 84 s and 93 s of steps in the
  # last serial run (35829988150), against three minutes for the six in a row.
  backend-meta-1:
    name: Backend — still fires (Poetry pin, contract freshness, purity gates)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Poetry pin drift check still fires
        run: bash .github/scripts/test-poetry-pin-drift.sh
      # It hand-edits each emitted document and then moves a route's summary
      # without regenerating, and asserts the check goes red for each. Both
      # documents are driven: a suite that only broke the player one would leave
      # the document the check was added for unexercised.
      - name: Contract-freshness check still fires
        run: bash .github/scripts/test-contract-freshness.sh
      # The three purity gates — the import contracts, the kernel walk and strict
      # mypy — each driven against probe modules it writes into backend/app/ and
      # deletes on exit. **Last in its job**: nothing after it may read a tree a
      # probe could still be sitting in.
      - name: Purity gates still fire
        working-directory: backend
        run: bash scripts/test-purity-gates.sh

  backend-meta-2:
    name: Backend — still fires (judged pairings, ruleset diff, taskdef)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      # It perturbs the fixture and the two documents in the workspace and
      # restores them. Both halves are driven: a table nobody regenerated, and a
      # floor that has left its judged bound from either side.
      - name: Judged-pairings check still fires
        run: bash .github/scripts/test-judged-pairings.sh
      # It perturbs an artifact, then the live ruleset's quality floor, and
      # asserts the check goes red for each — including that a floor change is
      # classified weight-only, which is what keeps its owner off shadow
      # scoring for a change the recorded corpus can answer exactly.
      - name: Ruleset-diff check still fires
        run: bash .github/scripts/test-ruleset-diff.sh
      # It drops each variable from the task definition in turn, moves the kill
      # deadline, and then — the two cases the design rests on — perturbs the
      # *application* instead: a new refusal in config.py, and a --graceful-timeout
      # raised past the deadline. A check that had copied out its own list or its
      # own number would stay green through either.
      - name: Task-definition check still fires
        run: bash .github/scripts/test-taskdef.sh

  # ==========================================================================
  # Player app — four tiers, six jobs. Each is behind the bootstrap gate, and
  # each restores the pnpm store from a cache keyed on pnpm-lock.yaml.
  # ==========================================================================

  # Every static check `pnpm check` runs locally — CI skipped `format:check` and
  # `test:labels` until #488 — plus contract drift, which `pnpm check` does not run.
  player-static:
    name: Player — static (eslint, prettier, tsc, contract drift, label rule)
    needs: changes
    if: needs.changes.outputs.player == 'true' && needs.changes.outputs.player_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_player
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-player
      # Runs on a backend-only pull request too — the `player` filter above
      # watches backend/openapi.player.json. Regenerating with the app's own
      # pinned openapi-typescript, before typecheck, because the generated types
      # are typecheck's input.
      - name: Contract drift
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-contract-drift.sh frontend_player
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      # Every Pressable under Play carries an accessibilityLabel or hides itself,
      # driven through the real linter at code that breaks the rule, and the
      # baseline colour and fontWeight bans the same block re-declares.
      - name: The Play label rule still fires
        run: pnpm test:labels

  # **Every suite but the deck, in three shards of two workers each.** Jest runs
  # one fewer worker than the machine has cores, so on this runner it ran one,
  # and 293 suites took six minutes. Two workers per shard is a claim about 8 GB,
  # which is why the run records its peak: if it ever starves the runner, the
  # answer is one worker and a fourth shard — never a re-run.
  #
  # The shard is derived from the matrix, never typed beside it: `job-index` and
  # `job-total` always name 1/N … N/N of the same N, so adding a shard is adding
  # an entry to the list, and no suite can fall between two numbers that
  # disagree. Jest partitions the suites that survive the ignore pattern, so the
  # deck is in no shard.
  player-tests:
    name: Player — tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.player == 'true' && needs.changes.outputs.player_ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one red shard shows every failure, not
      # the first one's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend_player
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-player
        id: setup
        with:
          jest-cache: shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
      - name: Test
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
          JEST_CACHE: ${{ steps.setup.outputs.jest-cache-dir }}
        run: >-
          bash ../.github/scripts/memory-peak.sh "Jest shard $((SHARD + 1))/$SHARDS"
          pnpm test -- --shard="$((SHARD + 1))/$SHARDS" --maxWorkers=2 --cacheDirectory "$JEST_CACHE"
          --testPathIgnorePatterns "/node_modules/" "src/features/play/components/deck\.test\.tsx"

  # **The deck runs in a job and a process of its own, because one file out of
  # 298 needs ten times the memory of any other and nothing else should pay for
  # it.** Measured with `--logHeapUsage` over the whole run: `deck.test.tsx`
  # peaks at 5389 MB and the next heaviest suite at 541 MB. It mounts the entire
  # router tree 78 times in one process, through the radar's
  # gesture-and-animation pane.
  #
  # Node sizes its default heap from the machine — 8 GB here; this comment once
  # said 16 — so sharing a run with the deck killed the job twice, in two
  # different ways, and **neither read as a test failure**:
  #
  #   · heap raised, nothing else — the deck's worker aborted with SIGABRT
  #     (exit 134) with every assertion in it passing;
  #   · heap raised for two capped workers — a jest worker is reused across
  #     suites and gives nothing back, so one crawled upward through ~147 of
  #     them while the other held the deck, and together they starved the
  #     runner agent: 56 minutes, then "lost communication with the server";
  #   · heap raised with a recycle rule — bounded, but the 8 GB heap's major
  #     GCs and the worker restarts stalled the event loop, and seven
  #     timing-sensitive router suites blew their 5000 ms test budgets.
  #
  # So the deck is taken out of the shared run instead of the shared run being
  # bent around it. **Every other suite keeps Node's own heap**, and **the deck
  # gets one process to itself**, where `--runInBand` means no worker to restart
  # and no second peak to meet. `testMatch` is confined to `src/`, so naming
  # `/node_modules/` beside the deck in the shards' ignore pattern only restores
  # the default that flag would otherwise replace.
  #
  # The deck's appetite is the thing to fix. This is what stops it failing a
  # build while it is still there.
  player-deck:
    name: Player — the deck, in a process of its own
    needs: changes
    if: needs.changes.outputs.player == 'true' && needs.changes.outputs.player_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_player
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-player
        id: setup
        with:
          jest-cache: deck
      - name: Test — the deck, in a process of its own
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          JEST_CACHE: ${{ steps.setup.outputs.jest-cache-dir }}
        run: >-
          bash ../.github/scripts/memory-peak.sh "the deck"
          pnpm test -- --runTestsByPath src/features/play/components/deck.test.tsx --runInBand
          --cacheDirectory "$JEST_CACHE"

  player-meta:
    name: Player — still fires (import boundaries, contract drift)
    needs: changes
    if: needs.changes.outputs.player == 'true' && needs.changes.outputs.player_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_player
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-player
      # A native module may be imported from exactly one port, and the keychain
      # from exactly one module. Every one of those bans was added to a tree that
      # already satisfied it, so none has ever been seen to fail — which is
      # indistinguishable from one that cannot. This feeds the real linter code
      # that breaks each rule and asserts it goes red. Nothing is written to
      # disk: the violations arrive on stdin.
      - name: Verify the import boundaries still fire
        run: pnpm test:boundaries
      # It perturbs the contract in the workspace and restores it. A drift check
      # nothing exercises is one that can stop matching without anybody
      # noticing — the argument test-hooks.sh already makes for the guardrail
      # hooks.
      - name: Verify the drift check itself fires
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/test-contract-drift.sh
      # No `build` step: a release build is `eas build`, which is a deliberate
      # human-triggered action, not part of PR CI. See docs/adr/0008.

  # ==========================================================================
  # ci-ok — the one status to read (ADR-0181 §4, .github/scripts/check-ci-ok.sh).
  # ==========================================================================
  #
  # It needs every job above, one per line, and `make ci-ok` fails the day one
  # is missing. `always()` on the job and on every step, because anything less
  # skips it when a need failed or the run was cancelled — and a skipped check
  # reads as passing. It proves its verdict goes red before it renders one.
  #
  # **Nothing enforces it yet.** A private repository on this plan has no
  # branch protection (ADR-0180), so ci-ok is what a human reads before merging,
  # not a check GitHub requires.
  ci-ok:
    name: ci-ok
    needs:
      - changes
      - release-report
      - guardrails
      - backend-static
      - backend-tests
      - backend-artifacts
      - backend-meta-1
      - backend-meta-2
      - player-static
      - player-tests
      - player-deck
      - player-meta
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: always()
      - name: ci-ok still fires
        if: always()
        run: bash .github/scripts/test-ci-ok.sh
      - name: ci-ok needs every job in this workflow
        if: always()
        run: bash .github/scripts/check-ci-ok.sh wiring
      - name: Every needed job succeeded or was skipped
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/check-ci-ok.sh verdict
