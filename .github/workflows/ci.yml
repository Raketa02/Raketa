name: CI

# Each app is gated independently and only when it changed — a Next.js edit
# should not re-run the backend's Postgres suite. The guardrail hooks are
# checked on every run because they protect the whole repo.
on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  # `dorny/paths-filter` asks the API which files a *pull request* touched, rather
  # than diffing locally as it does for a push — so without this the detect job
  # fails with "Resource not accessible by integration" and every app job skips
  # behind it, which reads as a green run that tested nothing. It went unnoticed
  # until the first pull request, because pushes never take the API path.
  pull-requests: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      club: ${{ steps.filter.outputs.club }}
      player: ${{ steps.filter.outputs.player }}
      club_ready: ${{ steps.bootstrapped.outputs.club }}
      player_ready: ${{ steps.bootstrapped.outputs.player }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each client watches its OWN OpenAPI document as well as its own
          # directory. Without that, a backend pull request that regenerates the
          # contract matches only `backend`, no client job runs, and the drift
          # check below is dormant in precisely the case it exists to catch.
          # `backend/**` already covers those documents for the backend job.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            club:
              - 'frontend_club/**'
              - 'backend/openapi.club.json'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
            player:
              - 'frontend_player/**'
              - 'backend/openapi.player.json'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

      # The two frontends ship as architecture + config; neither has been
      # installed yet, so there is no lockfile to build from. Gate their jobs on
      # one existing rather than failing every run until someone bootstraps them
      # — a permanently-red CI teaches people to ignore CI.
      # Each job switches itself on the moment its pnpm-lock.yaml is committed.
      - id: bootstrapped
        run: |
          for app in club player; do
            case $app in
              club)   dir=frontend_club   ;;
              player) dir=frontend_player ;;
            esac
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=$dir not bootstrapped::Skipping $dir CI — no pnpm-lock.yaml yet. Run 'pnpm install' in $dir and commit the lockfile to enable it."
            fi
          done

  guardrails:
    name: Guardrail hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ownership + bash guards still match
        run: bash .claude/hooks/test-hooks.sh

  backend:
    name: Backend — lint & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: raketa
          POSTGRES_USER: raketa_user
          POSTGRES_PASSWORD: raketa_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raketa_user -d raketa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        run: pip install poetry==1.8.3
      - name: Install deps
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      - name: Lint
        run: poetry run ruff check .
      - name: Import boundaries
        run: poetry run lint-imports
      # `make check` has run mypy since long before this step existed, and CI did
      # not — so the typecheck was a local courtesy, and the strict override
      # pyproject.toml scopes to the kernel and the engines would have been
      # enforced nowhere. A gate the pipeline does not run is not a gate.
      - name: Typecheck
        run: poetry run mypy app
      # `WRITER_DB_URL` here does NOT put the API suite on Postgres — tests/conftest.py
      # builds its own in-memory SQLite engine and always has. What reads these is
      # tests/integration/, whose cases assert two guarantees SQLite cannot express.
      # That suite requires a database when `CI` is set rather than when a variable
      # below is set, so deleting the `postgres` service or these three lines turns it
      # red instead of turning it off (#62, tests/integration/postgres.py).
      - name: Test
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          WRITER_DB_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          EVENT_TEST_DATABASE_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          DB_SSL_MODE: disable
          JWT_SECRET_KEY: ci-secret-do-not-use-in-prod
        run: poetry run pytest tests --cov=app --cov-report=xml -q
      # Last, and for the reason test-hooks.sh and test-contract-drift.sh exist:
      # the three purity gates above were all added to a tree that already
      # satisfied them, so none of them has ever been seen to fail. This drives
      # each one against a deliberately impure tree and asserts it goes red.
      - name: Purity gates still fire
        run: bash scripts/test-purity-gates.sh
      # Same argument, applied to the two constraints only Postgres enforces: both
      # assertions were written against a schema that already satisfied them, so
      # neither had ever been observed to fail. This breaks each constraint in turn
      # and asserts the suite goes red.
      - name: Postgres guarantee gates still fire
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://raketa_user:raketa_pwd@localhost:5432/raketa
          DB_SSL_MODE: disable
          JWT_SECRET_KEY: ci-secret-do-not-use-in-prod
        run: bash scripts/test-postgres-gates.sh

  club:
    name: Club web — lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.club == 'true' && needs.changes.outputs.club_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_club
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend_club/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # Inert until frontend_club is bootstrapped (#65): the whole job is gated
      # on club_ready, so this step turns on by itself when the lockfile lands.
      - name: Contract drift
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-contract-drift.sh frontend_club
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  player:
    name: Player app — lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.player == 'true' && needs.changes.outputs.player_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_player
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend_player/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # Runs on a backend-only pull request too — the `player` filter above
      # watches backend/openapi.player.json. Regenerating with the app's own
      # pinned openapi-typescript, before typecheck, because the generated types
      # are typecheck's input.
      - name: Contract drift
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-contract-drift.sh frontend_player
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Last, and after the check it tests: it perturbs the contract in the
      # workspace and restores it. A drift check nothing exercises is one that
      # can stop matching without anybody noticing — the argument test-hooks.sh
      # already makes for the guardrail hooks.
      - name: Verify the drift check itself fires
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/test-contract-drift.sh
      # No `build` step: a release build is `eas build`, which is a deliberate
      # human-triggered action, not part of PR CI. See docs/adr/0008.
