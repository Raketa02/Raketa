services:
  api:
    image: robertconstantin02/basebackend_api:prod
    container_name: api
    restart: always
    env_file:
      - .env.prod
    ports:
      - '8000:8000'
    secrets:
      - postgres_password
    volumes:
      - /home/ubuntu/basebackend/.secrets/client.crt:/certs/client.crt:ro
      - /home/ubuntu/basebackend/.secrets/client.key:/certs/client.key:ro
      - /home/ubuntu/basebackend/.secrets/rootCA.crt:/certs/rootCA.crt:ro
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    image: redis:7.2
    restart: unless-stopped
    networks:
      - backend

secrets:
  postgres_password:
    file: .secrets/postgres_password.txt

networks:
  backend:
    driver: bridge

volumes:
  pgdata: